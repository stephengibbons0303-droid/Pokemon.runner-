<script>
"use strict";
/* ============================================================
   SPARK RUN — a maths-choice runner for ~Year 2/3 (ages 6–8)
   Single file. Original art + original chiptune. No deps.
   Mechanic: creature auto-runs; tap hops it UP one lane
   (ground→mid→high→ground). Three answers float at those
   lane heights. The lane it's in when the gate arrives = answer.
   ============================================================ */

const cv = document.getElementById('game');
const g  = cv.getContext('2d');
const W = 960, H = 540;                 // fixed virtual resolution

// offscreen buffers: one for isolated sprite tinting, one for the pixel-art background pass
const tintBuf=document.createElement('canvas'); const tg=tintBuf.getContext('2d');
const pixBuf =document.createElement('canvas'); const pxg=pixBuf.getContext('2d');
const PIXEL=4;                          // background block size (chunky 8-bit look)
// draw a sprite region with a red tint that sticks to the sprite's own pixels
// (compositing in a private buffer, so it never floods the whole bounding box)
function drawTinted(src, sx,sy,sw,sh, dx,dy,dw,dh, rgba){
  const bw=Math.max(1,Math.ceil(dw)), bh=Math.max(1,Math.ceil(dh));
  tintBuf.width=bw; tintBuf.height=bh;
  tg.clearRect(0,0,bw,bh); tg.imageSmoothingEnabled=true; tg.globalCompositeOperation='source-over';
  tg.drawImage(src, sx,sy,sw,sh, 0,0,dw,dh);
  tg.globalCompositeOperation='source-atop'; tg.fillStyle=rgba; tg.fillRect(0,0,bw,bh);
  g.drawImage(tintBuf, dx,dy);
}
// re-sample whatever is currently on the canvas (the background) at low res and blow it
// back up with no smoothing -> chunky pixels that echo the pixel-art sprites
function pixelateBackground(){
  const lw=Math.floor(W/PIXEL), lh=Math.floor(H/PIXEL);
  pixBuf.width=lw; pixBuf.height=lh;
  pxg.imageSmoothingEnabled=false; pxg.clearRect(0,0,lw,lh);
  pxg.drawImage(cv, 0,0,W,H, 0,0,lw,lh);
  g.imageSmoothingEnabled=false; g.drawImage(pixBuf, 0,0,lw,lh, 0,0,W,H);
  g.imageSmoothingEnabled=true;
}

celeb.img.onload = ()=>{ celeb.ready=true; };
celeb.img.src = 'pikachu-celebrate.png';
const BOSS_X = 760, BOSS_Y = 232, BOSS_H = 280;   // boss anchor + on-screen height
// one boss per level — drop a PNG in and set its file; null = drawn placeholder.
// (more Pokémon to come; each gets its own sprite + tint.)
const BOSSES = [

      { name:'Dragon Pulse', file:'luca_dragonpulse.png', col:'#9be86a' },

    ] },
  { name:'Venusaur',  file:'venusaur.png', tint:'#3f9a4a', moves:[

const bossImgs={};                                // lazy sprite cache, keyed by filename
// Some source PNGs ship with a semi-transparent dark fringe (a low-alpha matte
// ring) that reads as a black box over the bright sky. On load we flood-fill in
// from the borders through any low-alpha pixels and knock them fully clear — this
// erases the halo while leaving the solid sprite (and its interior dark parts,
// e.g. Lucario's black, which keep full alpha) untouched.
function cleanSprite(o){
  try{
    const im=o.img, w=im.width, h=im.height;
    if(!w||!h) return;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const cx=c.getContext('2d'); cx.drawImage(im,0,0);
    const id=cx.getImageData(0,0,w,h), d=id.data, CUT=180, seen=new Uint8Array(w*h), stack=[];
    const push=(x,y)=>{ if(x<0||y<0||x>=w||y>=h) return; const i=y*w+x; if(seen[i]||d[i*4+3]>=CUT) return; seen[i]=1; stack.push(i); };
    for(let x=0;x<w;x++){ push(x,0); push(x,h-1); }
    for(let y=0;y<h;y++){ push(0,y); push(w-1,y); }
    while(stack.length){ const i=stack.pop(); d[i*4+3]=0; const x=i%w, y=(i/w)|0; push(x+1,y); push(x-1,y); push(x,y+1); push(x,y-1); }
    cx.putImageData(id,0,0); o.cnv=c;
  }catch(e){ /* tainted canvas (e.g. file://) — fall back to the raw image */ }
}
function bossSprite(file){
  if(!file) return null;
  if(!bossImgs[file]){ const o={img:new Image(),ready:false,cnv:null}; o.img.onload=()=>{ cleanSprite(o); o.ready=true; }; o.img.src=file; bossImgs[file]=o; }
  return bossImgs[file];
}
// the drawable for a sprite: the cleaned canvas if we have it, else the raw image
function spr2d(s){ return s ? (s.cnv||s.img) : null; }

// A run/jump sheet is sliced into equal frames, but the source art lets each
// Pokémon's tail spill across a cell boundary — so a frame ends up with a
// detached scrap of its neighbour's tail. For every frame we keep only the
// largest connected blob (the real body+tail) and clear the strays.
function cleanSheet(img, frames){
  try{
    const w=img.width, h=img.height, fw=Math.floor(w/frames), CUT=40;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const cx=c.getContext('2d'); cx.drawImage(img,0,0);
    const id=cx.getImageData(0,0,w,h), d=id.data;
    for(let f=0;f<frames;f++){
      const x0=f*fw, x1=(f===frames-1)?w:x0+fw, fwid=x1-x0;
      const lab=new Int32Array(fwid*h), sizes=[0], stack=[]; let cur=0;
      const solid=(nx,ny)=> d[(ny*w+(x0+nx))*4+3] > CUT;
      for(let y=0;y<h;y++) for(let x=0;x<fwid;x++){
        const li=y*fwid+x;
        if(lab[li] || !solid(x,y)) continue;
        cur++; sizes[cur]=0; stack.length=0; stack.push(li); lab[li]=cur;
        while(stack.length){
          const k=stack.pop(); sizes[cur]++; const kx=k%fwid, ky=(k/fwid)|0;
          if(kx+1<fwid){ const ni=k+1;    if(!lab[ni]&&solid(kx+1,ky)){ lab[ni]=cur; stack.push(ni); } }
          if(kx-1>=0)  { const ni=k-1;    if(!lab[ni]&&solid(kx-1,ky)){ lab[ni]=cur; stack.push(ni); } }
          if(ky+1<h)   { const ni=k+fwid; if(!lab[ni]&&solid(kx,ky+1)){ lab[ni]=cur; stack.push(ni); } }
          if(ky-1>=0)  { const ni=k-fwid; if(!lab[ni]&&solid(kx,ky-1)){ lab[ni]=cur; stack.push(ni); } }
        }
      }
      let best=1; for(let i=2;i<sizes.length;i++) if(sizes[i]>sizes[best]) best=i;
      for(let y=0;y<h;y++) for(let x=0;x<fwid;x++){ const li=y*fwid+x; if(lab[li]&&lab[li]!==best) d[(y*w+(x0+x))*4+3]=0; }
    }
    cx.putImageData(id,0,0); return c;
  }catch(e){ return null; }   // tainted canvas (e.g. file://) — fall back to the raw sheet
}

// Pikachu's move set — 2 at level 1, learn one more each level you clear.
// unlock = level index the move becomes available; cost/gain feed the charge meter.
const MAX_CHARGE = 6;
const PIKA_MOVES = [

  { key:'tb', name:'Thunderbolt',  file:'pika_thunderbolt.png', dmg:2, cost:1, gain:0, col:'#ffe14a', unlock:0, blurb:'Strong bolt' },
  { key:'eb', name:'Electro Ball', file:'pika_electroball.png', dmg:3, cost:2, gain:0, col:'#ffc23a', unlock:1, blurb:'Big hit' },
  { key:'ew', name:'Electroweb',   file:'pika_electroweb.png',  dmg:1, cost:1, gain:0, shield:1, col:'#8fe0ff', unlock:2, blurb:'Blocks 1 hit' },
  { key:'it', name:'Iron Tail',    file:'pika_irontail.png',    dmg:4, cost:3, gain:0, col:'#dfe3ea', unlock:3, blurb:'Heavy slam' },
  { key:'cm', name:'Charm',        file:'pika_charm.png',       dmg:0, cost:0, gain:2, col:'#ff9ed6', unlock:4, blurb:'+2 charge' },
  { key:'rf', name:'Reflect',      file:'pika_reflect.png',     dmg:0, cost:1, gain:0, shield:2, col:'#b9a6ff', unlock:5, blurb:'Blocks 2 hits' },
  { key:'gx', name:'G-Max Volt Crash', file:'pika_gmax.png',    dmg:8, cost:5, gain:0, col:'#ff5a3c', unlock:6, blurb:'ULTIMATE' },
];
function availMoves(){ return PIKA_MOVES.filter(m=>m.unlock<=levelIdx); }
function curMove(){ return PIKA_MOVES.find(m=>m.key===equipped) || PIKA_MOVES[1]; }
function canCast(m){ return charge>=m.cost; }
function newMoveAt(lvl){ return PIKA_MOVES.find(m=>m.unlock===lvl); }   // move learned entering this level

/* ---------- lane geometry ---------- */
const FLOOR_Y = 472;
const LANE_Y  = [430, 318, 206];        // [ground, mid, high] = creature CENTER y
const PLAYER_X = 232;                    // creature x (also the "choice line")
const CARD_W = 122, CARD_H = 100;        // answer container size

/* ---------- palette ---------- */
const C = {
  skyTop:'#2b1a4a', skyMid:'#5b3a8c', skyLow:'#c8688f',
  sun:'#ffd27a', coral:'#ff7a85', mint:'#9af0c6', leaf:'#3aa873', leafDk:'#2c8a5d',
  ink:'#231635', cream:'#fff4e6', glow:'#ffe08a', spark:'#aee9ff'
};

/* ============================================================
   AUDIO — original 80s-ish synth, generated live (Web Audio)
   ============================================================ */
const Audio8 = (()=> {
  let ctx=null, master=null, started=false, muted=false, timer=null, step=0;const bgm = new Audio('music.mp3');   // file sitting next to the .html
bgm.loop = true; bgm.volume = 0.5;
const cheer = new Audio('levelup.mp3'); cheer.volume = 0.85;   // end-of-level celebration
const fast = new Audio('music2.mp3'); fast.loop = true; fast.volume = 0;   // speed-run track
let speedOn=false, fadeT=null; const NORM_VOL=0.5, FAST_VOL=0.6;
function crossfade(toFast){
  if(fadeT) clearInterval(fadeT);
  const up = toFast?fast:bgm, dn = toFast?bgm:fast;
  if(!muted){ up.play().catch(()=>{}); }
  fadeT=setInterval(()=>{
    up.volume=Math.min(toFast?FAST_VOL:NORM_VOL, up.volume+0.05);
    dn.volume=Math.max(0, dn.volume-0.05);
    if(dn.volume<=0.001){ dn.pause(); clearInterval(fadeT); fadeT=null; }
  },45);
}
  // bouncy A-minor-ish loop (original): bass, arp, soft hat
  const bass = [57,57,55,52, 53,53,50,48];                 // MIDI
  const arp  = [72,76,79,76, 71,74,77,74, 69,72,76,72, 65,69,72,69];
  const m2f = m => 440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value=0.16; master.connect(ctx.destination);
  }
  function blip(freq,t,dur,type,gain,glideTo){
    const o=ctx.createOscillator(), a=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
    a.gain.setValueAtTime(0.0001,t);
    a.gain.exponentialRampToValueAtTime(gain,t+0.012);
    a.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(a); a.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function hat(t){ // noise burst
    const b=ctx.createBuffer(1, ctx.sampleRate*0.05, ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
    const ga=ctx.createGain(); ga.gain.value=0.10; s.connect(hp); hp.connect(ga); ga.connect(master); s.start(t);
  }
  function loop(){
    if(!ctx) return;
    const spb=0.16; const t=ctx.currentTime+0.03;
    const a=arp[step%arp.length]; const b=bass[Math.floor(step/2)%bass.length];
    blip(m2f(a), t, spb*0.9, 'square', 0.10);
    if(step%2===0) blip(m2f(b-12), t, spb*1.6, 'triangle', 0.18);
    if(step%2===1) hat(t);
    step++;
  }
  return {
    toggle(){ muted=!muted; if(muted){ bgm.pause(); fast.pause(); } else if(started){ (speedOn?fast:bgm).play().catch(()=>{}); } return muted; },
    isMuted(){return muted;},
    startMusic(){ ensure(); if(started) return; started=true; if(!muted) bgm.play().catch(()=>{}); },
    setSpeed(on){ if(on===speedOn) return; speedOn=on; if(started) crossfade(on); },
    isSpeed(){ return speedOn; },
    cheer(){ if(muted) return; try{ cheer.currentTime=0; cheer.play().catch(()=>{}); }catch(e){} },
    sfx(kind){
      ensure(); if(!ctx||muted) return; if(ctx.state==='suspended')ctx.resume();
      const t=ctx.currentTime+0.01;
      if(kind==='hop'){ blip(660,t,0.12,'square',0.16,1180); }
      else if(kind==='good'){
        // warm rising arpeggio + bright twinkle = "ding, correct!"
        [784,988,1318,1568].forEach((f,i)=>blip(f,t+i*0.05,0.16,'triangle',0.18));
        blip(2093,t+0.20,0.14,'sine',0.10,2637);
        blip(2637,t+0.27,0.22,'sine',0.07);
      }
      else if(kind==='bad'){ blip(200,t,0.28,'sawtooth',0.16,120); }
      else if(kind==='win'){ [523,659,784,1046,1318].forEach((f,i)=>blip(f,t+i*0.09,0.2,'triangle',0.18)); }
      else if(kind==='select'){ blip(880,t,0.08,'square',0.12); }
    }
  };
})();

/* ============================================================
   MATHS — 5 levels on a gentle incremental ramp
   L1 addition only → L2 subtraction only → L3 mix of + and − →
   L4 multiplication only (2,5,10 then 3,4) →
   L5 mix of +, −, × (× uses the hard tables 6,7,8,9).
   Every question stays a plain `a ○ b = ?` with an integer
   answer, so it fits the banner and the answer lanes.
   ============================================================ */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];

// each level is a 25-question run: gen(step 0..24) -> {q,ans}.
// optional bossGen() gives the end-of-level duel its own flavour of questions.
const LEVELS = [
  { name:'Bloom Meadow',  theme:'balloon', count:25,
    // L1 — addition, eased in: a couple of "1 + n", then single digits, then
    // two-digit + two-digit with NO carrying (23+23, 17+11), and only at the
    // end do carrying sums arrive as friendly round doubles (25+25, 45+45).
    gen:s=>{
      if(s<2){ const b=rnd(1,4); return {q:`1 + ${b}`, ans:1+b}; }
      if(s<10){ const a=rnd(2,6), b=rnd(2,6); return {q:`${a} + ${b}`, ans:a+b}; }
      if(s<19){ const ta=rnd(1,2), tb=rnd(1,2), ua=rnd(0,9), ub=rnd(0,9-ua);   // no carry: units sum ≤ 9
                const a=ta*10+ua, b=tb*10+ub; return {q:`${a} + ${b}`, ans:a+b}; }
      const a=pick([15,25,35,45,55]), b=pick([15,25,35,45,55]); return {q:`${a} + ${b}`, ans:a+b}; },
    // boss — two-digit + single-digit, usually bridging a ten (46+5, 81+9…)
    bossGen:()=>{ const a=rnd(21,89), b=rnd(4,10); return {q:`${a} + ${b}`, ans:a+b}; } },
  { name:'Orchard Hop',   theme:'apple', count:25,
    // L2 — subtraction only, growing from the teens toward ~30
    gen:s=>{ const a=rnd(11,Math.min(30,13+s)); const b=rnd(3,Math.min(15,a-2)); return {q:`${a} − ${b}`, ans:a-b}; } },
  { name:'Bubble Bay',    theme:'bubble', count:25,
    // L3 — mix of + and −, two-digit with carrying / borrowing (kept under 100)
    gen:s=>{ const big=Math.min(70,16+s*2);
             if(s%2===0){ const a=rnd(12,big), b=rnd(8,Math.min(big,29)); return {q:`${a} + ${b}`, ans:a+b}; }
             const a=rnd(22,Math.min(95,big+20)), b=rnd(8,Math.min(a-5,29)); return {q:`${a} − ${b}`, ans:a-b}; } },
  { name:'Crystal Caves', theme:'crystal', count:25,
    // L4 — multiplication only: start 2/5/10, widen to 3/4 deeper in
    gen:s=>{ const t = s<6 ? pick([2,5,10]) : pick([2,5,10,3,4]); const n=rnd(2,Math.min(12,4+s)); return {q:`${t} × ${n}`, ans:t*n}; } },
  { name:'Star Summit',   theme:'crystal', count:25,
    // L5 — mix of +, − and × ; the × uses the hard tables 6,7,8,9
    gen:s=>{ const r=rnd(0,2);
             if(r===0){ const a=rnd(15,35), b=rnd(10,28); return {q:`${a} + ${b}`, ans:a+b}; }
             if(r===1){ const a=rnd(25,55), b=rnd(8,Math.min(a-5,29)); return {q:`${a} − ${b}`, ans:a-b}; }
             const t=pick([6,7,8,9]), n=rnd(2,Math.min(12,6+s)); return {q:`${t} × ${n}`, ans:t*n}; } },
];

function makeChoices(ans){
  // build two plausible near-miss distractors (off by 1/2/3/10 — common slips)
  const set=new Set([ans]);
  const cand=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3,ans-3];
  let guard=0;
  while(set.size<3 && guard++<60){ const d=pick(cand)+rnd(-1,1); if(d>=0 && d!==ans) set.add(d); }
  while(set.size<3){ set.add(ans+set.size+2); }            // absolute fallback
  const distract=[...set].filter(v=>v!==ans);
  // drop the correct answer into a uniformly-random lane so it's never predictable
  const out=[null,null,null], correctLane=rnd(0,2);
  out[correctLane]=ans;
  let di=0; for(let i=0;i<3;i++){ if(i!==correctLane) out[i]=distract[di++]; }
  return out;
}

// little stumble on a wrong answer: a grey dust puff + a few dizzy "★" sparks over Pikachu's head
function oopsPuff(x,y){
  player.mood='oops'; player.moodT=0.8;
  for(let i=0;i<9;i++) confetti.push({x:x+(Math.random()-0.5)*20,y:y-6,vx:(Math.random()-0.5)*150,vy:-Math.random()*130-20,life:0.7,r:3+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-0.5)*12,c:pick(['#cfc7e0','#9a90b5','#fff'])});

function resetRun(){ levelIdx=0; stepInLvl=0; score=0; streak=0; hearts=3; prizes=[]; player.lane=0; player.y=LANE_Y[0]; player.targetY=LANE_Y[0]; setSpeedMode(false); boss=null; bossChal=null; zaps=[]; bossMsgT=0; bossCut=null; moveIdx=0; equipped='tb'; pikaAtk=null; pikaShield=0; charge=2; }

function startLevel(i){
  levelIdx=i; stepInLvl=0; state='play'; hearts=3;       // fresh 3 lives each level (shared with its boss)
  player.lane=0; player.y=LANE_Y[0]; player.targetY=LANE_Y[0];
  spawnGate();
}

function spawnGate(){
  const L=LEVELS[levelIdx];
  const {q,ans}=L.gen(stepInLvl);
  const choices=makeChoices(ans);
  // slow at first; ramps with step and level, but capped so a 25-question run stays fair
  const base=92 + levelIdx*16;
  speed = base + Math.min(90, stepInLvl*5);
  gate={ x:W+CARD_W, q, ans, choices, correctLane:choices.indexOf(ans), locked:false, result:null, resolveT:0 };
  player.lane=0; player.targetY=LANE_Y[0]; player.air=false; player.reachedApex=false;
}

/* ============================================================
   BOSS BATTLE — a Pokémon caps every level (math attack duel)
   Each question: jump to the right answer → Pikachu Thunderbolt,
   boss −1 HP. A wrong answer → the boss strikes, −1 heart.
   Empty the HP bar to defeat it. (One boss per level.)
   ============================================================ */
function enterBoss(){
  state='boss'; gate=null; setSpeedMode(false);
  const cfg=BOSSES[levelIdx]||BOSSES[BOSSES.length-1];
  const hp=4+levelIdx*3;                              // scaled so 1–3 dmg moves take a few turns
  boss={ cfg, hp, maxHp:hp, hurt:0, bob:0, enter:1.2, defeated:false, deadT:0, atk:0 };
  bossChal=null; bossSpeed=140 + levelIdx*16; bossCut=null; moveIdx=0; pikaAtk=null; pikaShield=0; charge=2;
  if(cfg.hurtFile) bossSprite(cfg.hurtFile);               // preload reaction frame
  if(!availMoves().some(m=>m.key===equipped)) equipped='tb';
  bossMsg='A wild '+cfg.name+' appeared!'; bossMsgT=2.0;
  player.lane=0; player.targetY=LANE_Y[0]; player.air=false; player.reachedApex=false;
}
// boss strikes back: play the next signature-move cut-in (Gyarados has 4)
function bossAttack(){
  const mv=boss.cfg.moves;
  if(!mv||!mv.length){ boss.atk=0.5; flash={a:0.45,col:'#ffb3b8'}; bossMsg='It struck back!'; bossMsgT=1.0; return; }
  const m=mv[moveIdx%mv.length]; moveIdx++;
  bossCut={ m, spr:bossSprite(m.file), t:0, dur:1.35 };
  boss.atk=0.6; flash={a:0.5,col:m.col};
  bossMsg=boss.cfg.name+' used '+m.name+'!'; bossMsgT=1.35;
  return bossCut.dur;
}
function spawnChallenge(){
  player.lane=0; player.targetY=LANE_Y[0]; player.air=false; player.reachedApex=false;
  const L=LEVELS[levelIdx];
  // boss uses its own question style if defined, else the level's hardest stretch
  const {q,ans} = L.bossGen ? L.bossGen() : L.gen(rnd(Math.floor(L.count*0.6), L.count-1));
  const choices=makeChoices(ans);
  bossChal={ x:W+CARD_W, q, ans, choices, correctLane:choices.indexOf(ans), locked:false, result:null, resolveT:0 };
}
// Pikachu unleashes the equipped move on the boss
function pikaFire(m){
  pikaAtk={ m, spr:bossSprite(m.file), t:0, dur:0.62 };
  if(m.dmg>0){ zaps.push({ life:0.30, max:0.30, x1:PLAYER_X+40, y1:player.y-6, x2:BOSS_X-60, y2:BOSS_Y }); correctPop(BOSS_X-60, BOSS_Y); }
  else correctPop(PLAYER_X+30, player.y-10);     // setup moves sparkle on Pikachu
}
function bossDefeated(){
  prizes.push(levelIdx);
  Audio8.sfx('win'); Audio8.cheer();
  for(let i=0;i<60;i++) confetti.push({x:W/2,y:H/2,vx:(Math.random()-0.5)*520,vy:-Math.random()*420-80,life:1.6,r:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-0.5)*14,c:pick([C.glow,C.coral,C.mint,C.spark,'#fff'])});
  state = (levelIdx>=LEVELS.length-1)?'won':'levelup';
}

/* ---------- input: tap = jump to mid lane, double-tap = double jump to high ----------
   Each tap raises one lane (ground→mid→high); she can't go past high until she lands.
   After the gate locks she falls back to the ground (apex pose held during the drop). */
function hop(){
  if(state==='menu'){ Audio8.startMusic(); startLevel(0); return; }
  if(state==='over'||state==='won'){ resetRun(); state='menu'; return; }
  if(state==='levelup'){ startLevel(levelIdx+1); return; }
  // jumping applies to normal gates AND boss challenges
  const active = state==='play' ? gate : (state==='boss' ? bossChal : null);
  if(!active || active.locked) return;
  if(player.lane>=2) return;             // already at the highest lane
  player.lane++;
  player.targetY=LANE_Y[player.lane];
  player.air=true; player.reachedApex=false; player.jumpT=0;
  Audio8.sfx('hop');
}

/* mute button hit-test region (top-right) */
const MUTE={x:W-58,y:18,w:40,h:40};
function pointInMute(px,py){ return px>=MUTE.x&&px<=MUTE.x+MUTE.w&&py>=MUTE.y&&py<=MUTE.y+MUTE.h; }

function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY);
  // account for object-fit:contain letterboxing
  const scale=Math.min(r.width/W, r.height/H);
  const offX=(r.width - W*scale)/2, offY=(r.height - H*scale)/2;
  return { x:(cx-r.left-offX)/scale, y:(cy-r.top-offY)/scale };
}
function onPress(e){
  e.preventDefault();
  const p=canvasPoint(e);
  if(pointInMute(p.x,p.y)){ Audio8.toggle(); Audio8.sfx('select'); return; }
  if(state==='boss'){                                  // tap a move button to equip it (not a jump)
    for(const r of moveBarRects()){
      if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){
        if(!canCast(r.m)){ Audio8.sfx('bad'); return; }       // not enough charge
        if(equipped!==r.m.key){ equipped=r.m.key; Audio8.sfx('select'); }
        return;
      }
    }
  }
  hop();
}
cv.addEventListener('mousedown',onPress);
cv.addEventListener('touchstart',onPress,{passive:false});
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); hop(); } });

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  // master world scroll — drives every parallax layer. Faster in play, faster still in a speed run.
  const runState=(state==='play'||state==='resolve'||state==='boss');
  const worldSpd = runState ? (speedMode?188:96) : 34;
  world += dt*worldSpd;
  player.bob+=dt*4;
  // advance the run-cycle frame (faster while actually running)
  const running = (state==='play'||state==='resolve'||state==='levelup'||state==='menu'||state==='boss');
  player.frameT += dt*(running?12:7);
  player.frame = Math.floor(player.frameT)%pika.frames;
  if(player.moodT>0){ player.moodT-=dt; if(player.moodT<=0) player.mood='run'; }
  // ease creature toward its lane height (rise on jump, fall on land)
  player.y += (player.targetY - player.y)*Math.min(1,dt*11);

  // ----- jump animation: rise through frames, then hold the apex pose -----
  if(player.air){
    const goingUp = player.targetY < LANE_Y[0]-1;          // climbing to a raised lane
    if(!player.reachedApex){
      player.jumpT += dt*14;
      player.jumpFrame = Math.min(jump.frames-2, Math.floor(player.jumpT));   // 0..n-2 launch/rise
      if(goingUp && (player.y - player.targetY) < 10) player.reachedApex=true; // hit the top
    } else {
      player.jumpFrame = jump.frames-1;                    // hold highest-point pose
    }
    // landed once she's almost back on the ground
    if(!goingUp && (LANE_Y[0]-player.y) < 16){ player.air=false; player.reachedApex=false; }
  }

  // trail sparkles
  if(state==='play'||state==='levelup'||state==='boss'){
    if(Math.random()<0.6) trail.push({x:PLAYER_X-18,y:player.y+10,vx:-30-Math.random()*40,vy:(Math.random()-0.5)*30,life:0.5,r:2+Math.random()*3,c:Math.random()<0.5?C.glow:C.spark});
  }
  zaps=zaps.filter(z=>{ z.life-=dt; return z.life>0; });
  trail=trail.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; return p.life>0; });
  confetti=confetti.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=400*dt; p.rot+=p.vr*dt; return p.life>0 && p.y<H+40; });
  rings=rings.filter(p=>{ p.life-=dt; p.r+=(p.maxR-p.r)*Math.min(1,dt*7); return p.life>0; });
  stars=stars.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.rot+=p.vr*dt; return p.life>0; });
  if(flash.a>0) flash.a=Math.max(0,flash.a-dt*1.6);
  if(speedAnnounce>0) speedAnnounce-=dt;
  if(speedMode) speedLines=(speedLines+dt*1600)%W; else speedLines=0;
  const speedMul=speedMode?1.5:1;        // hot streak = a third less think-time (same question difficulty)

  if(state==='play' && gate){
    gate.x -= speed*speedMul*dt;
    if(!gate.locked && gate.x <= PLAYER_X){
      // lock in the answer at the creature's lane
      gate.locked=true;
      const chosen=gate.choices[player.lane];
      gate.result=(chosen===gate.ans);
      gate.resolveT=0.9;
      player.targetY=LANE_Y[0];      // gate's passed — fall back to the ground
      if(gate.result){
        score+=(10+streak*2)*(speedMode?2:1); streak++; player.mood='happy'; player.moodT=0.7;
        Audio8.sfx('good'); flash={a:0.42,col:'#c9ffe0'};
        // satisfying pass-through pop, right where she caught the answer (any lane)
        correctPop(PLAYER_X, player.y);
        for(let i=0;i<18;i++) confetti.push({x:PLAYER_X+10,y:player.y,vx:(Math.random()-0.3)*260,vy:-Math.random()*320-60,life:1.1,r:4+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-0.5)*12,c:pick([C.glow,C.coral,C.mint,C.spark])});
        if(streak>=SPEED_STREAK) setSpeedMode(true);    // hot streak → SPEED RUN!
      } else {
        streak=0; hearts--;
        Audio8.sfx('bad'); flash={a:0.4,col:'#ffb3b8'};
        oopsPuff(PLAYER_X, player.y);                   // dazed stumble animation
        setSpeedMode(false);                            // a miss ends the speed run
      }
      state='resolve';
    }
  }

  if(state==='resolve' && gate){
    gate.x -= speed*0.4*speedMul*dt;
    gate.resolveT-=dt;
    if(gate.resolveT<=0){
      if(hearts<=0){ Audio8.sfx('bad'); setSpeedMode(false); state='over'; return; }
      stepInLvl++;
      const L=LEVELS[levelIdx];
      if(stepInLvl>=L.count){
        enterBoss();                    // cap the level with the Gyarados battle
      } else {
        spawnGate(); state='play';
      }
    }
  }

  if(state==='boss' && boss){
    boss.bob+=dt*2.2;
    if(boss.hurt>0) boss.hurt-=dt;
    if(boss.atk>0)  boss.atk-=dt;
    if(bossMsgT>0)  bossMsgT-=dt;
    if(boss.defeated){
      boss.deadT+=dt;
      if(boss.deadT>=1.8) bossDefeated();
    } else if(boss.enter>0){
      boss.enter-=dt;
      if(boss.enter<=0) spawnChallenge();      // start once the boss has slid in
    } else if(bossChal){
      bossChal.x -= bossSpeed*dt;
      if(!bossChal.locked && bossChal.x<=PLAYER_X){
        bossChal.locked=true; bossChal.resolveT=0.7; player.targetY=LANE_Y[0];
        bossChal.result=(player.lane===bossChal.correctLane);
        if(bossChal.result){
          let m=curMove(); if(!canCast(m)) m=PIKA_MOVES[0];        // safety fallback to Quick Attack
          charge=Math.max(0,Math.min(MAX_CHARGE, charge - m.cost + (m.gain||0)));
          boss.hp-=m.dmg; if(m.dmg>0) boss.hurt=0.6; streak++; score+=20;
          Audio8.sfx('good'); flash={a:0.4,col:m.col}; pikaFire(m);
          player.mood='happy'; player.moodT=0.7;
          if(m.shield) pikaShield=Math.min(3, pikaShield+m.shield);
          if(boss.hp<=0){ boss.defeated=true; boss.deadT=0; bossMsg=boss.cfg.name+' fainted!'; bossMsgT=2.2; }
          else bossMsg='Pikachu used '+m.name+'!', bossMsgT=1.2;
          if(!canCast(curMove())) equipped='qa';                  // keep the equipped move castable
        } else if(pikaShield>0){
          pikaShield--; streak=0; player.mood='run';
          Audio8.sfx('select'); flash={a:0.35,col:'#9fd8ff'};
          bossMsg='Blocked '+boss.cfg.name+"'s attack! 🛡️"; bossMsgT=1.3;   // shield soaks it, no heart lost
        } else {
          streak=0; hearts--; oopsPuff(PLAYER_X, player.y);   // dazed stumble animation
          Audio8.sfx('bad'); const d=bossAttack(); if(d) bossChal.resolveT=d;   // play boss move cut-in
        }
        if(hearts<=0){ Audio8.sfx('bad'); state='over'; return; }
      }
      if(bossChal.locked){
        bossChal.resolveT-=dt;
        if(bossChal.resolveT<=0 && !boss.defeated){ bossCut=null; spawnChallenge(); }
      }
    }
    if(bossCut){ bossCut.t+=dt; if(bossCut.t>=bossCut.dur) bossCut=null; }
    if(pikaAtk){ pikaAtk.t+=dt; if(pikaAtk.t>=pikaAtk.dur) pikaAtk=null; }
  }
}

// seamless rolling hill (summed sines are periodic -> no seam as it scrolls)
function drawHill(off, base, amp, col){
  g.fillStyle=col; g.beginPath(); g.moveTo(0,H);
  for(let x=0;x<=W;x+=10){ const t=x+off; g.lineTo(x, base + Math.sin(t/150)*amp*0.6 + Math.sin(t/53+1.7)*amp*0.4); }
  g.lineTo(W,H); g.closePath(); g.fill();
}
// distant mountain range: a tiled row of triangular peaks, optional snow caps
function drawPeaks(off, base, peakH, span, col, snow){
  const o=((off%span)+span)%span;
  g.fillStyle=col;
  for(let x=-o-span; x<W+span; x+=span){ const cx=x+span/2;
    g.beginPath(); g.moveTo(x,base); g.lineTo(cx,base-peakH); g.lineTo(x+span,base); g.closePath(); g.fill(); }
  if(snow){ g.fillStyle='rgba(255,255,255,0.92)'; const sH=peakH*0.27, half=(span/2)*(sH/peakH);
    for(let x=-o-span; x<W+span; x+=span){ const cx=x+span/2, top=base-peakH, ly=top+sH;
      g.beginPath(); g.moveTo(cx,top); g.lineTo(cx-half,ly); g.lineTo(cx-half*0.35,ly-4);
      g.lineTo(cx,ly+2); g.lineTo(cx+half*0.35,ly-4); g.lineTo(cx+half,ly); g.closePath(); g.fill(); } }
}
// puffy drifting clouds that wrap around the screen width
function drawClouds(off, col){
  const pad=340, span=W+pad, blobs=[[120,88,40],[450,140,52],[760,80,46],[1060,150,40]];
  g.save(); g.fillStyle=col;
  for(const [bx,by,r] of blobs){ const x=((bx-off)%span+span)%span-pad/2;
    g.beginPath(); g.arc(x,by,r,0,7); g.arc(x+r*0.95,by+6,r*0.78,0,7); g.arc(x-r*0.95,by+8,r*0.66,0,7); g.arc(x+r*0.15,by-r*0.5,r*0.58,0,7); g.fill(); }
  g.restore();
}
// nearest layer: little grass tufts on the ground line (still behind Pikachu)
function drawTufts(off, col){
  const period=120, n=Math.ceil(W/period)+2;
  g.save(); g.strokeStyle=col; g.lineWidth=3; g.lineCap='round';
  for(let k=-1;k<n;k++){ const x=k*period - (((off%period)+period)%period);
    for(let b=-1;b<=1;b++){ g.beginPath(); g.moveTo(x+b*6,FLOOR_Y+9); g.quadraticCurveTo(x+b*8,FLOOR_Y-3,x+b*10,FLOOR_Y-15); g.stroke(); } }
  g.restore();
}
// L3 motif: bubbles rising through the lower (water) band
function drawBubbles(){
  g.save(); g.strokeStyle='rgba(255,255,255,0.55)'; g.fillStyle='rgba(255,255,255,0.14)'; g.lineWidth=1.5;
  const span=FLOOR_Y-210;
  for(let i=0;i<14;i++){ const r=4+(i%4)*3;
    const x=(((i*83+20)-world*0.2)%W+W)%W, y=FLOOR_Y-((world*0.5+i*70)%span);
    g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.stroke(); }
  g.restore();
}
// L4 motif: glowing crystal clusters along the near ground
function drawCrystals(off){
  const period=250, o=((off%period)+period)%period, cols=['#7a5cff','#9b7bff','#b59cff'];
  g.save();
  for(let x=-o-period; x<W+period; x+=period){
    for(let k=0;k<3;k++){ const cx=x+k*16-16, h=24+k*9, w=11;
      g.fillStyle=cols[k%3]; g.shadowColor='#9b7bff'; g.shadowBlur=14;
      g.beginPath(); g.moveTo(cx,FLOOR_Y-2); g.lineTo(cx-w/2,FLOOR_Y-2-h*0.5); g.lineTo(cx,FLOOR_Y-2-h); g.lineTo(cx+w/2,FLOOR_Y-2-h*0.5); g.closePath(); g.fill(); }
  }
  g.restore();
}

function drawBackground(){
  const sc=scene();
  // sky gradient
  const sky=g.createLinearGradient(0,0,0,FLOOR_Y);
  sky.addColorStop(0,sc.sky[0]); sky.addColorStop(.55,sc.sky[1]); sky.addColorStop(1,sc.sky[2]);
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // sun / moon orb (static glow)
  if(sc.orb){ const o=sc.orb; g.save(); g.globalAlpha=.95;
    const rg=g.createRadialGradient(o.x,o.y,6,o.x,o.y,o.r);
    rg.addColorStop(0,o.col); rg.addColorStop(.55,o.col); rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(o.x,o.y,o.r,0,7); g.fill(); g.restore(); }
  // stars (very slow drift + twinkle)
  if(sc.stars>0){ const so=world*0.05; g.fillStyle='#fff';
    for(let i=0;i<42;i++){ const x=(((i*97+13)-so)%W+W)%W, y=(i*53)%212;
      g.globalAlpha=sc.stars*(0.22+0.5*Math.abs(Math.sin(i*1.3+world*0.012))); const s=(i%5===0)?2.5:1.5; g.fillRect(x,y,s,s); }
    g.globalAlpha=1; }
  // clouds / mist
  if(sc.cloud) drawClouds(world*0.12, sc.cloud);
  // ridge layers, far (slow) to near (fast)
  for(const r of sc.ridges){
    if(r.kind==='peaks') drawPeaks(world*r.f, r.base, r.h, r.span, r.col, r.snow);
    else drawHill(world*r.f, r.base, r.amp, r.col);
  }
  // ground band + scrolling chevron texture
  g.fillStyle=sc.ground; g.fillRect(0,FLOOR_Y,W,H-FLOOR_Y);
  g.fillStyle=sc.groundDk;
  for(let x=-(world%80); x<W; x+=80){ g.beginPath(); g.moveTo(x,FLOOR_Y); g.lineTo(x+18,FLOOR_Y); g.lineTo(x+9,FLOOR_Y-12); g.closePath(); g.fill(); }
  g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(0,FLOOR_Y,W,4);
  // per-scene foreground motifs (nearest, fastest)
  if(sc.bubbles)  drawBubbles();
  if(sc.crystals) drawCrystals(world*0.9);
  if(sc.tuft)     drawTufts(world*1.15, sc.tuft);
}

/* the mascot: Pikachu run / jump sprite (with a soft spark glow) */
function drawCreature(x,y,mood){
  const airborne = player.air;
  const bob = airborne ? 0 : Math.sin(player.bob)*3;     // no run-bob mid-jump
  if(mood==='oops') x += Math.sin(player.moodT*40)*6;    // dazed side-to-side wobble on a wrong answer
  const sheet = (airborne && jump.ready) ? jump : pika;
  const frameIdx = (sheet===jump) ? player.jumpFrame : player.frame;
  const H0 = (sheet===jump) ? JUMP_H : PIKA_H;
  const s=H0/sheet.ch, dw=sheet.cw*s, dh=H0;
  const feetY=y+28+bob;            // baseline the feet rest on
  const dx=x-dw*0.52;              // nudge so the body sits on the choice line
  const dy=feetY-dh;
  g.save();
  // soft glow behind the creature
  const gl=g.createRadialGradient(x,y+bob,4,x,y+bob,52);
  gl.addColorStop(0,'rgba(255,224,138,.45)'); gl.addColorStop(1,'rgba(255,224,138,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(x,y+bob,52,0,7); g.fill();
  if(sheet.ready){
    if(mood==='oops'){ g.translate(x,feetY); g.rotate(0.12); g.translate(-x,-feetY); }
    g.imageSmoothingEnabled=true;
    const src=sheet.cnv||sheet.img, ins=1;        // cleaned sheet + 1px inset = no neighbour-frame bleed
    const sx=frameIdx*sheet.cw+ins, sw=sheet.cw-2*ins;
    if(mood==='oops') drawTinted(src, sx,0,sw,sheet.ch, dx,dy,dw,dh, 'rgba(255,70,80,.42)');  // red flash on the sprite only
    else g.drawImage(src, sx,0,sw,sheet.ch, dx,dy,dw,dh);
  } else {
    // simple placeholder while the sprite sheet loads
    g.fillStyle='#ffd166'; g.beginPath(); g.arc(x,y+bob,22,0,7); g.fill();
  }
  g.restore();
}

/* celebrating Pikachu (level-complete / win screens) */
function drawCelebrate(cx,feetY,h){
  if(!celeb.ready) return;
  const f=Math.floor(performance.now()/130)%celeb.frames;
  const bounce=Math.abs(Math.sin(performance.now()/150))*8;   // little victory hop
  const s=h/celeb.ch, dw=celeb.cw*s;
  g.save();
  const gl=g.createRadialGradient(cx,feetY-h*0.45,6,cx,feetY-h*0.45,h*0.7);
  gl.addColorStop(0,'rgba(255,224,138,.5)'); gl.addColorStop(1,'rgba(255,224,138,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(cx,feetY-h*0.45,h*0.7,0,7); g.fill();
  g.imageSmoothingEnabled=true;
  g.drawImage(celeb.img, f*celeb.cw,0,celeb.cw,celeb.ch, cx-dw/2, feetY-h-bounce, dw, h);
  g.restore();
}

/* themed answer container with a number */
function drawCard(x,y,val,theme,selected,reveal){
  // reveal: 'right' green, 'wrong' red-dim, null normal
  g.save();
  let body=C.cream, ring='#ffffff';
  if(theme==='balloon'){ body='#ff7a85'; ring='#ffd0d4'; }
  else if(theme==='apple'){ body='#e8504e'; ring='#ffd2c0'; }
  else if(theme==='bubble'){ body='rgba(150,225,255,.85)'; ring='#eafaff'; }
  else if(theme==='crystal'){ body='#9b7bff'; ring='#e7dcff'; }

  if(reveal==='right'){ body=C.leaf; ring=C.mint; }
  if(reveal==='wrong'){ g.globalAlpha=.45; }

  const cx=x+CARD_W/2, cy=y+CARD_H/2;
  // selected pulse ring
  if(selected){
    g.save(); g.globalAlpha=.9;
    const p=4+Math.sin(performance.now()/120)*3;
    g.strokeStyle=C.glow; g.lineWidth=6; rr(x-7-p/2,y-7-p/2,CARD_W+14+p,CARD_H+14+p,26); g.stroke();
    g.restore();
  }

  // container shape
  if(theme==='balloon'||theme==='apple'){
    g.fillStyle=body; g.beginPath(); g.ellipse(cx,cy,CARD_W/2,CARD_H/2,0,0,7); g.fill();
    if(theme==='apple'){ g.fillStyle='#7a4a2a'; g.fillRect(cx-2,y-6,4,12); g.fillStyle=C.leaf; g.beginPath(); g.ellipse(cx+10,y-2,9,5,-0.5,0,7); g.fill(); }
    if(theme==='balloon'){ g.fillStyle=body; g.beginPath(); g.moveTo(cx-5,y+CARD_H-6); g.lineTo(cx+5,y+CARD_H-6); g.lineTo(cx,y+CARD_H+6); g.closePath(); g.fill(); }
  } else if(theme==='bubble'){
    g.fillStyle=body; g.beginPath(); g.arc(cx,cy,CARD_W/2,0,7); g.fill();
    g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2; g.beginPath(); g.arc(cx,cy,CARD_W/2-3,0,7); g.stroke();
  } else if(theme==='crystal'){
    g.fillStyle=body; g.beginPath();
    g.moveTo(cx,y-4); g.lineTo(x+CARD_W,cy-14); g.lineTo(x+CARD_W-10,y+CARD_H); g.lineTo(x+10,y+CARD_H); g.lineTo(x,cy-14); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(cx,y-4); g.lineTo(cx,y+CARD_H); g.lineTo(x+10,y+CARD_H); g.lineTo(x,cy-14); g.closePath(); g.fill();
  }
  // gloss
  g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(cx-14,cy-18,12,7,-0.5,0,7); g.fill();
  // number
  g.fillStyle=(theme==='bubble')?C.ink:'#fff';
  g.font='700 40px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=4; g.strokeStyle='rgba(0,0,0,.22)';
  g.strokeText(val,cx,cy+1); g.fillText(val,cx,cy+1);
  g.restore();
}

function sparkle(r){ g.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4, rad=(i%2===0)?r:r*0.4; g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);} g.closePath(); g.fill(); }
function drawParticles(){
  trail.forEach(p=>{ g.globalAlpha=Math.max(0,p.life*2); g.fillStyle=p.c; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); });
  g.globalAlpha=1;
  // expanding shockwave rings
  rings.forEach(p=>{ g.save(); g.globalAlpha=Math.max(0,Math.min(1,p.life*1.8)); g.strokeStyle=p.col; g.lineWidth=Math.max(1,p.lw*p.life*1.6); g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.stroke(); g.restore(); });
  confetti.forEach(p=>{ g.save(); g.globalAlpha=Math.min(1,p.life); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c; g.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); g.restore(); });
  // twinkling star sparkles
  stars.forEach(p=>{ g.save(); g.globalAlpha=Math.max(0,Math.min(1,p.life*1.8)); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c; sparkle(p.r); g.restore(); });
  g.globalAlpha=1;
}

  // lane hint arrow on creature's active lane

  g.fillText(Audio8.isMuted()?'🔇':'🔊', MUTE.x+MUTE.w/2, MUTE.y+MUTE.h/2+1); g.restore();

/* ----- Gyarados boss scene ----- */
function drawBoss(){
  // stormy tint over the normal backdrop
  g.fillStyle='rgba(20,16,48,.38)'; g.fillRect(0,0,W,FLOOR_Y);
  drawBossSprite();
  // the active challenge: answer cards across the three lanes
  if(bossChal){
    for(let lane=0;lane<3;lane++){
      const y=LANE_Y[lane]-CARD_H/2;
      let reveal=null;
      if(bossChal.locked){
        if(lane===bossChal.correctLane) reveal='right';
        else if(lane===player.lane && !bossChal.result) reveal='wrong';
      }
      drawCard(bossChal.x, y, bossChal.choices[lane], LEVELS[levelIdx].theme, !bossChal.locked&&lane===player.lane, reveal);
    }
  }
  // problem banner so the player can read the sum
  if(bossChal){
    const bw=300, bx=W/2-bw/2, by=58, bh=58;
    g.fillStyle='rgba(35,22,53,.78)'; rr(bx,by,bw,bh,18); g.fill();
    g.strokeStyle=C.glow; g.lineWidth=3; rr(bx,by,bw,bh,18); g.stroke();
    g.fillStyle=C.cream; g.font='700 36px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(bossChal.q+' = ?', W/2, by+bh/2+2); g.textAlign='left'; g.textBaseline='alphabetic';
  }
  drawZaps();
  // Pikachu: show the move sprite while attacking, else the usual runner
  if(pikaShield>0) drawShield(PLAYER_X, player.y);
  if(pikaAtk && pikaAtk.spr && pikaAtk.spr.ready) drawPikaAttack();
  else drawCreature(PLAYER_X, player.y, player.mood);
  drawMoveBar();
  drawBossHUD();
  drawHUD();
  if(flash.a>0){ g.fillStyle=flash.col; g.globalAlpha=flash.a; g.fillRect(0,0,W,H); g.globalAlpha=1; }
  if(bossCut) drawBossCutIn();                  // attack cut-in rides above the flash
  else if(bossMsgT>0) drawBossMsg();
}

// dramatic move cut-in: bordered panel with the move art + name, pops in & out
function drawBossCutIn(){
  const c=bossCut, p=c.t/c.dur;
  const in_=Math.min(1,c.t/0.16), out=Math.min(1,(c.dur-c.t)/0.22);
  const a=Math.min(in_,out), pop=0.82+0.18*(1-(1-in_)*(1-in_));
  const pw=540, ph=300, cx=W/2, cy=H/2-6;
  g.save(); g.globalAlpha=a; g.translate(cx,cy); g.scale(pop,pop);
  // panel
  g.fillStyle='rgba(12,9,26,.94)'; rr(-pw/2,-ph/2,pw,ph,22); g.fill();
  // art, cover-fit, clipped to the rounded panel (inset for the border)
  const ix=-pw/2+10, iy=-ph/2+10, iw=pw-20, ih=ph-78;
  g.save(); rr(ix,iy,iw,ih,14); g.clip();
  if(c.spr&&c.spr.ready){
    const im=spr2d(c.spr), s=Math.max(iw/im.width, ih/im.height), w=im.width*s, h=im.height*s;
    g.imageSmoothingEnabled=true; g.drawImage(im, ix+(iw-w)/2, iy+(ih-h)*0.32, w, h);  // bias toward the head/action
  } else { g.fillStyle=c.m.col; g.fillRect(ix,iy,iw,ih); }
  // speed-streak overlay sweeping across
  g.globalAlpha=a*0.30; g.strokeStyle='#fff'; g.lineWidth=10;
  for(let i=-2;i<8;i++){ const x=ix-120+i*70+ (p*140); g.beginPath(); g.moveTo(x,iy); g.lineTo(x+90,iy+ih); g.stroke(); }
  g.restore();
  // name ribbon
  g.globalAlpha=a;
  g.fillStyle=c.m.col; rr(-pw/2,ph/2-66,pw,56,0); g.fill();
  g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(-pw/2,ph/2-12,pw,2);
  g.fillStyle='#1a1230'; g.font='800 30px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(boss.cfg.name+' used '+c.m.name+'!', 0, ph/2-37);
  // glowing border
  g.strokeStyle=c.m.col; g.lineWidth=5; g.shadowColor=c.m.col; g.shadowBlur=18;
  rr(-pw/2,-ph/2,pw,ph,22); g.stroke(); g.shadowBlur=0;
  g.textAlign='left'; g.textBaseline='alphabetic'; g.restore();
}

function drawBossSprite(){
  const slide = boss.enter>0 ? boss.enter*240 : 0;                 // glides in from the right
  const shake = boss.hurt>0 ? Math.sin(performance.now()/24)*7 : 0;
  const cx=BOSS_X+slide+shake, cy=BOSS_Y+Math.sin(boss.bob)*10;
  let alpha=1, rot=0, sink=0;
  if(boss.defeated){ const p=Math.min(1,boss.deadT/1.8); alpha=1-p*0.9; rot=p*0.7; sink=p*150; }
  // swap to the aggressive reaction pose while flinching or attacking
  const reacting = !boss.defeated && (boss.hurt>0 || boss.atk>0) && boss.cfg.hurtFile;
  let spr = reacting ? bossSprite(boss.cfg.hurtFile) : bossSprite(boss.cfg.file);
  if(!(spr&&spr.ready)) spr=bossSprite(boss.cfg.file);     // fall back to idle if not loaded yet
  g.save(); g.globalAlpha=alpha; g.translate(cx,cy+sink); g.rotate(rot);
  if(spr&&spr.ready){
    const im=spr2d(spr), s=BOSS_H/im.height, w=im.width*s;
    g.imageSmoothingEnabled=true;
    if(boss.hurt>0) drawTinted(im, 0,0,im.width,im.height, -w/2,-BOSS_H/2, w,BOSS_H, 'rgba(255,80,90,.42)');  // hit flash on the sprite only
    else g.drawImage(im, -w/2, -BOSS_H/2, w, BOSS_H);
  } else {
    g.scale(-1,1);                 // face the placeholder left, toward Pikachu
    drawSerpentPlaceholder(boss.cfg.tint, boss.hurt>0);
  }
  g.restore();
}

function darkenHex(hex,f){ const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  return 'rgb('+Math.round(r*f)+','+Math.round(gg*f)+','+Math.round(b*f)+')'; }
// stand-in serpent boss until the real sprite is supplied (centred on origin)
function drawSerpentPlaceholder(tint,hurt){
  const base=tint||'#2f74c0', body=hurt?'#ffd0d0':base, belly='#eef6ff', fin=darkenHex(base,0.62);
  // coiled body segments (back to front)
  for(let i=6;i>=1;i--){
    const x=-i*34+60, y=Math.sin(i*0.9)*30;
    g.fillStyle = i%2? body:fin;
    g.beginPath(); g.arc(x,y,30-i*1.5,0,7); g.fill();
  }
  // head
  g.fillStyle=body; g.beginPath(); g.ellipse(64,-6,52,42,0,0,7); g.fill();
  g.fillStyle=belly; g.beginPath(); g.ellipse(58,14,30,20,0,0,7); g.fill();
  // crest fin
  g.fillStyle=fin; g.beginPath(); g.moveTo(40,-44); g.lineTo(58,-86); g.lineTo(74,-44); g.closePath(); g.fill();
  // gaping mouth
  g.fillStyle='#7a1322'; g.beginPath(); g.moveTo(96,-18); g.quadraticCurveTo(128,-4,96,22); g.quadraticCurveTo(112,2,96,-18); g.fill();
  g.fillStyle='#fff'; // fangs
  g.beginPath(); g.moveTo(98,-14); g.lineTo(108,-6); g.lineTo(96,-4); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(98,16); g.lineTo(108,8); g.lineTo(96,6); g.closePath(); g.fill();
  // eye
  g.fillStyle='#ffd23a'; g.beginPath(); g.arc(58,-14,11,0,7); g.fill();
  g.fillStyle='#1a1a1a'; g.beginPath(); g.arc(60,-14,5,0,7); g.fill();
  // whisker barbels
  g.strokeStyle=belly; g.lineWidth=5; g.lineCap='round';
  g.beginPath(); g.moveTo(70,26); g.quadraticCurveTo(40,60,76,70); g.stroke();
  g.beginPath(); g.moveTo(84,22); g.quadraticCurveTo(120,50,150,30); g.stroke();
}

function drawZaps(){
  zaps.forEach(z=>{
    const a=Math.max(0,z.life/z.max);
    g.save(); g.globalAlpha=a; g.strokeStyle='#fff7b0'; g.lineWidth=6; g.lineCap='round'; g.lineJoin='round';
    g.shadowColor=C.glow; g.shadowBlur=18;
    const segs=7; g.beginPath(); g.moveTo(z.x1,z.y1);
    for(let i=1;i<segs;i++){ const t=i/segs; const x=z.x1+(z.x2-z.x1)*t, y=z.y1+(z.y2-z.y1)*t+(Math.random()-0.5)*36; g.lineTo(x,y); }
    g.lineTo(z.x2,z.y2); g.stroke();
    g.strokeStyle=C.spark; g.lineWidth=2.5; g.shadowBlur=0; g.stroke();
    g.restore();
  });
}

/* ----- Pikachu move bar (bottom strip) + charge meter + attack FX ----- */
function moveBarRects(){
  const ms=availMoves(), n=ms.length, gap=8, margin=14, avail=W-2*margin;
  const bw=Math.max(70, Math.min(150, (avail-(n-1)*gap)/n)), bh=44;
  const tot=n*bw+(n-1)*gap; let x=W/2-tot/2; const y=H-48;
  return ms.map(m=>{ const r={m,x,y,w:bw,h:bh}; x+=bw+gap; return r; });
}
function drawChargeGauge(x,y){
  g.textAlign='left'; g.textBaseline='middle';
  g.fillStyle='#cfc7e0'; g.font='700 13px Fredoka, sans-serif'; g.fillText('CHARGE', x, y);
  for(let i=0;i<MAX_CHARGE;i++){
    const px=x+62+i*16, on=i<charge;
    g.beginPath(); g.arc(px,y,6,0,7);
    if(on){ g.fillStyle='#ffe14a'; g.shadowColor='#ffe14a'; g.shadowBlur=8; g.fill(); g.shadowBlur=0; }
    else { g.fillStyle='rgba(255,255,255,.15)'; g.fill(); }
  }
  g.textBaseline='alphabetic';
}
function drawMoveBar(){
  g.save();
  drawChargeGauge(14, H-62);
  const eqm=curMove();                                   // equipped move readout (right)
  g.textAlign='right'; g.textBaseline='middle'; g.font='700 14px Fredoka, sans-serif';
  g.fillStyle=eqm.col; g.fillText(eqm.name+'  ·  '+eqm.blurb, W-14, H-62);
  for(const r of moveBarRects()){
    const m=r.m, sel=(m.key===equipped), aff=canCast(m);
    g.globalAlpha = aff?1:0.42;
    g.fillStyle = sel?'rgba(46,30,68,.97)':'rgba(24,16,40,.88)'; rr(r.x,r.y,r.w,r.h,10); g.fill();
    const spr=bossSprite(m.file);
    g.save(); rr(r.x+3,r.y+3,r.w-6,r.h-6,7); g.clip();    // sprite thumbnail (cover)
    if(spr&&spr.ready){ const im=spr2d(spr), s=Math.max((r.w-6)/im.width,(r.h-6)/im.height), iw=im.width*s, ih=im.height*s;
      g.imageSmoothingEnabled=true; g.drawImage(im, r.x+3+((r.w-6)-iw)/2, r.y+3+((r.h-6)-ih)*0.28, iw, ih); }
    g.fillStyle='rgba(0,0,0,.42)'; g.fillRect(r.x+3, r.y+r.h-18, r.w-6, 15);   // legibility strip
    g.restore();
    // effect (left) + cost (right) along the bottom
    g.textBaseline='alphabetic'; g.font='700 12px Fredoka, sans-serif'; g.textAlign='left';
    g.fillStyle='#fff';
    g.fillText(m.dmg>0?('⚔ '+m.dmg):(m.shield?('🛡 '+m.shield):('＋'+m.gain)), r.x+7, r.y+r.h-6);
    g.textAlign='right'; g.fillStyle=m.col; g.fillText(m.cost>0?('⚡'+m.cost):'free', r.x+r.w-7, r.y+r.h-6);
    // border (selected glows; affordable moves get a soft tint)
    g.textAlign='left';
    g.lineWidth=sel?4:2; g.strokeStyle = sel?m.col:'rgba(255,255,255,.22)';
    if(sel){ g.shadowColor=m.col; g.shadowBlur=12; } rr(r.x,r.y,r.w,r.h,10); g.stroke(); g.shadowBlur=0;
    g.globalAlpha=1;
  }
  g.restore(); g.textAlign='left'; g.textBaseline='alphabetic';
}
function drawPikaAttack(){
  const a=pikaAtk, p=a.t/a.dur, im=spr2d(a.spr);
  const h=176, w=im.width*(h/im.height);
  const x=PLAYER_X - w*0.34 + p*26, y=player.y - h*0.55;     // small forward lunge
  g.save(); g.globalAlpha=Math.min(1,(1-p)*1.7+0.22);
  g.imageSmoothingEnabled=true; g.drawImage(im, x, y, w, h);
  g.restore();
}
function drawShield(x,y){
  const t=performance.now()/1000;
  g.save(); g.beginPath(); g.ellipse(x, y-8, 50, 62, 0, 0, 7);
  g.globalAlpha=0.16; g.fillStyle='#8fe0ff'; g.fill();
  g.globalAlpha=0.5+0.22*Math.sin(t*5); g.strokeStyle='#8fe0ff'; g.lineWidth=3; g.stroke();
  g.restore();
}

function drawBossHUD(){
  if(!boss) return;
  const bw=380, bx=W/2-bw/2, by=18, bh=22;
  g.save();
  g.fillStyle='rgba(35,22,53,.8)'; rr(bx-6,by-16,bw+12,bh+24,12); g.fill();
  g.fillStyle=C.cream; g.font='700 16px Fredoka, sans-serif'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText((boss.cfg.name||'BOSS').toUpperCase(), bx, by-4);
  // bar
  g.fillStyle='rgba(0,0,0,.45)'; rr(bx,by+4,bw,bh-4,8); g.fill();
  const frac=Math.max(0,boss.hp)/boss.maxHp;
  const grd=g.createLinearGradient(bx,0,bx+bw,0); grd.addColorStop(0,'#ff6b6b'); grd.addColorStop(1,'#ffd23a');
  g.fillStyle=grd; rr(bx,by+4,bw*frac,bh-4,8); g.fill();
  g.restore(); g.textAlign='left';
}

function drawBossMsg(){
  const a=Math.min(1,bossMsgT*2);
  g.save(); g.globalAlpha=a; g.textAlign='center';
  g.font='700 38px Fredoka, sans-serif';
  g.fillStyle=C.ink;  g.fillText(bossMsg, W/2+2, 168+2);
  g.fillStyle=C.glow; g.fillText(bossMsg, W/2, 168);
  g.restore(); g.textAlign='left';
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  drawBackground();
  pixelateBackground();          // chunky 8-bit pass over the scenery (sprites/text stay crisp)
  if(speedMode) drawSpeedLines();
  drawParticles();

  if(state==='menu'){ drawMenu(); drawMuteOnly(); return; }
  if(state==='boss'){ drawBoss(); return; }
  if(state==='levelup'){ drawCreature(PLAYER_X,player.y,'happy'); drawLevelUp(); return; }
  if(state==='won'){ drawWon(); return; }
  if(state==='over'){ drawOver(); return; }

  // gate cards
  if(gate){
    const L=LEVELS[levelIdx];
    for(let lane=0;lane<3;lane++){
      const y=LANE_Y[lane]-CARD_H/2;
      let reveal=null;
      if(state==='resolve'){
        if(lane===gate.correctLane) reveal='right';
        else if(lane===player.lane && !gate.result) reveal='wrong';
      }
      const selected=(state==='play'&&lane===player.lane);
      drawCard(gate.x, y, gate.choices[lane], L.theme, selected, reveal);
    }
  }
  drawCreature(PLAYER_X, player.y, player.mood);
  drawHUD();
  if(speedAnnounce>0) drawSpeedBanner();

  // hit/miss flash
  if(flash.a>0){ g.fillStyle=flash.col; g.globalAlpha=flash.a; g.fillRect(0,0,W,H); g.globalAlpha=1; }
}

/* speed-run visuals: golden motion streaks + a burst banner */
function drawSpeedLines(){
  g.save(); g.strokeStyle=C.glow; g.lineWidth=3; g.lineCap='round';
  for(let i=0;i<16;i++){
    const y=(i*47+13)%H, len=70+(i*37)%130;
    const x=W+120-((speedLines+i*131)%(W+240));
    g.globalAlpha=0.10+0.10*(i%3);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y); g.stroke();
  }
  g.restore();
}
function drawSpeedBanner(){
  const a=Math.min(1,speedAnnounce/0.45);
  const sc=1+(1.6-Math.max(0,speedAnnounce))*0.12;
  g.save(); g.globalAlpha=a; g.textAlign='center';
  g.font='700 '+Math.round(50*sc)+'px Fredoka, sans-serif';
  g.fillStyle=C.ink;   g.fillText('⚡ SPEED RUN! ⚡', W/2+3, 150+3);
  g.fillStyle=C.glow;  g.fillText('⚡ SPEED RUN! ⚡', W/2, 150);
  g.restore(); g.textAlign='left';
}
function drawMuteOnly(){
  g.save(); g.fillStyle='rgba(35,22,53,.7)'; rr(MUTE.x,MUTE.y,MUTE.w,MUTE.h,12); g.fill();
  g.fillStyle=C.cream; g.font='20px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(Audio8.isMuted()?'🔇':'🔊', MUTE.x+MUTE.w/2, MUTE.y+MUTE.h/2+1); g.restore();
}

/* ============================================================
   LOOP
   ============================================================ */
function frame(now){
  let dt=(now-lastT)/1000; lastT=now; if(dt>0.05) dt=0.05;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
