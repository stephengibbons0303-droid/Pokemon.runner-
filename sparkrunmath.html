// seamless rolling hill (summed sines are periodic -> no seam as it scrolls)
function drawHill(off, base, amp, col){
  g.fillStyle=col; g.beginPath(); g.moveTo(0,H);
  for(let x=0;x<=W;x+=10){ const t=x+off; g.lineTo(x, base + Math.sin(t/150)*amp*0.6 + Math.sin(t/53+1.7)*amp*0.4); }
  g.lineTo(W,H); g.closePath(); g.fill();
}
// distant mountain range: a tiled row of triangular peaks, optional snow caps
function drawPeaks(off, base, peakH, span, col, snow){
  const o=((off%span)+span)%span;
  g.fillStyle=col;
  for(let x=-o-span; x<W+span; x+=span){ const cx=x+span/2;
    g.beginPath(); g.moveTo(x,base); g.lineTo(cx,base-peakH); g.lineTo(x+span,base); g.closePath(); g.fill(); }
  if(snow){ g.fillStyle='rgba(255,255,255,0.92)'; const sH=peakH*0.27, half=(span/2)*(sH/peakH);
    for(let x=-o-span; x<W+span; x+=span){ const cx=x+span/2, top=base-peakH, ly=top+sH;
      g.beginPath(); g.moveTo(cx,top); g.lineTo(cx-half,ly); g.lineTo(cx-half*0.35,ly-4);
      g.lineTo(cx,ly+2); g.lineTo(cx+half*0.35,ly-4); g.lineTo(cx+half,ly); g.closePath(); g.fill(); } }
}
// puffy drifting clouds that wrap around the screen width
function drawClouds(off, col){
  const pad=340, span=W+pad, blobs=[[120,88,40],[450,140,52],[760,80,46],[1060,150,40]];
  g.save(); g.fillStyle=col;
  for(const [bx,by,r] of blobs){ const x=((bx-off)%span+span)%span-pad/2;
    g.beginPath(); g.arc(x,by,r,0,7); g.arc(x+r*0.95,by+6,r*0.78,0,7); g.arc(x-r*0.95,by+8,r*0.66,0,7); g.arc(x+r*0.15,by-r*0.5,r*0.58,0,7); g.fill(); }
  g.restore();
}
// nearest layer: little grass tufts on the ground line (still behind Pikachu)
function drawTufts(off, col){
  const period=120, n=Math.ceil(W/period)+2;
  g.save(); g.strokeStyle=col; g.lineWidth=3; g.lineCap='round';
  for(let k=-1;k<n;k++){ const x=k*period - (((off%period)+period)%period);
    for(let b=-1;b<=1;b++){ g.beginPath(); g.moveTo(x+b*6,FLOOR_Y+9); g.quadraticCurveTo(x+b*8,FLOOR_Y-3,x+b*10,FLOOR_Y-15); g.stroke(); } }
  g.restore();
}
// L3 motif: bubbles rising through the lower (water) band
function drawBubbles(){
  g.save(); g.strokeStyle='rgba(255,255,255,0.55)'; g.fillStyle='rgba(255,255,255,0.14)'; g.lineWidth=1.5;
  const span=FLOOR_Y-210;
  for(let i=0;i<14;i++){ const r=4+(i%4)*3;
    const x=(((i*83+20)-world*0.2)%W+W)%W, y=FLOOR_Y-((world*0.5+i*70)%span);
    g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.stroke(); }
  g.restore();
}
// L4 motif: glowing crystal clusters along the near ground
function drawCrystals(off){
  const period=250, o=((off%period)+period)%period, cols=['#7a5cff','#9b7bff','#b59cff'];
  g.save();
  for(let x=-o-period; x<W+period; x+=period){
    for(let k=0;k<3;k++){ const cx=x+k*16-16, h=24+k*9, w=11;
      g.fillStyle=cols[k%3]; g.shadowColor='#9b7bff'; g.shadowBlur=14;
      g.beginPath(); g.moveTo(cx,FLOOR_Y-2); g.lineTo(cx-w/2,FLOOR_Y-2-h*0.5); g.lineTo(cx,FLOOR_Y-2-h); g.lineTo(cx+w/2,FLOOR_Y-2-h*0.5); g.closePath(); g.fill(); }
  }
  g.restore();
}

function drawBackground(){
  const sc=scene();
  // sky gradient
  const sky=g.createLinearGradient(0,0,0,FLOOR_Y);
  sky.addColorStop(0,sc.sky[0]); sky.addColorStop(.55,sc.sky[1]); sky.addColorStop(1,sc.sky[2]);
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // sun / moon orb (static glow)
  if(sc.orb){ const o=sc.orb; g.save(); g.globalAlpha=.95;
    const rg=g.createRadialGradient(o.x,o.y,6,o.x,o.y,o.r);
    rg.addColorStop(0,o.col); rg.addColorStop(.55,o.col); rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(o.x,o.y,o.r,0,7); g.fill(); g.restore(); }
  // stars (very slow drift + twinkle)
  if(sc.stars>0){ const so=world*0.05; g.fillStyle='#fff';
    for(let i=0;i<42;i++){ const x=(((i*97+13)-so)%W+W)%W, y=(i*53)%212;
      g.globalAlpha=sc.stars*(0.22+0.5*Math.abs(Math.sin(i*1.3+world*0.012))); const s=(i%5===0)?2.5:1.5; g.fillRect(x,y,s,s); }
    g.globalAlpha=1; }
  // clouds / mist
  if(sc.cloud) drawClouds(world*0.12, sc.cloud);
  // ridge layers, far (slow) to near (fast)
  for(const r of sc.ridges){
    if(r.kind==='peaks') drawPeaks(world*r.f, r.base, r.h, r.span, r.col, r.snow);
    else drawHill(world*r.f, r.base, r.amp, r.col);
  }
  // ground band + scrolling chevron texture
  g.fillStyle=sc.ground; g.fillRect(0,FLOOR_Y,W,H-FLOOR_Y);
  g.fillStyle=sc.groundDk;
  for(let x=-(world%80); x<W; x+=80){ g.beginPath(); g.moveTo(x,FLOOR_Y); g.lineTo(x+18,FLOOR_Y); g.lineTo(x+9,FLOOR_Y-12); g.closePath(); g.fill(); }
  g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(0,FLOOR_Y,W,4);
  // per-scene foreground motifs (nearest, fastest)
  if(sc.bubbles)  drawBubbles();
  if(sc.crystals) drawCrystals(world*0.9);
  if(sc.tuft)     drawTufts(world*1.15, sc.tuft);
}

/* the mascot: Pikachu run / jump sprite (with a soft spark glow) */
function drawCreature(x,y,mood,stance,still){
  const airborne = player.air;
  const useStance = !!stance && !airborne && jump.ready;       // crouched pre-battle pose (jump sheet frame 0)
  const bob = (airborne||still) ? 0 : (useStance ? Math.sin(player.bob*0.6)*1.5 : Math.sin(player.bob)*3);  // still = planted (no idle sway)
  if(mood==='oops') x += Math.sin(player.moodT*40)*6;    // dazed side-to-side wobble on a wrong answer
  const sheet = (airborne||useStance) && jump.ready ? jump : pika;
  const frameIdx = airborne ? player.jumpFrame : (useStance ? 0 : player.frame);
  const H0 = (sheet===jump) ? JUMP_H : PIKA_H;
  const s=H0/sheet.ch, dw=sheet.cw*s, dh=H0;
  const feetY=y+28+bob;            // baseline the feet rest on
  const dx=x-dw*0.52;              // nudge so the body sits on the choice line
  const dy=feetY-dh;
  g.save();
  // soft glow behind the creature
  const gl=g.createRadialGradient(x,y+bob,4,x,y+bob,52);
  gl.addColorStop(0,'rgba(255,224,138,.45)'); gl.addColorStop(1,'rgba(255,224,138,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(x,y+bob,52,0,7); g.fill();
  if(sheet.ready){
    if(mood==='oops'){ g.translate(x,feetY); g.rotate(0.12); g.translate(-x,-feetY); }
    g.imageSmoothingEnabled=true;
    const src=sheet.cnv||sheet.img, ins=1;        // cleaned sheet + 1px inset = no neighbour-frame bleed
    const sx=frameIdx*sheet.cw+ins, sw=sheet.cw-2*ins;
    if(mood==='oops') drawTinted(src, sx,0,sw,sheet.ch, dx,dy,dw,dh, 'rgba(255,70,80,.42)');  // red flash on the sprite only
    else g.drawImage(src, sx,0,sw,sheet.ch, dx,dy,dw,dh);
  } else {
    // simple placeholder while the sprite sheet loads
    g.fillStyle='#ffd166'; g.beginPath(); g.arc(x,y+bob,22,0,7); g.fill();
  }
  g.restore();
}

/* celebrating Pikachu (level-complete / win screens) */
function drawCelebrate(cx,feetY,h){
  if(!celeb.ready) return;
  const f=Math.floor(performance.now()/130)%celeb.frames;
  const bounce=Math.abs(Math.sin(performance.now()/150))*8;   // little victory hop
  const s=h/celeb.ch, dw=celeb.cw*s;
  g.save();
  const gl=g.createRadialGradient(cx,feetY-h*0.45,6,cx,feetY-h*0.45,h*0.7);
  gl.addColorStop(0,'rgba(255,224,138,.5)'); gl.addColorStop(1,'rgba(255,224,138,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(cx,feetY-h*0.45,h*0.7,0,7); g.fill();
  g.imageSmoothingEnabled=true;
  g.drawImage(celeb.img, f*celeb.cw,0,celeb.cw,celeb.ch, cx-dw/2, feetY-h-bounce, dw, h);
  g.restore();
}

/* themed answer container with a number */
function drawCard(x,y,val,theme,selected,reveal){
  // reveal: 'right' green, 'wrong' red-dim, null normal
  g.save();
  let body=C.cream, ring='#ffffff';
  if(theme==='balloon'){ body='#ff7a85'; ring='#ffd0d4'; }
  else if(theme==='apple'){ body='#e8504e'; ring='#ffd2c0'; }
  else if(theme==='bubble'){ body='rgba(150,225,255,.85)'; ring='#eafaff'; }
  else if(theme==='crystal'){ body='#9b7bff'; ring='#e7dcff'; }

  if(reveal==='wrong'){ g.restore(); return; }     // the wrong card has popped — cardPop() handles the burst
  if(reveal==='right'){ body=C.leaf; ring=C.mint; }

  const cx=x+CARD_W/2, cy=y+CARD_H/2;
  if(reveal==='right'){ g.shadowColor=C.mint; g.shadowBlur=18; }   // glow on the correct card
  // selected pulse ring
  if(selected){
    g.save(); g.globalAlpha=.9;
    const p=4+Math.sin(performance.now()/120)*3;
    g.strokeStyle=C.glow; g.lineWidth=6; rr(x-7-p/2,y-7-p/2,CARD_W+14+p,CARD_H+14+p,26); g.stroke();
    g.restore();
  }

  // container shape
  if(theme==='balloon'||theme==='apple'){
    g.fillStyle=body; g.beginPath(); g.ellipse(cx,cy,CARD_W/2,CARD_H/2,0,0,7); g.fill();
    if(theme==='apple'){ g.fillStyle='#7a4a2a'; g.fillRect(cx-2,y-6,4,12); g.fillStyle=C.leaf; g.beginPath(); g.ellipse(cx+10,y-2,9,5,-0.5,0,7); g.fill(); }
    if(theme==='balloon'){ g.fillStyle=body; g.beginPath(); g.moveTo(cx-5,y+CARD_H-6); g.lineTo(cx+5,y+CARD_H-6); g.lineTo(cx,y+CARD_H+6); g.closePath(); g.fill(); }
  } else if(theme==='bubble'){
    g.fillStyle=body; g.beginPath(); g.arc(cx,cy,CARD_W/2,0,7); g.fill();
    g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2; g.beginPath(); g.arc(cx,cy,CARD_W/2-3,0,7); g.stroke();
  } else if(theme==='crystal'){
    g.fillStyle=body; g.beginPath();
    g.moveTo(cx,y-4); g.lineTo(x+CARD_W,cy-14); g.lineTo(x+CARD_W-10,y+CARD_H); g.lineTo(x+10,y+CARD_H); g.lineTo(x,cy-14); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(cx,y-4); g.lineTo(cx,y+CARD_H); g.lineTo(x+10,y+CARD_H); g.lineTo(x,cy-14); g.closePath(); g.fill();
  }
  // gloss
  g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(cx-14,cy-18,12,7,-0.5,0,7); g.fill();
  // number
  g.fillStyle=(theme==='bubble')?C.ink:'#fff';
  g.font='700 40px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=4; g.strokeStyle='rgba(0,0,0,.22)';
  g.strokeText(val,cx,cy+1); g.fillText(val,cx,cy+1);
  if(reveal==='right'){                            // twinkling gold sparkles orbiting the correct card
    g.shadowBlur=0; g.fillStyle=C.glow;
    const t=performance.now()/420;
    for(let i=0;i<5;i++){ const a=t+i*1.2566, rad=CARD_W*0.52+Math.sin(t*1.7+i)*6;
      const sx=cx+Math.cos(a)*rad, sy=cy+Math.sin(a)*rad*0.82, sc=4+2.5*(0.5+0.5*Math.sin(t*3+i*2));
      g.save(); g.translate(sx,sy); sparkle(sc); g.restore(); }
  }
  g.restore();
}

function sparkle(r){ g.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4, rad=(i%2===0)?r:r*0.4; g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);} g.closePath(); g.fill(); }

/* Younger game: Ash in the prompt box. He "says" the target letter/number — the
   clip fires on spawn; his mouth opens (once) for the whole clip then closes, and
   a correct answer swaps in his celebration frame for a moment. Transparent art,
   so he floats over the scene. Tap the box to replay. */
const ASH_PROMPT = { closed:'ash_say0.png', open:'ash_say1.png', yay:'ash_yay.png' };
function drawAshPrompt(P){
  const yay = ashYayT>0;
  const spr = bossSprite(yay ? ASH_PROMPT.yay : promptTalking() ? ASH_PROMPT.open : ASH_PROMPT.closed);
  g.save();
  if(spr&&spr.ready){                                    // contain-fit so nothing is cropped
    const im=spr2d(spr), s=Math.min(P.w/im.width,P.h/im.height), w=im.width*s, h=im.height*s;
    g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=10; g.shadowOffsetY=3;
    g.imageSmoothingEnabled=true; g.drawImage(im, P.x+P.w/2-w/2, P.y+(P.h-h)/2, w, h);
    g.shadowColor='transparent'; g.shadowBlur=0; g.shadowOffsetY=0;
  }
  // speaker badge (corner) — the whole box is tap-to-replay
  const bx=P.x+P.w-14, by=P.y+P.h-16;
  g.fillStyle='rgba(35,22,53,.8)'; g.beginPath(); g.arc(bx,by,15,0,7); g.fill();
  g.fillStyle=C.cream; g.font='600 17px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('🔊', bx, by+1); g.textAlign='left'; g.textBaseline='alphabetic';
  g.restore();
}
function drawParticles(){
  trail.forEach(p=>{ g.globalAlpha=Math.max(0,p.life*2); g.fillStyle=p.c; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); });
  g.globalAlpha=1;
  // expanding shockwave rings
  rings.forEach(p=>{ g.save(); g.globalAlpha=Math.max(0,Math.min(1,p.life*1.8)); g.strokeStyle=p.col; g.lineWidth=Math.max(1,p.lw*p.life*1.6); g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.stroke(); g.restore(); });
  confetti.forEach(p=>{ g.save(); g.globalAlpha=Math.min(1,p.life); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c; g.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); g.restore(); });
  // twinkling star sparkles
  stars.forEach(p=>{ g.save(); g.globalAlpha=Math.max(0,Math.min(1,p.life*1.8)); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c; sparkle(p.r); g.restore(); });
  g.globalAlpha=1;
}

function drawHUD(){
  // problem banner (top center) — only while a gate is live
  if((state==='play'||state==='resolve') && gate){
    if(PACK.audio){ drawAshPrompt(PROMPT); }                  // younger game: Ash speaks, no written sum
    else {
      g.save();
      const bw=300, bx=W/2-bw/2, by=24, bh=70;
      g.fillStyle='rgba(35,22,53,.78)'; rr(bx,by,bw,bh,20); g.fill();
      g.strokeStyle=C.glow; g.lineWidth=3; rr(bx,by,bw,bh,20); g.stroke();
      g.fillStyle=C.cream; g.font='700 44px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(gate.q+' = ?', W/2, by+bh/2+2);
      g.restore();
    }
  }
  // score (top-left) — dark shadow keeps the light text legible on bright daytime scenes
  g.save(); g.shadowColor='rgba(0,0,0,.55)'; g.shadowBlur=4; g.shadowOffsetY=1;
  g.fillStyle=C.cream; g.font='600 24px Fredoka, sans-serif'; g.textAlign='left'; g.textBaseline='top';
  g.fillText('⭐ '+score, 22, 22);

    g.fillStyle='rgba(255,244,230,.9)'; g.fillText(LEVELS[levelIdx].name+'  ·  '+(stepInLvl+1)+'/'+LEVELS[levelIdx].count, 22, 52);
    if(streak>1){ g.fillStyle=C.glow; g.fillText('🔥 '+streak+' in a row!', 22, 76); }
  }
  g.restore();
  // hearts — bottom-left in the runner, top-left in a classic boss, under Pikachu's
  // energy bar in a duel. In a boss fight these are the retry attempts.
  {
    g.font='22px Fredoka, sans-serif'; g.textAlign='left'; g.textBaseline='top';
    const duelB = state==='boss' && bossMode==='duel';

  }

    g.beginPath(); g.moveTo(PLAYER_X-70,ly); g.lineTo(PLAYER_X-54,ly-9); g.lineTo(PLAYER_X-54,ly+9); g.closePath(); g.fill();
  }

  const k=MUTE.w/40;                                   // scale icons/corners with the button size
  // pause button (left of mute) — only while playing
  g.save(); g.fillStyle='rgba(35,22,53,.7)'; rr(PAUSE.x,PAUSE.y,PAUSE.w,PAUSE.h,12*k); g.fill();
  g.fillStyle=C.cream; g.font=Math.round(18*k)+'px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(paused?'▶':'❚❚', PAUSE.x+PAUSE.w/2, PAUSE.y+PAUSE.h/2+1); g.restore();
  // mute button
  g.save(); g.fillStyle='rgba(35,22,53,.7)'; rr(MUTE.x,MUTE.y,MUTE.w,MUTE.h,12*k); g.fill();
  g.fillStyle=C.cream; g.font=Math.round(20*k)+'px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(['🔇','🔉','🔊'][Audio8.volLevel()], MUTE.x+MUTE.w/2, MUTE.y+MUTE.h/2+1); g.restore();
}

/* Draw one Pokémon inside a gallery slot, centred at (cx,cy) at on-screen height
   boxH. Uses its custom looping strip from ACH_ANIM if supplied, otherwise the
   static boss sprite with a gentle idle bob. `t` is a per-slot time offset so
   the static bobs don't march in lockstep. */
function drawMonInSlot(mon, cx, cy, boxH, t){
  const a=ACH_ANIM[mon.name];
  if(a && a.ready){                                   // unique looping animation
    const fi=Math.floor(t*a.fps)%a.n, s=boxH/a.ch, w=a.cw*s;
    g.imageSmoothingEnabled=true;
    g.drawImage(a.img, fi*a.cw,0,a.cw,a.ch, cx-w/2, cy-boxH/2, w, boxH);
    return;
  }
  const spr=bossSprite(mon.file);                     // static sprite + idle bob fallback
  if(spr&&spr.ready){
    const im=spr2d(spr), s=boxH/im.height, w=im.width*s, bob=Math.sin(t*2)*5;
    g.imageSmoothingEnabled=true;
    g.drawImage(im, cx-w/2, cy-boxH/2+bob, w, boxH);
  }
}

/* Achievement gallery screen — every Pokémon you've defeated, saved between
   sessions. Reached from the start-screen button, and shown automatically (with
   the fresh catch highlighted) right after you win a battle. */
function drawDex(){
  g.fillStyle='rgba(20,12,38,.82)'; g.fillRect(0,0,W,H);
  g.textAlign='center';
  g.fillStyle=C.glow; g.font='700 54px Fredoka, sans-serif'; g.fillText('Spark Friends', W/2, 92);
  g.fillStyle=C.cream; g.font='600 22px Fredoka, sans-serif';
  g.fillText(caught.size+' / '+BOSSES.length+' befriended', W/2, 126);

  const n=BOSSES.length, cw=150, gap=18, total=n*cw+(n-1)*gap, sx=(W-total)/2;
  const top=168, ch=204, midY=top+ch/2-8;
  for(let i=0;i<n;i++){
    const mon=BOSSES[i], x=sx+i*(cw+gap), got=caught.has(mon.name), isNew=mon.name===newlyCaught;
    const cx=x+cw/2;
    g.fillStyle = got ? 'rgba(58,168,115,.16)' : 'rgba(255,255,255,.05)';
    rr(x,top,cw,ch,18); g.fill();
    if(isNew){                                         // pulsing highlight on the fresh catch

      g.save(); g.lineWidth=4; g.strokeStyle=C.glow; g.globalAlpha=pulse; g.shadowColor=C.glow; g.shadowBlur=18;
      rr(x,top,cw,ch,18); g.stroke(); g.restore();
    } else { g.strokeStyle='rgba(255,255,255,.12)'; g.lineWidth=2; rr(x,top,cw,ch,18); g.stroke(); }

    if(got){
      drawMonInSlot(mon, cx, midY, 132, dexT + i*0.7);
      const label = mon.name.length>12 ? mon.name.replace('Galarian ','G. ') : mon.name;
      g.fillStyle=C.cream; g.font='600 18px Fredoka, sans-serif'; g.fillText(label, cx, top+ch-16);
      if(isNew){
        g.fillStyle=C.coral; g.font='700 18px Fredoka, sans-serif'; g.fillText('NEW!', cx, top+26);
        for(let k=0;k<6;k++){                          // orbiting sparkles
          const ang=dexT*2+k*Math.PI/3, rad=72+Math.sin(dexT*4+k)*6;
          const px=cx+Math.cos(ang)*rad, py=midY+Math.sin(ang)*rad*0.62;
          g.globalAlpha=0.75; g.fillStyle=k%2?C.glow:C.spark; g.beginPath(); g.arc(px,py,3,0,7); g.fill();
        }
        g.globalAlpha=1;
      }
    } else {                                           // locked: silhouette + ???
      g.fillStyle='rgba(0,0,0,.32)'; g.beginPath(); g.arc(cx, midY, 46, 0, 7); g.fill();
      g.fillStyle='rgba(255,255,255,.55)'; g.font='700 56px Fredoka, sans-serif';
      g.textBaseline='middle'; g.fillText('?', cx, midY+2); g.textBaseline='alphabetic';
      g.fillStyle='rgba(255,244,230,.5)'; g.font='600 16px Fredoka, sans-serif'; g.fillText('? ? ?', cx, top+ch-16);
    }
  }

  const prompt = dexReturn==='menu' ? 'Tap to go back' : 'Tap to continue →';
  g.fillStyle=C.glow; g.font='700 26px Fredoka, sans-serif'; g.fillText(prompt, W/2, H-30);
  g.textAlign='left';
}

// Planted on the ground, no idle sway.
function drawAsh(){
  const spr=bossSprite(ASH_SPR[ashPose]||ASH_SPR.ready);
  if(!(spr&&spr.ready)) return;
  const im=spr2d(spr), s=ASH_H/im.height, w=im.width*s;
  g.save();
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(ASH_X, FLOOR_Y+8, w*0.34, 8, 0,0,7); g.fill();
  g.imageSmoothingEnabled=true; g.drawImage(im, ASH_X-w/2, FLOOR_Y+6-ASH_H, w, ASH_H);
  g.restore();
}
// a labelled energy bar; turns red when critical (≤10%). right=true anchors the fill to the right.
function drawEnergyBar(x,y,w,label,hp,colA,colB,right){
  const frac=Math.max(0,Math.min(1,hp/100)), crit=hp<=10;
  g.save();
  g.fillStyle='rgba(20,14,36,.82)'; rr(x-4,y-4,w+8,26,8); g.fill();
  g.fillStyle='rgba(0,0,0,.5)'; rr(x,y,w,18,6); g.fill();
  const bw=Math.max(0,w*frac), bx=right?x+w-bw:x;
  const grd=g.createLinearGradient(x,0,x+w,0);
  grd.addColorStop(0, crit?'#ff6a6a':colA); grd.addColorStop(1, crit?'#ff2a2a':colB);
  g.fillStyle=grd; if(bw>0){ rr(bx,y,bw,18,6); g.fill(); }
  g.font='700 12px Fredoka, sans-serif'; g.textBaseline='middle'; g.fillStyle='#fff';
  g.textAlign=right?'right':'left'; g.fillText(label, right?x+w-6:x+6, y+9);
  g.restore(); g.textAlign='left'; g.textBaseline='alphabetic';
}
function drawDuelBars(){
  drawEnergyBar(16, 60, 300, 'PIKACHU', pikaHP, '#ffe14a', '#caa400', false);
  drawEnergyBar(W-316, 60, 300, (boss.cfg.name||'GYARADOS').toUpperCase(), boss.hp, '#6fc0f0', '#2f6fa6', true);
}
function drawDuel(){
  const sc = boss.cfg.duel || scenePreview;   // scenePreview lets the dev menu show a scene before its duel is built
  if(sc==='grove'){
    drawGroveBack(); drawBossSprite();         // grove foe stands on the floor (no overlay)
  } else if(sc==='dojo'){
    drawDojoBack(); drawBossSprite();          // dojo foe stands on the floor (no water overlay)
  } else if(sc==='crystal'){
    drawCrystalBack(); drawBossSprite();       // Scizor stands among the crystals
  } else if(sc==='summit'){
    drawSummitBack(); drawBossSprite();        // Moltres perches on the cliff
  } else {
    drawLairBack();
    drawBossSprite();
    drawLakeFront();        // water in front of his lower body → partly submerged
  }
  if(dodgeWin>0) drawDodgeWave();
  drawZaps(); drawShots(); drawFoeShots();   // Pikachu's bolts/orbs + the boss's incoming blast
  drawAsh();                // trainer on the bank
  const py = player.y + DUEL_PIKA_DROP;   // duel: planted on the floor line
  const sup = pikaCast && pikaCast.super;          // Thunderbolt super: bigger glow + shake, invulnerable
  const shx = sup ? Math.sin(performance.now()/26)*5 : 0;
  if(pikaCast){ const p=Math.min(1,pikaCast.t/pikaCast.windup), gr=(sup?40:28)+p*(sup?46:30);   // charging glow on a special
    g.save(); g.globalAlpha=(sup?0.66:0.5)*Math.min(1,0.3+p); const gx=g.createRadialGradient(PLAYER_X+pikaDX+shx,py-6,4,PLAYER_X+pikaDX+shx,py-6,gr);
    gx.addColorStop(0, sup?'#fffbe0':'#fff7b0'); gx.addColorStop(0.5, sup?'rgba(255,225,74,.7)':'rgba(255,225,74,.5)'); gx.addColorStop(1,'rgba(255,225,74,0)'); g.fillStyle=gx;
    g.beginPath(); g.arc(PLAYER_X+pikaDX+shx,py-6,gr,0,7); g.fill(); g.restore(); }
  if(pikaShield>0) drawShield(PLAYER_X+pikaDX, py);
  if(pikaLunge && pikaLunge.spr && pikaLunge.spr.ready) drawPikaDash(PLAYER_X+pikaDX, py);   // Quick Attack: the dash sprite IS the lunge
  else if(pikaAtk && pikaAtk.spr && pikaAtk.spr.ready) drawPikaAttack();
  else if(dodgeRoll && roll.ready && drawRoll(PLAYER_X+pikaDX, py)){}    // tumbling roll-dodge
  else drawCreature(PLAYER_X+pikaDX+shx, py, player.mood, true, true);   // crouched, planted (no sway)
  drawDuelBars();           // Pikachu energy (left) + Gyarados energy (right)
  // controls (always on during battle): dodge arrows bottom-left, move buttons bottom-right
  if(bossPhase==='battle'){ drawDodgeButtons(); drawMoveBar(); }
  drawHUD();
  if(flash.a>0){ g.fillStyle=flash.col; g.globalAlpha=flash.a; g.fillRect(0,0,W,H); g.globalAlpha=1; }
  if(bossPhase==='intro') drawDuelIntro();
  else if(dodgeWin>0) drawDodgePrompt();
  else if(bossMsgT>0) drawBossMsg();
}
// play the roll frames across the dodge, centred on Pikachu; mirror when rolling right
function drawRoll(x,y){
  const p=Math.min(1, dodgeRoll.t/dodgeRoll.dur);
  const img=roll.frames[Math.min(roll.n-1, Math.floor(p*roll.n))];
  if(!img || !img.complete || !img.width) return false;
  const w=img.width*roll.scale, h=img.height*roll.scale, cy=y-8;
  g.save();
  if(dodgeRoll.dir>0){ g.translate(x,0); g.scale(-1,1); g.translate(-x,0); }   // forward = roll to the right
  g.imageSmoothingEnabled=true; g.drawImage(img, x-w/2, cy-h/2, w, h);
  g.restore(); return true;
}
// big arrow dodge buttons (only during a wind-up); any one dodges
function drawDodgeButtons(){
  const armed = dodgeWin>0;                                       // a foe attack is incoming → dodge now
  const need = !armed ? [] : (boss.atkArc==='high' ? ['back','fwd'] : ['up']);   // the CORRECT button(s) for this attack
  const pulse=0.6+0.4*Math.sin(performance.now()/100);
  for(const r of dodgeBtnRects()){
    const k=r.rad/50;                                    // scale glyph/label with the button size
    const hot = armed && need.includes(r.dir);                   // light up only the right way to dodge
    g.save();
    g.globalAlpha = hot?1 : armed?0.55 : 0.5;
    g.beginPath(); g.arc(r.cx,r.cy,r.rad,0,7); g.fillStyle='rgba(20,14,36,.92)'; g.fill();
    g.lineWidth=hot?4:3; g.strokeStyle=hot?'#9fd8ff':'#5f7da0';
    if(hot){ g.shadowColor='#9fd8ff'; g.shadowBlur=16*pulse; }
    g.beginPath(); g.arc(r.cx,r.cy,r.rad,0,7); g.stroke(); g.shadowBlur=0;
    g.fillStyle='#fff'; g.font='700 '+Math.round(44*k)+'px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(r.glyph, r.cx, r.cy-4*k);
    g.font='700 '+Math.round(13*k)+'px Fredoka, sans-serif'; g.fillStyle=hot?'#cfe6ff':'#9fb2c8';
    g.fillText(r.dir==='up'?'JUMP':'ROLL', r.cx, r.cy+r.rad-15*k);
    g.restore();
  }
}

/* ----- classic (math) boss scene ----- */
function drawBoss(){
  if(bossMode==='duel'){ drawDuel(); return; }
  // stormy tint over the normal backdrop
  g.fillStyle='rgba(20,16,48,.38)'; g.fillRect(0,0,W,FLOOR_Y);
  drawBossSprite();
  // the active challenge: answer cards across the three lanes
  if(bossChal){
    for(let lane=0;lane<3;lane++){
      const y=LANE_Y[lane]-CARD_H/2;
      let reveal=null;
      if(bossChal.locked){
        if(bossChal.result && lane===bossChal.correctLane) reveal='right';   // green only when answered correctly
        else if(!bossChal.result && lane===bossChal.pickLane) reveal='wrong'; // the wrong pick pops
      }
      drawCard(bossChal.x, y, bossChal.choices[lane], LEVELS[levelIdx].theme, !bossChal.locked&&lane===liveLane(), reveal);
    }
  }
  // problem banner so the player can read the sum (or hear it, in the younger game)
  if(bossChal){
    if(PACK.audio){ drawAshPrompt(PROMPT); }
    else {
      const bw=300, bx=W/2-bw/2, by=58, bh=58;
      g.fillStyle='rgba(35,22,53,.78)'; rr(bx,by,bw,bh,18); g.fill();
      g.strokeStyle=C.glow; g.lineWidth=3; rr(bx,by,bw,bh,18); g.stroke();
      g.fillStyle=C.cream; g.font='700 36px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(bossChal.q+' = ?', W/2, by+bh/2+2); g.textAlign='left'; g.textBaseline='alphabetic';
    }
  }
  drawZaps(); drawShots();   // bolts + flying orbs
  // Pikachu: show the move sprite while attacking, else the usual runner
  if(pikaShield>0) drawShield(PLAYER_X, player.y);
  if(pikaAtk && pikaAtk.spr && pikaAtk.spr.ready) drawPikaAttack();
  else drawCreature(PLAYER_X, player.y, player.mood);
  drawMoveBar();
  drawBossHUD();
  drawHUD();
  if(flash.a>0){ g.fillStyle=flash.col; g.globalAlpha=flash.a; g.fillRect(0,0,W,H); g.globalAlpha=1; }
  if(bossCut) drawBossCutIn();                  // attack cut-in rides above the flash
  else if(bossMsgT>0) drawBossMsg();
}

// dramatic move cut-in: bordered panel with the move art + name, pops in & out
function drawBossCutIn(){
  const c=bossCut, p=c.t/c.dur;
  const in_=Math.min(1,c.t/0.16), out=Math.min(1,(c.dur-c.t)/0.22);
  const a=Math.min(in_,out), pop=0.82+0.18*(1-(1-in_)*(1-in_));
  const pw=540, ph=300, cx=W/2, cy=H/2-6;
  g.save(); g.globalAlpha=a; g.translate(cx,cy); g.scale(pop,pop);
  // panel
  g.fillStyle='rgba(12,9,26,.94)'; rr(-pw/2,-ph/2,pw,ph,22); g.fill();
  // art, cover-fit, clipped to the rounded panel (inset for the border)
  const ix=-pw/2+10, iy=-ph/2+10, iw=pw-20, ih=ph-78;
  g.save(); rr(ix,iy,iw,ih,14); g.clip();
  if(c.spr&&c.spr.ready){
    const im=spr2d(c.spr), s=Math.max(iw/im.width, ih/im.height), w=im.width*s, h=im.height*s;
    g.imageSmoothingEnabled=true; g.drawImage(im, ix+(iw-w)/2, iy+(ih-h)*0.32, w, h);  // bias toward the head/action
  } else { g.fillStyle=c.m.col; g.fillRect(ix,iy,iw,ih); }
  // speed-streak overlay sweeping across
  g.globalAlpha=a*0.30; g.strokeStyle='#fff'; g.lineWidth=10;
  for(let i=-2;i<8;i++){ const x=ix-120+i*70+ (p*140); g.beginPath(); g.moveTo(x,iy); g.lineTo(x+90,iy+ih); g.stroke(); }
  g.restore();
  // name ribbon
  g.globalAlpha=a;
  g.fillStyle=c.m.col; rr(-pw/2,ph/2-66,pw,56,0); g.fill();
  g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(-pw/2,ph/2-12,pw,2);
  g.fillStyle='#1a1230'; g.font='800 30px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(boss.cfg.name+' used '+c.m.name+'!', 0, ph/2-37);
  // glowing border
  g.strokeStyle=c.m.col; g.lineWidth=5; g.shadowColor=c.m.col; g.shadowBlur=18;
  rr(-pw/2,-ph/2,pw,ph,22); g.stroke(); g.shadowBlur=0;
  g.textAlign='left'; g.textBaseline='alphabetic'; g.restore();
}

const DUEL_DROP=114;            // lower Gyarados so he sits in the lake (lake duel only)
const DOJO_DROP=100;            // stand the foe on the dojo floor (dojo duel only)
const GROVE_DROP=100;           // stand Venusaur on the grove floor
// how far below BOSS_Y the duel foe is drawn, per scene (lake adds its submersion)
function duelDrop(){
  const d=boss.cfg.duel;
  if(d==='lake')  return DUEL_DROP + (boss.subY||0);
  if(d==='grove') return GROVE_DROP;
  return DOJO_DROP;             // dojo
}
function drawBossSprite(){
  const slide = (bossMode==='duel') ? 0 : (boss.enter>0 ? boss.enter*240 : 0);   // duel: rises/stands instead of sliding
  const chg = !!boss.charging;
  const shake = boss.hurt>0 ? Math.sin(performance.now()/24)*7 : (chg ? Math.sin(performance.now()/26)*6 : 0);   // shudders while charging its heavy
  const drop = (bossMode==='duel') ? duelDrop() : 0;   // per-scene stand/submersion height
  const cx=BOSS_X+slide+shake+(boss.sideX||0)+(boss.lungeX||0), cy=BOSS_Y+drop+Math.sin(boss.bob)*10;   // sidestep + lunge shift x
  // Synthesis recover (grove): a pulsing green aura while it heals in place
  const synth = bossMode==='duel' && boss.cfg.duel==='grove' && boss.diveState!=='up';
  if(chg || synth){                                   // charging = golden; Synthesis = green
    const pr=0.6+0.4*Math.sin(performance.now()/90), R=BOSS_H*0.62;
    g.save(); const gl=g.createRadialGradient(cx,cy,8,cx,cy,R);
    const c0 = synth ? 'rgba(150,240,150,'+(0.5*pr)+')' : 'rgba(255,242,160,'+(0.5*pr)+')';
    const c1 = synth ? 'rgba(150,240,150,0)' : 'rgba(255,242,160,0)';
    gl.addColorStop(0,c0); gl.addColorStop(1,c1);
    g.fillStyle=gl; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill(); g.restore();
  }
  let alpha=1, rot=0, sink=0;
  if(boss.defeated){ const p=Math.min(1,boss.deadT/1.8); alpha=1-p*0.9; rot=p*0.7; sink=p*150; }
  // swap to the aggressive reaction pose while flinching or attacking
  const reacting = !boss.defeated && (boss.hurt>0 || boss.atk>0) && boss.cfg.hurtFile;
  let spr = reacting ? bossSprite(boss.cfg.hurtFile) : bossSprite(boss.cfg.file);
  if(!(spr&&spr.ready)) spr=bossSprite(boss.cfg.file);     // fall back to idle if not loaded yet
  const aseq = (boss.atkSeq && boss.atkSeq.seq.ready) ? boss.atkSeq : null;   // animated special move
  const lungeSpr = (bossLunge && bossLunge.sprite && bossLunge.sprite.ready) ? bossLunge.sprite : null;   // melee charge body
  g.save(); g.globalAlpha=alpha; g.translate(cx,cy+sink); g.rotate(rot);
  if(boss.cfg.flip) g.scale(-1,1);   // mirror bosses whose art faces the wrong way (e.g. Lucario)
  if(lungeSpr){                      // Scizor charging in with the X-Scissor pose (the body IS the attack)
    const im=spr2d(lungeSpr), SH=BOSS_H*1.12, w=im.width*(SH/im.height);
    g.imageSmoothingEnabled=true; g.drawImage(im, -w/2, -SH/2, w, SH);
  } else if(aseq){
    const sq=aseq.seq, p=Math.min(1,aseq.t/aseq.dur), fi=Math.min(sq.n-1,Math.floor(p*sq.n));
    const SH=BOSS_H*1.3, s=SH/sq.ch, w=sq.cw*s;
    g.imageSmoothingEnabled=true; g.drawImage(sq.img, fi*sq.cw,0,sq.cw,sq.ch, -w/2,-SH/2, w,SH);
  } else if(spr&&spr.ready){
    const im=spr2d(spr), s=BOSS_H/im.height, w=im.width*s;
    g.imageSmoothingEnabled=true;
    if(boss.hurt>0) drawTinted(im, 0,0,im.width,im.height, -w/2,-BOSS_H/2, w,BOSS_H, 'rgba(255,80,90,.42)');  // hit flash on the sprite only
    else g.drawImage(im, -w/2, -BOSS_H/2, w, BOSS_H);
  }
  // (no placeholder: if the sprite hasn't loaded yet we simply draw nothing)
  g.restore();
}

function darkenHex(hex,f){ const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  return 'rgb('+Math.round(r*f)+','+Math.round(gg*f)+','+Math.round(b*f)+')'; }
// stand-in serpent boss until the real sprite is supplied (centred on origin)
function drawSerpentPlaceholder(tint,hurt){
  const base=tint||'#2f74c0', body=hurt?'#ffd0d0':base, belly='#eef6ff', fin=darkenHex(base,0.62);
  // coiled body segments (back to front)
  for(let i=6;i>=1;i--){
    const x=-i*34+60, y=Math.sin(i*0.9)*30;
    g.fillStyle = i%2? body:fin;
    g.beginPath(); g.arc(x,y,30-i*1.5,0,7); g.fill();
  }
  // head
  g.fillStyle=body; g.beginPath(); g.ellipse(64,-6,52,42,0,0,7); g.fill();
  g.fillStyle=belly; g.beginPath(); g.ellipse(58,14,30,20,0,0,7); g.fill();
  // crest fin
  g.fillStyle=fin; g.beginPath(); g.moveTo(40,-44); g.lineTo(58,-86); g.lineTo(74,-44); g.closePath(); g.fill();
  // gaping mouth
  g.fillStyle='#7a1322'; g.beginPath(); g.moveTo(96,-18); g.quadraticCurveTo(128,-4,96,22); g.quadraticCurveTo(112,2,96,-18); g.fill();
  g.fillStyle='#fff'; // fangs
  g.beginPath(); g.moveTo(98,-14); g.lineTo(108,-6); g.lineTo(96,-4); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(98,16); g.lineTo(108,8); g.lineTo(96,6); g.closePath(); g.fill();
  // eye
  g.fillStyle='#ffd23a'; g.beginPath(); g.arc(58,-14,11,0,7); g.fill();
  g.fillStyle='#1a1a1a'; g.beginPath(); g.arc(60,-14,5,0,7); g.fill();
  // whisker barbels
  g.strokeStyle=belly; g.lineWidth=5; g.lineCap='round';
  g.beginPath(); g.moveTo(70,26); g.quadraticCurveTo(40,60,76,70); g.stroke();
  g.beginPath(); g.moveTo(84,22); g.quadraticCurveTo(120,50,150,30); g.stroke();
}

// Pikachu's attack flying to the boss. Moves with projectile art (Electro Ball,
// Electroweb, Thunderbolt) fly the real sprite with a glow tail; others draw a
// procedural glowing orb.
function drawShots(){
  const now=performance.now();
  shots.forEach(s=>{
    const p=Math.min(1,s.t/s.dur), arc=s.arc||26;
    const x=s.x0+(s.x1-s.x0)*p, y=s.y0+(s.y1-s.y0)*p - Math.sin(p*Math.PI)*arc;   // gentle arc
    if(s.sprite && s.sprite.ready){                    // --- real projectile sprite (faces right toward the boss) ---
      const im=spr2d(s.sprite), h=s.r*3.4, w=im.width*(h/im.height);
      g.save();
      g.globalAlpha=0.4; g.strokeStyle=s.col; g.lineWidth=6; g.lineCap='round';
      g.beginPath(); g.moveTo(s.x0+(x-s.x0)*0.5, s.y0+(y-s.y0)*0.5 - Math.sin(p*Math.PI)*arc*0.6); g.lineTo(x,y); g.stroke();
      g.globalAlpha=1; g.imageSmoothingEnabled=true; g.drawImage(im, x-w/2, y-h/2, w, h);
      g.restore();
      return;
    }
    const r=s.r*(0.85+0.15*Math.sin(now/40));
    g.save();
    // motion trail
    g.globalAlpha=0.45; g.strokeStyle=s.col; g.lineWidth=4; g.lineCap='round';
    g.beginPath(); g.moveTo(s.x0+(x-s.x0)*0.62, s.y0+(y-s.y0)*0.62 - Math.sin(p*Math.PI)*16); g.lineTo(x,y); g.stroke();
    // glowing core
    g.globalAlpha=1; const gx=g.createRadialGradient(x,y,2,x,y,r);
    gx.addColorStop(0,'#ffffff'); gx.addColorStop(0.45,s.col); gx.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gx; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    // crackle ring
    g.globalAlpha=0.8; g.strokeStyle=s.col; g.lineWidth=2; g.beginPath(); g.arc(x,y,r*0.7,0,7); g.stroke();
    g.restore();
  });
}
// the boss's attack flying to Pikachu. Bosses with projectile art (Venusaur) fly the
// real sprite with a coloured glow tail; others draw a chunky water/aura blast.
function drawFoeShots(){
  const now=performance.now();
  foeShots.forEach(s=>{
    const p=Math.min(1,s.t/s.dur), arc=s.arc||34;
    const x=s.x0+(s.x1-s.x0)*p, y=s.y0+(s.y1-s.y0)*p - Math.sin(p*Math.PI)*arc;   // arcs over toward Pikachu
    if(s.sprite && s.sprite.ready){                    // --- real projectile sprite ---
      const im=spr2d(s.sprite), h=s.r*3.4, w=im.width*(h/im.height);
      g.save();
      // faint coloured trail so it still reads as an incoming attack
      g.globalAlpha=0.4; g.strokeStyle=s.col; g.lineWidth=7; g.lineCap='round';
      g.beginPath(); g.moveTo(s.x0+(x-s.x0)*0.45, s.y0+(y-s.y0)*0.45 - Math.sin(p*Math.PI)*arc*0.6); g.lineTo(x,y); g.stroke();
      g.globalAlpha=1; g.translate(x,y);
      if(s.spin) g.rotate(s.t*7);                       // Razor Leaf tumbles as it flies
      else if(s.flip) g.scale(-1,1);                    // mirror so the head leads the flight (Earth Power)
      g.imageSmoothingEnabled=true; g.drawImage(im, -w/2,-h/2, w,h);
      g.restore();
      return;
    }
    const r=s.r*(0.9+0.12*Math.sin(now/30));
    g.save();
    // streaking tail (longer than Pikachu's, so it reads as an incoming attack)
    g.globalAlpha=0.5; g.strokeStyle=s.col; g.lineWidth=8; g.lineCap='round';
    g.beginPath(); g.moveTo(s.x0+(x-s.x0)*0.4, s.y0+(y-s.y0)*0.4 - Math.sin(p*Math.PI)*arc*0.6); g.lineTo(x,y); g.stroke();
    // glowing core
    g.globalAlpha=1; const gx=g.createRadialGradient(x,y,2,x,y,r);
    gx.addColorStop(0,'#ffffff'); gx.addColorStop(0.5,s.col); gx.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gx; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    g.globalAlpha=0.85; g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=2; g.beginPath(); g.arc(x,y,r*0.62,0,7); g.stroke();
    g.restore();
  });
}
// splash where the boss's attack lands (droplets + a ring)
function duelSplash(x,y,col){
  rings.push({x,y,r:10,maxR:72,life:0.45,col,lw:5});
  for(let i=0;i<12;i++){ const a=Math.random()*Math.PI*2, sp=80+Math.random()*180;
    stars.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,life:0.4+Math.random()*0.3,r:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-0.5)*12,c:col}); }
}
function drawZaps(){
  zaps.forEach(z=>{
    const a=Math.max(0,z.life/z.max);
    g.save(); g.globalAlpha=a; g.strokeStyle='#fff7b0'; g.lineWidth=6; g.lineCap='round'; g.lineJoin='round';
    g.shadowColor=C.glow; g.shadowBlur=18;
    const segs=7; g.beginPath(); g.moveTo(z.x1,z.y1);
    for(let i=1;i<segs;i++){ const t=i/segs; const x=z.x1+(z.x2-z.x1)*t, y=z.y1+(z.y2-z.y1)*t+(Math.random()-0.5)*36; g.lineTo(x,y); }
    g.lineTo(z.x2,z.y2); g.stroke();
    g.strokeStyle=C.spark; g.lineWidth=2.5; g.shadowBlur=0; g.stroke();
    g.restore();
  });
}

/* ----- Pikachu move bar (bottom strip) + charge meter + attack FX ----- */
function moveBarRects(){
  // circular move buttons, hugging the bottom-right (x/y/w/h = the hit box around each circle)
  const ms=availMoves(), n=ms.length, gap=14;
  const D=rowDiameter(n, gap, 94, W*0.74);                 // grows toward the physical-tap floor
  const slots=bottomRightRow(n, D, gap);
  return ms.map((m,i)=>Object.assign({m}, slots[i]));
}
function drawChargeGauge(x,y){
  g.textAlign='left'; g.textBaseline='middle';
  g.fillStyle='#cfc7e0'; g.font='700 13px Fredoka, sans-serif'; g.fillText('CHARGE', x, y);
  for(let i=0;i<MAX_CHARGE;i++){
    const px=x+62+i*16, on=i<charge;
    g.beginPath(); g.arc(px,y,6,0,7);
    if(on){ g.fillStyle='#ffe14a'; g.shadowColor='#ffe14a'; g.shadowBlur=8; g.fill(); g.shadowBlur=0; }
    else { g.fillStyle='rgba(255,255,255,.15)'; g.fill(); }
  }
  g.textBaseline='alphabetic';
}
function drawMoveBar(){
  g.save();
  const duel = bossMode==='duel', KEYS=['Z','X','C','V','B'];
  if(!duel) drawChargeGauge(14, H-54);                  // duel uses energy bars, not the charge meter
  const rects=moveBarRects();
  for(let ki=0; ki<rects.length; ki++){
    const r=rects[ki], m=r.m, sel=(m.key===equipped), cx=r.cx, cy=r.cy, rad=r.rad, k=rad/47;
    const aff = duel ? !(castCD>0||pikaCast) : canCast(m);   // duel: dimmed only while on cooldown / winding up
    g.globalAlpha = aff?1:0.45;
    // base disc
    g.beginPath(); g.arc(cx,cy,rad,0,7); g.fillStyle=sel?'rgba(48,32,72,.98)':'rgba(24,16,40,.9)'; g.fill();
    // move image, fitted inside the circle
    const spr=bossSprite(m.icon||m.file);
    if(spr&&spr.ready){ const im=spr2d(spr);
      g.save(); g.beginPath(); g.arc(cx,cy,rad-4,0,7); g.clip();
      const s=Math.min((rad*2-10)/im.width,(rad*2-10)/im.height)*1.06, iw=im.width*s, ih=im.height*s;
      g.imageSmoothingEnabled=true; g.drawImage(im, cx-iw/2, cy-ih/2, iw, ih);
      g.restore();
    } else {                                              // icon still loading → show the move name so the button is never blank
      g.fillStyle=m.col; g.font='700 '+Math.round(15*k)+'px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(m.name.split(' ')[0], cx, cy-2*k);
    }
    // badge along the bottom: speed/type in a duel, charge cost otherwise
    g.font='700 '+Math.round(13*k)+'px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    const basic = m.kind==='basic';
    const badge = duel ? (basic?'FAST':'POWER') : (m.cost>0?('⚡'+m.cost):'FREE');
    const bw=g.measureText(badge).width+14*k;
    g.fillStyle='rgba(0,0,0,.62)'; rr(cx-bw/2, cy+rad-15*k, bw, 19*k, 9*k); g.fill();
    g.fillStyle= duel ? (basic?'#9af0c6':'#ffd23a') : (m.cost>0?'#ffe14a':'#9af0c6');
    g.fillText(badge, cx, cy+rad-5*k);
    // ring (selected glows)
    g.lineWidth=sel?5:3; g.strokeStyle=sel?m.col:'rgba(255,255,255,.30)';
    if(sel){ g.shadowColor=m.col; g.shadowBlur=14; }
    g.beginPath(); g.arc(cx,cy,rad,0,7); g.stroke(); g.shadowBlur=0;
    // keyboard hint chip (Z X C V B)
    if(KEYS[ki]){ g.fillStyle='rgba(0,0,0,.66)'; g.beginPath(); g.arc(cx, cy-rad+3*k, 11*k, 0, 7); g.fill();
      g.fillStyle='#fff'; g.font='700 '+Math.round(13*k)+'px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(KEYS[ki], cx, cy-rad+4*k); }
    g.globalAlpha=1;
  }
  g.restore(); g.textAlign='left'; g.textBaseline='alphabetic';
}
function drawPikaAttack(){
  const a=pikaAtk, p=Math.min(1,a.t/a.dur), seq=moveSeq(a.m);
  const off = (bossMode==='duel') ? DUEL_PIKA_DROP : 0;   // keep the move grounded in a duel
  if(seq && seq.ready){                                   // animated 4-frame sequence (replaces Pikachu's body)
    const fi=Math.min(seq.n-1, Math.floor(p*seq.n));
    const s=seq.h/seq.ch, w=seq.cw*s, feet=player.y+28+off, x=PLAYER_X+pikaDX-w*seq.ax, y=feet-seq.h;
    g.save(); g.imageSmoothingEnabled=true;
    g.drawImage(seq.img, fi*seq.cw,0,seq.cw,seq.ch, x, y, w, seq.h);
    g.restore(); return;
  }
  const im=spr2d(a.spr); const h=176, w=im.width*(h/im.height);   // fallback: single move image
  const x=PLAYER_X+pikaDX - w*0.34 + p*26, y=player.y - h*0.55 + off;
  g.save(); g.globalAlpha=Math.min(1,(1-p)*1.7+0.22);
  g.imageSmoothingEnabled=true; g.drawImage(im, x, y, w, h);
  g.restore();
}
// Quick Attack lunge: draw the dashing-Pikachu sprite (faces right) at the lunge
// position instead of the idle pose, so the dart-in IS the new art.
function drawPikaDash(x,y){
  const im=spr2d(pikaLunge.spr), h=156, w=im.width*(h/im.height);
  g.save(); g.imageSmoothingEnabled=true;
  g.drawImage(im, x - w*0.40, y - h*0.66, w, h);   // head leads toward the boss; feet near Pikachu's stance
  g.restore();
}
function drawShield(x,y){
  const t=performance.now()/1000;
  g.save(); g.beginPath(); g.ellipse(x, y-8, 50, 62, 0, 0, 7);
  g.globalAlpha=0.16; g.fillStyle='#8fe0ff'; g.fill();
  g.globalAlpha=0.5+0.22*Math.sin(t*5); g.strokeStyle='#8fe0ff'; g.lineWidth=3; g.stroke();
  g.restore();
}

function drawBossHUD(){
  if(!boss) return;
  const bw=380, bx=W/2-bw/2, by=18, bh=22;
  g.save();
  g.fillStyle='rgba(35,22,53,.8)'; rr(bx-6,by-16,bw+12,bh+24,12); g.fill();
  g.fillStyle=C.cream; g.font='700 16px Fredoka, sans-serif'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText((boss.cfg.name||'BOSS').toUpperCase(), bx, by-4);
  // bar
  g.fillStyle='rgba(0,0,0,.45)'; rr(bx,by+4,bw,bh-4,8); g.fill();
  const frac=Math.max(0,boss.hp)/boss.maxHp;
  const grd=g.createLinearGradient(bx,0,bx+bw,0); grd.addColorStop(0,'#ff6b6b'); grd.addColorStop(1,'#ffd23a');
  g.fillStyle=grd; rr(bx,by+4,bw*frac,bh-4,8); g.fill();
  g.restore(); g.textAlign='left';
}

function drawBossMsg(){
  const a=Math.min(1,bossMsgT*2);
  g.save(); g.globalAlpha=a; g.textAlign='center';
  g.font='700 38px Fredoka, sans-serif';
  g.fillStyle=C.ink;  g.fillText(bossMsg, W/2+2, 168+2);
  g.fillStyle=C.glow; g.fillText(bossMsg, W/2, 168);
  g.restore(); g.textAlign='left';
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  drawBackground();
  if(speedMode) drawSpeedLines();
  drawParticles();

  if(state==='menu'){ drawMenu(); drawMuteOnly(); return; }
  if(state==='dex'){ drawDex(); drawMuteOnly(); return; }
  if(state==='boss'){ drawBoss(); return; }
  if(state==='levelup'){ drawCreature(PLAYER_X,player.y,'happy'); drawLevelUp(); return; }
  if(state==='won'){ drawWon(); return; }
  if(state==='over'){ drawOver(); return; }

  // gate cards
  if(gate){
    const L=LEVELS[levelIdx];
    for(let lane=0;lane<3;lane++){
      const y=LANE_Y[lane]-CARD_H/2;
      let reveal=null;
      if(state==='resolve'){
        if(gate.result && lane===gate.correctLane) reveal='right';   // green only when answered correctly
        else if(!gate.result && lane===gate.pickLane) reveal='wrong'; // the wrong pick pops
      }
      const selected=(state==='play'&&lane===liveLane());
      drawCard(gate.x, y, gate.choices[lane], L.theme, selected, reveal);
    }
  }
  drawCreature(PLAYER_X, player.y, player.mood);
  drawHUD();
  if(speedAnnounce>0) drawSpeedBanner();

  // hit/miss flash
  if(flash.a>0){ g.fillStyle=flash.col; g.globalAlpha=flash.a; g.fillRect(0,0,W,H); g.globalAlpha=1; }
}

/* speed-run visuals: golden motion streaks + a burst banner */
function drawSpeedLines(){
  g.save(); g.strokeStyle=C.glow; g.lineWidth=3; g.lineCap='round';
  for(let i=0;i<16;i++){
    const y=(i*47+13)%H, len=70+(i*37)%130;
    const x=W+120-((speedLines+i*131)%(W+240));
    g.globalAlpha=0.10+0.10*(i%3);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y); g.stroke();
  }
  g.restore();
}
function drawSpeedBanner(){
  const a=Math.min(1,speedAnnounce/0.45);
  const sc=1+(1.6-Math.max(0,speedAnnounce))*0.12;
  g.save(); g.globalAlpha=a; g.textAlign='center';
  g.font='700 '+Math.round(50*sc)+'px Fredoka, sans-serif';
  g.fillStyle=C.ink;   g.fillText('⚡ SPEED RUN! ⚡', W/2+3, 150+3);
  g.fillStyle=C.glow;  g.fillText('⚡ SPEED RUN! ⚡', W/2, 150);
  g.restore(); g.textAlign='left';
}
function drawMuteOnly(){
  const k=MUTE.w/40;
  g.save(); g.fillStyle='rgba(35,22,53,.7)'; rr(MUTE.x,MUTE.y,MUTE.w,MUTE.h,12*k); g.fill();
  g.fillStyle=C.cream; g.font=Math.round(20*k)+'px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(['🔇','🔉','🔊'][Audio8.volLevel()], MUTE.x+MUTE.w/2, MUTE.y+MUTE.h/2+1); g.restore();
}

/* ============================================================
   LOOP
   ============================================================ */
// dev-only "jump to" menu: populate once, then it's shown only on the start screen
const devSel = document.getElementById('devjump');
if(DEV && devSel){
  const opt=(v,t)=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; devSel.appendChild(o); };
  opt('', '🛠 Jump to…');
  for(let i=0;i<LEVELS.length;i++) opt('play:'+i, 'Level '+(i+1)+' — play');
  for(let i=0;i<LEVELS.length;i++){ const b=BOSSES[i]||BOSSES[BOSSES.length-1];
    opt('boss:'+i, 'Level '+(i+1)+' boss — '+(b.name||'?')+(b.duel?' (duel)':'')); }
  for(let i=0;i<LEVELS.length;i++){ const b=BOSSES[i]||BOSSES[BOSSES.length-1];
    opt('scene:'+i, 'Scene preview — '+(DUEL_SCENE_BY_LEVEL[i]||'?')+' ('+(b.name||'?')+')'); }
  devSel.addEventListener('change', ()=>{ const v=devSel.value; devSel.value=''; devSel.blur();
    if(!v) return; const ix=v.indexOf(':'); devJump(v.slice(0,ix), +v.slice(ix+1)); });
}

function frame(now){
  let dt=(now-lastT)/1000; lastT=now; if(dt>0.05) dt=0.05;
  updateRenderScale(); layoutTopButtons();   // keep the touch-control size floor matched to the live canvas size
  update(dt); render();
  if(paused) drawPause();             // overlay rides on top of the frozen frame
  if(devSel) devSel.hidden = !(DEV && state==='menu' && !paused);   // dev jump menu: start screen only
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
