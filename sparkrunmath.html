<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Spark Run — Maths Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2b1a4a; --sky-mid:#5b3a8c; --sky-low:#c8688f;
    --sun:#ffcf6b; --coral:#ff7a85; --mint:#7fe3b8; --leaf:#3aa873;
    --ink:#231635; --cream:#fff4e6; --glow:#ffe08a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#15102a;font-family:'Fredoka',system-ui,sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#15102a;}
  /* canvas keeps a fixed 16:9 internal resolution, scaled to fit */
  #game{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto;touch-action:none;}
  /* rotate-to-landscape prompt */
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:linear-gradient(160deg,var(--sky-top),var(--sky-low));color:var(--cream);text-align:center;z-index:50;padding:24px;}
  #rotate .ph{font-size:54px;animation:wig 1.4s ease-in-out infinite;}
  #rotate p{margin-top:14px;font-size:20px;font-weight:600;letter-spacing:.3px;}
  @keyframes wig{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(78deg)}}
  @media (orientation:portrait){#rotate{display:flex;} #stage{filter:blur(2px);}}
  /* tiny credit / mute hint lives on canvas; no DOM HUD needed */
  /* fullscreen toggle — a browser-testing aid; auto-hidden once installed as a PWA */
  #fsbtn{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:60;
    width:42px;height:42px;border:none;border-radius:10px;background:rgba(35,22,53,.55);color:var(--cream);
    font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
  #fsbtn:active{background:rgba(35,22,53,.9);}
  #fsbtn[hidden]{display:none;}
  @media all and (display-mode:standalone){#fsbtn{display:none!important;}}
  /* dev-only "jump to" menu on the start screen (gated by the DEV flag in JS) */
  #devjump{position:fixed;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));z-index:60;
    font-family:'Fredoka',system-ui,sans-serif;font-size:14px;font-weight:600;padding:7px 12px;border-radius:10px;
    border:1px solid rgba(255,255,255,.25);background:rgba(35,22,53,.82);color:var(--cream);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);max-width:70vw;}
  #devjump[hidden]{display:none;}
</style>
</head>
<body>
  <div id="stage"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="rotate"><div class="ph">📱</div><p>Turn your device sideways to play!</p></div>
  <button id="fsbtn" type="button" aria-label="Toggle fullscreen" hidden>⛶</button>
  <select id="devjump" aria-label="Dev: jump to a part of the game" hidden></select>

<script>
"use strict";
/* ============================================================
   SPARK RUN — a maths-choice runner for ~Year 2/3 (ages 6–8)
   Single file. Original art + original chiptune. No deps.
   Mechanic: creature auto-runs; tap hops it UP one lane
   (ground→mid→high→ground). Three answers float at those
   lane heights. The lane it's in when the gate arrives = answer.
   ============================================================ */

const cv = document.getElementById('game');
const g  = cv.getContext('2d');
const W = 960, H = 540;                 // fixed virtual resolution

// ---------- responsive touch controls ----------
// The canvas renders at a fixed 960×540 and is letterboxed to fit (object-fit:
// contain), so on small / oddly-shaped tablets the drawn buttons can fall below
// a comfortable physical tap size. We track the live CSS-px-per-canvas-unit
// scale and inflate button diameters to honour a physical-pixel floor, while
// keeping the clusters anchored in the bottom-right thumb-zone and clamped to
// fit the available width. The rect generators below feed BOTH drawing and
// hit-testing, so layout and input stay in lock-step.
let RENDER_SCALE = 1;                    // CSS pixels per canvas unit
function updateRenderScale(){ const r=cv.getBoundingClientRect(); if(r.width>0) RENDER_SCALE=r.width/W; }
addEventListener('resize', updateRenderScale);
addEventListener('orientationchange', ()=>setTimeout(updateRenderScale,200));
updateRenderScale();

// ---------- fullscreen toggle (browser-testing aid; a no-op / hidden once a PWA) ----------
(function(){
  const fsBtn=document.getElementById('fsbtn'); if(!fsBtn) return;
  const el=document.documentElement;
  const reqFs=el.requestFullscreen||el.webkitRequestFullscreen;
  const exitFs=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
  function sync(){
    if(!reqFs || standalone()){ fsBtn.hidden=true; return; }   // unsupported or already an installed PWA
    fsBtn.hidden=false; fsBtn.textContent=isFs()?'✕':'⛶';      // ✕ = exit, ⛶ = enter
  }
  fsBtn.addEventListener('click', ()=>{
    try{ if(isFs()){ exitFs&&exitFs.call(document); } else { const p=reqFs&&reqFs.call(el); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}
  });
  document.addEventListener('fullscreenchange', ()=>{ sync(); updateRenderScale(); });
  document.addEventListener('webkitfullscreenchange', ()=>{ sync(); updateRenderScale(); });
  sync();
})();
const MIN_TAP_CSS = 46;                  // smallest comfortable touch target (CSS px)
const CTRL_PAD = 22;                     // gap from the canvas edges (canvas units)
// Pick a button diameter for a row of n circles: at least the design size, grown
// toward the physical-tap floor, but clamped so the whole row still fits `avail`.
function rowDiameter(n, gap, baseD, avail){
  const D=Math.max(baseD, MIN_TAP_CSS/RENDER_SCALE);   // honour the physical floor
  const maxD=(avail-(n-1)*gap)/n;                       // largest that still fits the row
  return Math.max(46, Math.min(D, maxD));
}
// Lay n circles out as a row hugging the bottom-right corner, growing leftward.
function bottomRightRow(n, D, gap){
  const cy=H-CTRL_PAD-D/2, tot=n*D+(n-1)*gap; let x=W-CTRL_PAD-tot;
  const out=[]; for(let i=0;i<n;i++){ out.push({cx:x+D/2, cy, rad:D/2, x, y:cy-D/2, w:D, h:D}); x+=D+gap; }
  return out;
}

// offscreen buffer for isolated sprite tinting
const tintBuf=document.createElement('canvas'); const tg=tintBuf.getContext('2d');
// draw a sprite region with a red tint that sticks to the sprite's own pixels
// (compositing in a private buffer, so it never floods the whole bounding box)
function drawTinted(src, sx,sy,sw,sh, dx,dy,dw,dh, rgba){
  const bw=Math.max(1,Math.ceil(dw)), bh=Math.max(1,Math.ceil(dh));
  tintBuf.width=bw; tintBuf.height=bh;
  tg.clearRect(0,0,bw,bh); tg.imageSmoothingEnabled=true; tg.globalCompositeOperation='source-over';
  tg.drawImage(src, sx,sy,sw,sh, 0,0,dw,dh);
  tg.globalCompositeOperation='source-atop'; tg.fillStyle=rgba; tg.fillRect(0,0,bw,bh);
  g.drawImage(tintBuf, dx,dy);
}

/* ---------- sprite sheets: Pikachu run cycle + jump ---------- */

celeb.img.onload = ()=>{ celeb.ready=true; };
celeb.img.src = 'pikachu-celebrate.png';
// dodge-roll: 4 separately-sized frames (start → tuck → descent → end), one uniform scale
const roll = { frames:[], n:4, loaded:0, ready:false, scale:0.58 };
['pika_roll0.png','pika_roll1.png','pika_roll2.png','pika_roll3.png'].forEach((f,i)=>{
  const o=new Image(); o.onload=()=>{ if(++roll.loaded>=roll.n) roll.ready=true; }; o.src=f; roll.frames[i]=o;
});
// animated special-move sequences (4-frame strips: prep → charge → launch → aftermath)
// h = on-screen height of a cell; ax = how far left of Pikachu's x the cell is anchored
const MOVE_SEQ = {

};
for(const k in MOVE_SEQ){ const s=MOVE_SEQ[k]; s.n=4; s.img=new Image(); s.ready=false; s.img.onload=()=>{ s.ready=true; }; s.img.src=s.file; }
function moveSeq(m){ return m ? MOVE_SEQ[m.key] : null; }
// Gyarados special-move sequences (4-frame strips), keyed by the move's sprite file

  // Lucario move strips (4-frame sequences extracted from the supplied sheets)
  'luca_aurasphere.png':  { file:'luca_seq_as.png', cw:338, ch:305 },

  'venu_earthpower.png':  { file:'venu_seq_ep.png', cw:566, ch:323 },
  'venu_frenzyplant.png': { file:'venu_seq_fp.png', cw:632, ch:340 },
  // Scizor move strips (white-bg sheets via tools/extract_scizor.py; shared cell ch=348)
  'sciz_xscissor.png':   { file:'sciz_seq_xs.png', cw:521, ch:348 },
  'sciz_swordsdance.png':{ file:'sciz_seq_sd.png', cw:408, ch:348 },
  'sciz_bulletpunch.png':{ file:'sciz_seq_bp.png', cw:572, ch:348 },
  'sciz_airslash.png':   { file:'sciz_seq_as.png', cw:312, ch:348 },
  // Galarian Moltres move strips (white-bg sheets via tools/extract_moltres.py; shared cell ch=467)
  'moltres_fierywrath.png': { file:'moltres_seq_fw.png', cw:778, ch:467 },
  'moltres_airslash.png':   { file:'moltres_seq_as.png', cw:941, ch:467 },
  'moltres_darkpulse.png':  { file:'moltres_seq_dp.png', cw:793, ch:467 },
  'moltres_hurricane.png':  { file:'moltres_seq_hr.png', cw:930, ch:467 },
};
for(const k in BOSS_SEQ){ const s=BOSS_SEQ[k]; s.n=4; s.img=new Image(); s.ready=false; s.img.onload=()=>{ s.ready=true; }; s.img.src=s.file; }
const BOSS_X = 760, BOSS_Y = 232, BOSS_H = 280;   // boss anchor + on-screen height
// one boss per level — drop a PNG in and set its file; null = drawn placeholder.
// (more Pokémon to come; each gets its own sprite + tint.)
const BOSSES = [

    duel:'lake',                                  // L1 uses the no-math lair duel (lake scene)
    evade:'submerge', lowhp:'heal',               // slips under to dodge; dives to recover at low HP
    roar:'gyara_roar.mp3', cry:'gyara_cry.mp3', roar2:'gyara_roar2.mp3',
    atkSeqs:['gyara_waterfall.png','gyara_icefang.png'],   // specials cycled as attacks

    lines:[
      { who:'gyara', txt:'GRAAAH! Who disturbs my lake?' },
      { who:'pika',  txt:'Pika-pi! (We just want to pass!)' },
      { who:'gyara', txt:'None shall pass. Feel my Outrage!' },

    ],
    moves:[
      { name:'Dragon Dance', file:'gyara_dragondance.png', col:'#b18cf0' },
      { name:'Waterfall',    file:'gyara_waterfall.png',   col:'#5fb0e6' },
      { name:'Earthquake',   file:'gyara_earthquake.png',  col:'#caa46a' },

    ] },
  { name:'Lucario',  file:'lucario.png',  hurtFile:'lucario_hurt.png', tint:'#3f6fd0',
    duel:'dojo',                                  // L2 uses the no-math dojo duel
    evade:'sidestep', lowhp:'enrage',             // sidesteps to dodge; Swords Dance enrage at low HP (no heal)
    flip:true,                                    // his art faces right; mirror it to face Pikachu
    // voice clips: growl=intro/roar, aura=cry/faint, energy=Swords-Dance power-up

    // his special-move strips, cycled as attacks; powerSeq plays on the Swords-Dance enrage
    atkSeqs:['luca_aurasphere.png','luca_flashcannon.png','luca_dragonpulse.png','luca_vacuumwave.png'],
    powerSeq:'luca_flashcannon.png',
    heavy:'luca_aurasphere.png', heavyName:'Aura Sphere',  // signature 30% move (charged, telegraphed)
    lines:[
      { who:'foe',  txt:'You carry a strong aura, Pikachu. Show me its limit.' },
      { who:'pika', txt:'Pika-pi! (We accept your challenge!)' },

    // proj = real projectile art that flies at Pikachu (like Venusaur); flip mirrors

    moves:[

    // spin = tumble it (Razor Leaf swirl); flip = mirror so its head leads the flight.
    moves:[
      { name:'Sludge Bomb', file:'venu_sludgebomb.png',  proj:'venu_proj_sb.png', col:'#b06ad0' },

      { name:'Earth Power', file:'venu_earthpower.png',  proj:'venu_proj_ep.png', col:'#e0954a', flip:true },

    ] },

    flip:true,                                    // his art faces right; mirror it to face Pikachu

    powerSeq:'sciz_swordsdance.png',                         // Swords Dance flourish on the enrage
    heavy:'sciz_xscissor.png', heavyName:'X-Scissor',        // charged melee LUNGE (Scizor charges in)

    // proj = real projectile art; lunge = Scizor's body charges in instead of firing.

/* ---- Achievement gallery ("Spark Friends") ----
   Every Pokémon you defeat in a battle joins the gallery (saved between
   sessions). Each slot shows that Pokémon's sprite with a gentle idle bob by
   default. To give one a UNIQUE looping animation, drop a horizontal frame-strip
   PNG (same convention as the move strips: N frames side by side, cw×ch each)
   and add an entry here keyed by the boss's name, e.g.:
       'Lucario': { file:'dex_lucario.png', cw:200, ch:200, n:6, fps:8 },
   Without an entry the static sprite is used — so the screen works now and the
   animations slot in later with no other code changes. */
const ACH_ANIM = {
  // 'Gyarados':        { file:'dex_gyarados.png', cw:200, ch:200, n:6, fps:8 },
  // 'Lucario':         { file:'dex_lucario.png',  cw:200, ch:200, n:6, fps:8 },
  // 'Venusaur':        { file:'dex_venusaur.png', cw:200, ch:200, n:6, fps:8 },
  // 'Scizor':          { file:'dex_scizor.png',   cw:200, ch:200, n:6, fps:8 },
  // 'Galarian Moltres':{ file:'dex_moltres.png',  cw:200, ch:200, n:6, fps:8 },
};
for(const k in ACH_ANIM){ const s=ACH_ANIM[k]; s.n=s.n||4; s.fps=s.fps||8; s.img=new Image(); s.ready=false; s.img.onload=()=>{ s.ready=true; }; s.img.src=s.file; }

const bossImgs={};                                // lazy sprite cache, keyed by filename
// Some source PNGs ship with a semi-transparent dark fringe (a low-alpha matte
// ring) that reads as a black box over the bright sky. On load we flood-fill in
// from the borders through any low-alpha pixels and knock them fully clear — this
// erases the halo while leaving the solid sprite (and its interior dark parts,
// e.g. Lucario's black, which keep full alpha) untouched.
const DARKBG=new Set(['gyarados.png']);   // sprites whose source art bakes in a dark background disc
function cleanSprite(o){
  try{
    const im=o.img, w=im.width, h=im.height;
    if(!w||!h) return;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const cx=c.getContext('2d'); cx.drawImage(im,0,0);
    const id=cx.getImageData(0,0,w,h), d=id.data, CUT=180, seen=new Uint8Array(w*h), stack=[];
    const dark=DARKBG.has(o.file);
    // background = transparent/fringe; for DARKBG sprites also the connected near-black matte
    const isBg=i=>{ const a=d[i*4+3]; if(a<CUT) return true; if(!dark) return false;
      return (0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]) < 60; };
    const push=(x,y)=>{ if(x<0||y<0||x>=w||y>=h) return; const i=y*w+x; if(seen[i]||!isBg(i)) return; seen[i]=1; stack.push(i); };
    for(let x=0;x<w;x++){ push(x,0); push(x,h-1); }
    for(let y=0;y<h;y++){ push(0,y); push(w-1,y); }
    while(stack.length){ const i=stack.pop(); d[i*4+3]=0; const x=i%w, y=(i/w)|0; push(x+1,y); push(x-1,y); push(x,y+1); push(x,y-1); }
    cx.putImageData(id,0,0); o.cnv=c;
  }catch(e){ /* tainted canvas (e.g. file://) — fall back to the raw image */ }
}
function bossSprite(file){
  if(!file) return null;
  if(!bossImgs[file]){ const o={img:new Image(),ready:false,cnv:null,file}; o.img.onload=()=>{ cleanSprite(o); o.ready=true; }; o.img.src=file; bossImgs[file]=o; }
  return bossImgs[file];
}
// the drawable for a sprite: the cleaned canvas if we have it, else the raw image
function spr2d(s){ return s ? (s.cnv||s.img) : null; }

// A run/jump sheet is sliced into equal frames, but the source art lets each
// Pokémon's tail spill across a cell boundary — so a frame ends up with a
// detached scrap of its neighbour's tail. For every frame we keep only the
// largest connected blob (the real body+tail) and clear the strays.
function cleanSheet(img, frames){
  try{
    const w=img.width, h=img.height, fw=Math.floor(w/frames), CUT=40;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const cx=c.getContext('2d'); cx.drawImage(img,0,0);
    const id=cx.getImageData(0,0,w,h), d=id.data;
    for(let f=0;f<frames;f++){
      const x0=f*fw, x1=(f===frames-1)?w:x0+fw, fwid=x1-x0;
      const lab=new Int32Array(fwid*h), sizes=[0], stack=[]; let cur=0;
      const solid=(nx,ny)=> d[(ny*w+(x0+nx))*4+3] > CUT;
      for(let y=0;y<h;y++) for(let x=0;x<fwid;x++){
        const li=y*fwid+x;
        if(lab[li] || !solid(x,y)) continue;
        cur++; sizes[cur]=0; stack.length=0; stack.push(li); lab[li]=cur;
        while(stack.length){
          const k=stack.pop(); sizes[cur]++; const kx=k%fwid, ky=(k/fwid)|0;
          if(kx+1<fwid){ const ni=k+1;    if(!lab[ni]&&solid(kx+1,ky)){ lab[ni]=cur; stack.push(ni); } }
          if(kx-1>=0)  { const ni=k-1;    if(!lab[ni]&&solid(kx-1,ky)){ lab[ni]=cur; stack.push(ni); } }
          if(ky+1<h)   { const ni=k+fwid; if(!lab[ni]&&solid(kx,ky+1)){ lab[ni]=cur; stack.push(ni); } }
          if(ky-1>=0)  { const ni=k-fwid; if(!lab[ni]&&solid(kx,ky-1)){ lab[ni]=cur; stack.push(ni); } }
        }
      }
      let best=1; for(let i=2;i<sizes.length;i++) if(sizes[i]>sizes[best]) best=i;
      for(let y=0;y<h;y++) for(let x=0;x<fwid;x++){ const li=y*fwid+x; if(lab[li]&&lab[li]!==best) d[(y*w+(x0+x))*4+3]=0; }
    }
    cx.putImageData(id,0,0); return c;
  }catch(e){ return null; }   // tainted canvas (e.g. file://) — fall back to the raw sheet
}

/* ---------- lane geometry ---------- */
const FLOOR_Y = 472;
const LANE_Y  = [430, 318, 206];        // [ground, mid, high] = creature CENTER y
const PLAYER_X = 232;                    // creature x (also the "choice line")
// in a duel Pikachu stands still on the ground: drop him so his feet meet the
// floor line (run baseline leaves a ~14px gap that reads as "floating").
const DUEL_PIKA_DROP = 16;
// Timed-jump feel: a tap launches a real arc — a springy eased rise, a brief
// hover at the apex, then a gravity-accelerated drop. The descent is asymmetric
// (steeper than the climb). Pikachu does NOT hold the lane: you must time the
// jump so he is at the right height when the answer card reaches him.
const RISE_EASE = 9;                       // eased-rise rate — lower = gentler / floatier climb
const JUMP_HANG = 0.44;                    // seconds to hover at the apex before dropping ("a short time")
const JUMP_GRAV = 3400;                    // downward acceleration (px/s²) — higher = steeper, snappier fall
// Which lane Pikachu counts as, from his y anchor. Rather than testing a single
// point, we give him a vertical CATCH BAND (an area up his body, since his anchor
// sits near his feet) and register the highest lane whose balloon band that catch
// band overlaps — so much more of the character image counts as "contact".
// (CARD_H is read lazily inside the function — it's declared further down.)
const PIKA_REACH_UP = 52;                  // catch area above the anchor (toward head) — bigger = more forgiving
const PIKA_REACH_DN = 42;                  // catch area below the anchor (toward feet) — keeps a lane registered longer on the way down
const PIKA_HALF_W   = 36;                  // Pikachu's horizontal half-width — sets how long the balloon "passes over" him
function overlapsBalloon(y, L){            // does Pikachu's vertical catch band overlap lane L's balloon band?
  const bh=CARD_H/2, top=LANE_Y[L]-bh, bot=LANE_Y[L]+bh;
  return y-PIKA_REACH_UP <= bot && y+PIKA_REACH_DN >= top;
}
function laneFromY(y){
  for(let L=2; L>=1; L--){ if(overlapsBalloon(y,L)) return L; }   // prefer the higher lane on any overlap
  return 0;                                 // no balloon overlap → ground lane
}
function liveLane(){ return laneFromY(player.y); }            // the lane Pikachu is at right now
const CARD_W = 122, CARD_H = 100;        // answer container size

/* ============================================================
   AUDIO — original 80s-ish synth, generated live (Web Audio)
   ============================================================ */
const Audio8 = (()=> {
  let ctx=null, master=null, started=false, muted=false, timer=null, step=0;const bgm = new Audio('music.mp3');   // file sitting next to the .html
bgm.loop = true; bgm.volume = 0.5;
const cheer = new Audio('levelup.mp3'); cheer.volume = 0.85;   // end-of-level celebration
const fast = new Audio('music2.mp3'); fast.loop = true; fast.volume = 0;   // speed-run track
let speedOn=false, fadeT=null; const NORM_VOL=0.5, FAST_VOL=0.6;
// volume has three stages: 2=full, 1=low, 0=mute. `muted` mirrors stage 0 so the
// existing mute checks keep working; low just scales every output down.
let level=2;
function volMul(){ return [0,0.32,1][level]; }
function applyVol(){ const m=volMul();
  if(master) master.gain.value=0.16*m;
  bgm.volume=(speedOn?0:NORM_VOL)*m; fast.volume=(speedOn?FAST_VOL:0)*m; cheer.volume=0.85*m; }
function crossfade(toFast){
  if(fadeT) clearInterval(fadeT);
  const up = toFast?fast:bgm, dn = toFast?bgm:fast;
  if(!muted){ up.play().catch(()=>{}); }
  fadeT=setInterval(()=>{
    up.volume=Math.min((toFast?FAST_VOL:NORM_VOL)*volMul(), up.volume+0.05);
    dn.volume=Math.max(0, dn.volume-0.05);
    if(dn.volume<=0.001){ dn.pause(); clearInterval(fadeT); fadeT=null; }
  },45);
}
  // bouncy A-minor-ish loop (original): bass, arp, soft hat
  const bass = [57,57,55,52, 53,53,50,48];                 // MIDI
  const arp  = [72,76,79,76, 71,74,77,74, 69,72,76,72, 65,69,72,69];
  const m2f = m => 440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value=0.16*volMul(); master.connect(ctx.destination);
  }
  function blip(freq,t,dur,type,gain,glideTo){
    const o=ctx.createOscillator(), a=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
    a.gain.setValueAtTime(0.0001,t);
    a.gain.exponentialRampToValueAtTime(gain,t+0.012);
    a.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(a); a.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function hat(t){ // noise burst
    const b=ctx.createBuffer(1, ctx.sampleRate*0.05, ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
    const ga=ctx.createGain(); ga.gain.value=0.10; s.connect(hp); hp.connect(ga); ga.connect(master); s.start(t);
  }
  function loop(){
    if(!ctx) return;
    const spb=0.16; const t=ctx.currentTime+0.03;
    const a=arp[step%arp.length]; const b=bass[Math.floor(step/2)%bass.length];
    blip(m2f(a), t, spb*0.9, 'square', 0.10);
    if(step%2===0) blip(m2f(b-12), t, spb*1.6, 'triangle', 0.18);
    if(step%2===1) hat(t);
    step++;
  }
  return {
    // tap cycles full(2) → low(1) → mute(0) → full…
    cycleVol(){ level = level===0?2:level-1; muted=(level===0); applyVol();
      if(muted){ bgm.pause(); fast.pause(); } else if(started){ (speedOn?fast:bgm).play().catch(()=>{}); }
      return level; },
    volLevel(){ return level; }, volMul(){ return volMul(); },
    isMuted(){return muted;},
    pauseAudio(p){ if(p){ bgm.pause(); fast.pause(); } else if(started && !muted){ (speedOn?fast:bgm).play().catch(()=>{}); } },
    startMusic(){ ensure(); if(started) return; started=true; applyVol(); if(!muted) bgm.play().catch(()=>{}); },
    setSpeed(on){ if(on===speedOn) return; speedOn=on; if(started) crossfade(on); },
    isSpeed(){ return speedOn; },
    cheer(){ if(muted) return; try{ cheer.volume=0.85*volMul(); cheer.currentTime=0; cheer.play().catch(()=>{}); }catch(e){} },
    sfx(kind){
      ensure(); if(!ctx||muted) return; if(ctx.state==='suspended')ctx.resume();
      const t=ctx.currentTime+0.01;
      if(kind==='hop'){ blip(660,t,0.12,'square',0.16,1180); }
      else if(kind==='good'){
        // warm rising arpeggio + bright twinkle = "ding, correct!"
        [784,988,1318,1568].forEach((f,i)=>blip(f,t+i*0.05,0.16,'triangle',0.18));
        blip(2093,t+0.20,0.14,'sine',0.10,2637);
        blip(2637,t+0.27,0.22,'sine',0.07);
      }
      else if(kind==='bad'){ blip(200,t,0.28,'sawtooth',0.16,120); }
      else if(kind==='win'){ [523,659,784,1046,1318].forEach((f,i)=>blip(f,t+i*0.09,0.2,'triangle',0.18)); }
      else if(kind==='select'){ blip(880,t,0.08,'square',0.12); }
    }
  };
})();

/* one-shot voice clips (boss / Pikachu / Ash) — cached <audio>, channelled so a
   character never talks over itself; respects the mute toggle */
const VOICES={}, VCHAN={};
function voice(file, vol, chan){
  try{
    let a=VOICES[file];
    if(!a){ a=new Audio(file); VOICES[file]=a; }
    a.volume = (vol==null?0.9:vol)*Audio8.volMul(); a.currentTime=0;
    if(chan){ const prev=VCHAN[chan]; if(prev && prev!==a){ try{prev.pause();}catch(e){} } VCHAN[chan]=a; }
    if(!Audio8.isMuted()) a.play().catch(()=>{});
    return a;
  }catch(e){ return null; }
}

/* ============================================================
   MATHS — 5 levels on a gentle incremental ramp
   L1 addition only → L2 subtraction only → L3 mix of + and − →
   L4 multiplication only (2,5,10 then 3,4) →
   L5 mix of +, −, × (× uses the hard tables 6,7,8,9).
   Every question stays a plain `a ○ b = ?` with an integer
   answer, so it fits the banner and the answer lanes.
   ============================================================ */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
// draw without repeats: keep a shuffled "bag" per key, refill when empty (reset per level)
let QBAG={};
function drawQ(pool, key){ let b=QBAG[key]; if(!b||!b.length) b=QBAG[key]=shuffle(pool.slice()); return b.pop(); }

//   stage 2 = questions 18–25 (two-digit − two-digit, no borrow, positive)
const L2_POOLS = [

//   stage 0 = questions 1–8   (×2 / ×5 / ×10, small multipliers)
//   stage 1 = questions 9–17  (×2 / ×5 / ×10, multipliers 6–10)
//   stage 2 = questions 18–25 (harder tables: 3,4,6,7,8,9)
// (the supplied batch-1/2 lists repeated some facts in a 2nd column; the exact
//  duplicates are dropped so a run never shows the same fact twice.)
const L3_POOLS = [
  [[4,2],[3,2],[5,2],[2,2],[1,2],[3,5],[4,5],[5,5],[2,5],[1,5],
   [2,10],[4,10],[3,10],[5,10],[1,10]],

   [3,7],[3,9],[4,9],[6,8],[7,3],[6,9],[4,7],[7,4],[8,4],[9,7]],
];

// each level is a 25-question run: gen(step 0..24) -> {q,ans}.
// optional bossGen() gives the end-of-level duel its own flavour of questions.
const MATHS_LEVELS = [
  { name:'Bloom Meadow',  theme:'balloon', count:25,
    // L1 — addition in three difficulty stages, drawn at random (no repeats) from
    // fixed pools: Q1–8 single digit (≤9), Q9–17 into the teens/twenties,
    // Q18–25 two-digit + two-digit (no carry, under 100).
    gen:s=>{
      const stage = s<8 ? 0 : s<17 ? 1 : 2;
      const pair = drawQ(L1_POOLS[stage], 'L1_'+stage);
      const [a,b] = pair; return {q:`${a} + ${b}`, ans:a+b}; },
    // boss — two-digit + single-digit, usually bridging a ten (46+5, 81+9…)
    bossGen:()=>{ const a=rnd(21,89), b=rnd(4,10); return {q:`${a} + ${b}`, ans:a+b}; } },
  { name:'Orchard Hop',   theme:'apple', count:25,
    // L2 — subtraction in 3 difficulty stages, random (no repeats) from fixed
    // pools: Q1–8 single digit (minuend ≤10), Q9–17 teens/twenties − small,
    // Q18–25 two-digit − two-digit (no borrow, positive).
    gen:s=>{
      const stage = s<8 ? 0 : s<17 ? 1 : 2;
      const [a,b] = drawQ(L2_POOLS[stage], 'L2_'+stage);
      return {q:`${a} − ${b}`, ans:a-b}; } },
  { name:'Bubble Bay',    theme:'bubble', count:25,
    // L3 — multiplication in 3 difficulty stages, random (no repeats) from fixed
    // pools: Q1–8 ×2/×5/×10 small, Q9–17 ×2/×5/×10 (6–10), Q18–25 harder tables.
    gen:s=>{
      const stage = s<8 ? 0 : s<17 ? 1 : 2;
      const [a,b] = drawQ(L3_POOLS[stage], 'L3_'+stage);
      return {q:`${a} × ${b}`, ans:a*b}; } },
  { name:'Crystal Caves', theme:'crystal', count:25,
    // L4 — multiplication only: start 2/5/10, widen to 3/4 deeper in
    gen:s=>{ const t = s<6 ? pick([2,5,10]) : pick([2,5,10,3,4]); const n=rnd(2,Math.min(12,4+s)); return {q:`${t} × ${n}`, ans:t*n}; } },
  { name:'Star Summit',   theme:'crystal', count:25,
    // L5 — mix of +, − and × ; the × uses the hard tables 6,7,8,9
    gen:s=>{ const r=rnd(0,2);
             if(r===0){ const a=rnd(15,35), b=rnd(10,28); return {q:`${a} + ${b}`, ans:a+b}; }
             if(r===1){ const a=rnd(25,55), b=rnd(8,Math.min(a-5,29)); return {q:`${a} − ${b}`, ans:a-b}; }
             const t=pick([6,7,8,9]), n=rnd(2,Math.min(12,6+s)); return {q:`${t} × ${n}`, ans:t*n}; } },
];

function makeChoices(ans){
  // build two plausible near-miss distractors (off by 1/2/3/10 — common slips)
  const set=new Set([ans]);
  const cand=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3,ans-3];
  let guard=0;
  while(set.size<3 && guard++<60){ const d=pick(cand)+rnd(-1,1); if(d>=0 && d!==ans) set.add(d); }
  while(set.size<3){ set.add(ans+set.size+2); }            // absolute fallback
  const distract=[...set].filter(v=>v!==ans);
  // drop the correct answer into a uniformly-random lane so it's never predictable
  const out=[null,null,null], correctLane=rnd(0,2);
  out[correctLane]=ans;
  let di=0; for(let i=0;i<3;i++){ if(i!==correctLane) out[i]=distract[di++]; }
  return out;
}

/* ============================================================
   CONTENT PACKS — the same runner/boss engine, different content.
     • maths  : the original written sums (eldest)
     • abc    : audio number/letter recognition (younger) — Ash speaks a
                letter/number; the child jumps to the balloon that matches.
   A pack supplies its own levels; an `audio` pack swaps the written prompt for
   Ash's headshot + a spoken clip, and its level `gen` returns the answer
   choices directly (since letter/number distractors differ from maths).
   ============================================================ */
// pick `ans` + (count-1) distractors from `pool`, drop the answer in a random lane
function pickChoices(ans, pool){
  const set=new Set([ans]); let guard=0;
  while(set.size<3 && guard++<80){ set.add(pick(pool)); }
  const distract=[...set].filter(v=>v!==ans);
  const out=[null,null,null], correctLane=rnd(0,2); out[correctLane]=ans;
  let di=0; for(let i=0;i<3;i++){ if(i!==correctLane) out[i]=distract[di++]; }
  return out;
}
const NUMS = n=>Array.from({length:n},(_,i)=>String(i+1));            // ['1'..'n']
const NRANGE = (a,b)=>{ const o=[]; for(let i=a;i<=b;i++) o.push(String(i)); return o; };   // ['a'..'b']
const LETTERS = (a,b)=>{ const o=[]; for(let c=a.charCodeAt(0);c<=b.charCodeAt(0);c++) o.push(String.fromCharCode(c)); return o; };
// one audio-recognition level: pick a target from `pool`, speak it, show 3 choices
function recogLevel(name, theme, pool){
  return { name, theme, count:8, pool, kind: /[0-9]/.test(pool[0]) ? 'numbers' : 'letters',
    gen:()=>{ const t=pick(pool); return { q:t, ans:t, choices:pickChoices(t,pool), audio:t }; } };
}

/* ---- spoken prompts: play the recorded clip if we have it, else the device voice ---- */
const SAY_CLIPS = new Set([...'abcdefghijklmnopqrstuvwxyz'.split(''), ...NUMS(20)]);
let promptAudio=null;          // the currently-playing prompt clip (drives Ash's lip-flap)
let ashYayT=0;                 // >0 = show Ash's celebration frame in the prompt box
function sayGlyph(v){
  const key=String(v).toLowerCase();
  ashYayT=0;                                                  // a new prompt → back to the talking face
  if(SAY_CLIPS.has(key)){ promptAudio=voice('say_'+key+'.mp3', 1, 'prompt'); return; }
  promptAudio=null;
  try{                                                        // fallback: device speech synthesis
    if(typeof speechSynthesis==='undefined' || Audio8.isMuted()) return;
    const u=new SpeechSynthesisUtterance(/^[a-z]$/.test(key)?key.toUpperCase():key);
    u.rate=0.85; u.pitch=1.1; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function promptTalking(){ return !!(promptAudio && !promptAudio.paused && !promptAudio.ended); }

function devJump(kind, idx){

    levelIdx=idx; hearts=3; groundPlayer();
    const cfg=BOSSES[idx]||BOSSES[BOSSES.length-1];
    bossMode='duel'; bossPhase='preview'; state='boss';
    boss={ cfg, hp:100, maxHp:100, hurt:0, bob:0, enter:0, defeated:false, deadT:0, atk:0,
           subY:0, sideX:0, dives:0, diveState:'up', diveT:0, power:1, riled:false, enraged:false,
           evade:null, evadeDir:1, atkKind:'basic', atkArc:'low', atkDmg:0, atkSeq:null, atkN:0, charging:null };
    scenePreview = DUEL_SCENE_BY_LEVEL[idx] || 'lake';
    shots=[]; foeShots=[]; pikaLunge=null; pikaDX=0; pikaHP=100; pikaCast=null;
    for(const k in ASH_SPR) bossSprite(ASH_SPR[k]);
    return;
  }
  if(kind==='boss'){ levelIdx=idx; stepInLvl=LEVELS[idx].count; hearts=3; groundPlayer(); enterBoss(); }
  else { startLevel(idx); }
}

function spawnGate(){
  const L=LEVELS[levelIdx];
  const {q,ans,choices,audio}=L.gen(stepInLvl);
  const ch = choices || makeChoices(ans);                 // packs may supply their own choices
  // slow at first; ramps with step and level, but capped so a 25-question run stays fair
  const base=92 + levelIdx*16;
  speed = base + Math.min(90, stepInLvl*5);
  gate={ x:W+CARD_W, q, ans, choices:ch, correctLane:ch.indexOf(ans), audio, locked:false, result:null, resolveT:0 };
  groundPlayer();
  if(PACK.audio) sayGlyph(audio!=null?audio:ans);         // speak the prompt for the younger game
}

/* ============================================================
   BOSS BATTLE — a Pokémon caps every level (math attack duel)
   Each question: jump to the right answer → Pikachu Thunderbolt,
   boss −1 HP. A wrong answer → the boss strikes, −1 heart.
   Empty the HP bar to defeat it. (One boss per level.)
   ============================================================ */
function enterBoss(retry){
  state='boss'; gate=null; setSpeedMode(false);
  const cfg=BOSSES[levelIdx]||BOSSES[BOSSES.length-1];
  bossMode = cfg.duel ? 'duel' : 'classic';
  scenePreview=null;                                  // a real fight never inherits a dev scene preview
  const hp = cfg.duel ? 100 : (4+levelIdx*3);         // duel uses a 0-100 energy bar
  boss={ cfg, hp, maxHp:hp, hurt:0, bob:0, enter:1.2, defeated:false, deadT:0, atk:0,
         subY:0, sideX:0, lungeX:0, dives:0, diveState:'up', diveT:0, power:1, riled:false, enraged:false,
         evade:null, evadeDir:1, atkKind:'basic', atkArc:'low', atkDmg:BASIC_DMG, atkSeq:null, atkN:0, charging:null };   // + special-move / charge state
  bossChal=null; bossSpeed=140 + levelIdx*16; bossCut=null; moveIdx=0; pikaAtk=null; pikaShield=0; charge=2; shots=[]; foeShots=[]; pikaLunge=null; bossLunge=null; pikaDX=0;
  if(cfg.hurtFile) bossSprite(cfg.hurtFile);               // preload reaction frame
  (cfg.moves||[]).forEach(m=>{ if(m.proj) bossSprite(m.proj); });   // preload real projectile art (no pop-in)
  if(!availMoves().some(m=>m.key===equipped)) equipped='qa';
  groundPlayer();
  bossHold=0; bossIntroQueue=[];
  const pre = retry ? null : preBattleClip();                // on a retry, skip the announcer/intro and jump back in
  const vs  = retry ? null : (BOSS_VS_CLIP[cfg.name] || null);
  const aBeat = f => ({ gap:0.35, fn:()=>{ ashShow('point',(PRE_DUR[f]||3.0)); return voice(f,1,'ash'); } });
  if(bossMode==='duel'){
    foeTimer=2.6; dodgeWin=0; castCD=0; dodgeRoll=null; pikaDX=0;
    pikaHP=100; pikaCast=null;
    boss.subY = (cfg.duel==='lake') ? 190 : 0;                // only the lake foe starts submerged & rises; others just stand
    bossMsg=''; bossMsgT=0; ashPose='ready'; ashPoseT=0;
    for(const k in ASH_SPR) bossSprite(ASH_SPR[k]);            // preload Ash poses
    if(retry){                                                // straight back into the fight, no cutscene
      bossPhase='battle'; introBeats=[]; introState='done'; introReady=true; introCur=null;
      boss.enter=0; boss.subY=0;
      bossMsg='Try again!  ❤️×'+hearts; bossMsgT=2.0; voice(PIKA_CRY,0.9,'pika'); ashShow('point',1.2);
    } else {
      bossPhase='intro';
      buildIntro(cfg);                                        // kick off the scripted intro (sounds in sequence)
      introBeats = [pre&&aBeat(pre), vs&&aBeat(vs)].filter(Boolean).concat(introBeats);  // announcer + "it's <Boss>!" lead the intro
    }
  } else {
    bossMsg = retry ? ('Try again!  ❤️×'+hearts) : ('A wild '+cfg.name+' appeared!'); bossMsgT=2.0;
    // announcer ×2 → Pikachu's cry → opponent's cry (if any) → questions
    bossIntroQueue = (retry || Audio8.isMuted()) ? [] : [pre, vs, PIKA_CRY, cfg.roar].filter(Boolean);
  }
}
// lost the boss fight → spend a heart and retry; out of hearts → game over.
// (You get as many attempts at the boss as you have hearts left.)
function bossFail(){
  hearts=Math.max(0, hearts-1);
  if(hearts>0){ Audio8.sfx('bad'); enterBoss(true); }
  else { Audio8.sfx('bad'); setSpeedMode(false); state='over'; }
}
/* ---- Gyarados lair duel: no maths, just move-vs-dodge ---- */
const PIKA_VOICE='pika_voice.mp3', PIKA_THUNDER='pika_thunder.mp3', PIKA_CRY='pika_cry.mp3', PIKA_ANGRY='pika_angry.mp3';
const ASH_HEY='ash_hey.mp3', ASH_HUH='ash_battlehuh.mp3', ASH_WANNA='ash_wannabattle.mp3';
const ASH_SPIRIT='ash_spirit.mp3', ASH_BEST='ash_dobest.mp3', ASH_COUNT='ash_counton.mp3';
const ASH_CHEER=[ASH_SPIRIT, ASH_BEST];
function ashSay(file,vol){ voice(file, vol==null?0.95:vol, 'ash'); }   // Ash coaches on his own channel
// Ash warns "Be careful, Pikachu!" when the foe is winding up a special/heavy
function ashWarn(){ if(ashWarnCD>0) return; ashWarnCD=4.0; ashSay('ash_careful.mp3',0.98); ashShow('point',1.5); }
// Ash on the bank: ready (idle), point (coaching), punch (victory)
const ASH_SPR={ ready:'ash_ready.png', point:'ash_point.png', punch:'ash_punch.png', neutral:'ash_neutral.png' };
const ASH_X=108, ASH_H=176;
let ashPose='ready', ashPoseT=0;
function ashShow(pose,dur){ ashPose=pose; ashPoseT=dur; }   // momentary pose, reverts after dur
// scripted pre-fight (kept short): the announcer lines ("…has done his X" +
// "it's <Boss>!") are prepended in enterBoss, then Pikachu's battle cry, then the
// opponent's → "Ready to battle?". Beats are CHAINED: each clip finishes (plus a
// short gap) before the next plays, so the voices never overlap.
function buildIntro(cfg){
  introBeats=[
    { gap:0.3, fn:()=>{ ashShow('point',1.4); return voice(PIKA_CRY,0.95,'pika'); } },   // Pikachu's battle cry
    { gap:0.3, fn:()=> cfg.roar ? voice(cfg.roar,0.97,'foe') : null },                    // opponent's cry
    { gap:0,   fn:()=>{ introReady=true; return null; } },                                // → "Ready to battle?" prompt; tap to start
  ];
  introI=0; introState='idle'; introWaitT=0; introEnded=true; introCur=null; introReady=false;
}
// drive the chained beats: play one, wait for its clip to end (with a safety cap
// in case 'ended' never fires — e.g. muted), pause for the gap, then the next.
function tickIntro(dt){
  if(introState==='done') return;
  if(introState==='idle'){
    if(introI>=introBeats.length){ introState='done'; return; }
    const b=introBeats[introI++];
    const a=b.fn ? b.fn() : null;
    introCur=a; introEnded=!a; introWaitT=0; introGapAfter=(b.gap!=null?b.gap:0.3);
    // muted → no audio plays, so advance briskly; unmuted → 'ended' drives it,
    // with a generous cap (real clips end well under it) so nothing is cut short.
    const muted=Audio8.isMuted();
    const dur = muted ? 0.8 : ((a && isFinite(a.duration) && a.duration>0) ? a.duration : 4.0);
    introMax = dur + (muted?0.05:0.45);
    if(a) a.onended=()=>{ introEnded=true; };
    introState='wait';
  } else if(introState==='wait'){
    introWaitT+=dt;
    if(introEnded || introWaitT>=introMax){ introWaitT=0; introState='gap'; }
  } else if(introState==='gap'){
    introWaitT+=dt;
    if(introWaitT>=introGapAfter) introState='idle';
  }
}
function skipIntro(){ introState='done'; introReady=true; if(introCur){ try{introCur.pause();}catch(e){} } }   // tap → jump to the prompt
function duelBegin(){
  if(bossPhase!=='intro') return;
  bossPhase='battle'; foeTimer=2.6; bossMsg='Battle!'; bossMsgT=1.0;
  voice(PIKA_CRY,0.9,'pika'); ashShow('point',1.4);
}
function canTarget(){ return !boss.defeated && boss.diveState==='up' && !boss.evade && !boss.charging; }   // hittable only when surfaced & not charging its heavy
// tap a move: basic fires instantly, special winds up a moment first
function castMove(m){
  if(castCD>0 || pikaCast || boss.defeated) return;
  equipped=m.key; player.mood='happy'; player.moodT=0.5;
  if(m.key==='tb'){                                   // Thunderbolt = charged SUPER: longer wind-up,
    pikaCast={m, t:0, windup:1.6, super:true};        // Pikachu glows & shakes and can't be hurt, hits for 30%
    voice(PIKA_VOICE,0.8,'pika'); bossMsg='Pikachu charges Thunderbolt! ⚡'; bossMsgT=1.6;
  } else if(m.kind==='special' || m.kind===undefined){  // special = slower build-up, more damage
    pikaCast={m, t:0, windup:0.55}; voice(PIKA_VOICE,0.7,'pika'); bossMsg=m.name+'…'; bossMsgT=0.6;
  } else {                                            // basic = quick, less damage
    applyPikaHit(m); Audio8.sfx('good'); castCD=0.42;
  }
}
// resolve a Pikachu hit (after the wind-up for specials) — Gyarados may submerge to dodge.
// `dmg` overrides the move's damage (Thunderbolt super = 30); the super never gets evaded.
function applyPikaHit(m, dmg){
  const sup = dmg!=null;
  if(!canTarget()){ pikaFire(m); return; }            // he's already under/charging → whiff
  if(!sup && Math.random()<0.28){                     // dodge: step aside (sidestep) or submerge
    const sidestep=boss.cfg.evade==='sidestep';
    boss.evade={t:0,dur:sidestep?0.5:0.7}; boss.evadeDir=Math.random()<0.5?-1:1;
    if(boss.cfg.cry) voice(boss.cfg.cry,0.5,'foe');
    bossMsg=boss.cfg.name+(sidestep?' sidesteps!':' slips under!'); bossMsgT=1.0; pikaFire(m); return;
  }
  boss.hp=Math.max(0, boss.hp-(dmg!=null?dmg:duelDmg(m))); boss.hurt=0.6;
  pikaFire(m); voice(PIKA_THUNDER,0.8,'pika'); flash={a:sup?0.5:0.32,col:m.col};
  if(m.shield) pikaShield=Math.min(3, pikaShield+m.shield);
  if(Math.random()<0.3){ ashSay(pick(ASH_CHEER)); ashShow('point',1.0); }
  bossMsg=(sup?'Pikachu unleashes ':'Pikachu used ')+m.name+'!'; bossMsgT=1.0;
  if(boss.hp<=0){ boss.defeated=true; boss.deadT=0; foeShots=[]; bossMsg=boss.cfg.name+' fainted!'; bossMsgT=2.4; if(boss.cfg.cry) voice(boss.cfg.cry,0.9,'foe'); ashSay('ash_youdidit.mp3',1.0); }
}
function foeAttack(heavy){
  const special = heavy || Math.random()<0.4;         // basic = quick/weaker, special = slower/stronger
  boss.atkKind = heavy?'heavy':(special?'special':'basic');
  boss.atkDmg  = heavy?SUPER_DMG:(special?SPECIAL_DMG:BASIC_DMG);
  boss.atkArc  = Math.random()<0.45 ? 'high' : 'low'; // high = lobbed → roll aside (◀/▶); low = straight → jump (▲)
  boss.atk=0.6; flash={a:heavy?0.55:0.4, col: heavy?'#fff2a0':(special?'#7aa6ff':'#9fd8ff')};
  if(boss.cfg.roar2) voice(boss.cfg.roar2, heavy?0.95:0.7, 'foe');
  if(special && !heavy) ashWarn();                     // "Be careful, Pikachu!" on incoming specials (heavy warned at its charge)
  const windup=(heavy?1.9:special?1.8:1.2)/boss.power; // heavy gives a touch more reaction time
  dodgeWin=windup; dodgeMax=windup; foeTimer=(special?3.2:2.4)/boss.power;
  bossMsg = heavy ? ('Here comes '+(boss.cfg.heavyName||'its heavy move')+' — DODGE!')
                  : special ? (boss.cfg.name+' charges a big attack!') : '';
  bossMsgT = heavy?1.6 : special?1.0 : 0;
  // pick the move strip: heavy uses the signature move; specials cycle the boss's atkSeqs
  let file = heavy ? boss.cfg.heavy : (special && (boss.cfg.atkSeqs||[]).length ? boss.cfg.atkSeqs[boss.atkN++ % boss.cfg.atkSeqs.length] : null);
  let mv = file ? (boss.cfg.moves||[]).find(m=>m.file===file) : null;
  // basics still throw a real projectile (one of the cycled attack moves with art), no cast anim
  if(!mv && !heavy){ const pool=(boss.cfg.moves||[]).filter(m=>m.proj && (boss.cfg.atkSeqs||[]).includes(m.file)); if(pool.length) mv=pick(pool); }
  if(heavy && mv && mv.lunge){                           // melee charge (Scizor X-Scissor): the body IS the attack
    bossLunge={ sprite: mv.proj ? bossSprite(mv.proj) : null, reach: Math.max(140, (BOSS_X-PLAYER_X)-210), back:0 };
  } else {
    if(file){ const sq=BOSS_SEQ[file]; if(sq) boss.atkSeq={seq:sq,t:0,dur:windup}; }   // cast-strip anim for projectile moves
    bossFire(special, mv, heavy);                        // a projectile flies from the boss to Pikachu, arriving as the window closes
  }
}
// the boss's attack travels to Pikachu. Bosses with projectile art (Venusaur) fly
// the real sprite; others get a simulated water/aura/leaf blast styled by move colour.
const DUEL_FIRE_COL = { lake:'#5fb0e6', dojo:'#a8e0ff', grove:'#7be05a' };
function bossFire(special, mv, heavy){
  const drop = duelDrop();
  const x0 = BOSS_X + (boss.sideX||0) - 96, y0 = BOSS_Y + drop - 6;       // the boss's mouth/front
  const x1 = PLAYER_X + (pikaDX||0) + 16,  y1 = player.y + DUEL_PIKA_DROP - 14;   // Pikachu
  const col = (mv && mv.col) || DUEL_FIRE_COL[boss.cfg.duel] || '#5fb0e6';
  const arc = boss.atkArc==='high' ? 150 : 34;          // high attacks lob up and fall onto Pikachu
  const kind = boss.cfg.duel==='grove' ? 'leaf' : (boss.cfg.duel==='dojo' ? 'aura' : 'water');
  foeShots.push({ t:0, dur:dodgeMax, x0,y0,x1,y1, col, r: heavy?32:(special?22:14), kind, arc, heavy:!!heavy,
    sprite: (mv&&mv.proj) ? bossSprite(mv.proj) : null, spin: !!(mv&&mv.spin), flip: !!(mv&&mv.flip) });
}
// start charging the signature heavy move: ~2s glow + shake telegraph, invulnerable while charging
function startHeavy(){
  boss.charging={t:0,dur:2.0};
  flash={a:0.45,col:'#fff2a0'};
  if(boss.cfg.roar2) voice(boss.cfg.roar2,0.95,'foe');
  ashWarn();                                           // Ash warns during the heavy's wind-up
  bossMsg=boss.cfg.name+' powers up — '+(boss.cfg.heavyName||'heavy move')+'!'; bossMsgT=2.0;
}
// directional dodge: a LOW attack must be JUMPED (▲); a HIGH lobbed attack must be
// ROLLED aside (◀/▶). The wrong move (or none) lets the hit land.
function doDodge(dir){
  if(dodgeWin<=0) return;
  if(pikaCast && !pikaCast.super) return;             // committed to a normal special → can't dodge (it'll connect)
  const needRoll = boss.atkArc==='high';
  const correct = needRoll ? (dir==='back'||dir==='fwd') : (dir==='up');
  dodgeWin=0; player.air=true; player.reachedApex=false; player.jumpT=0;
  if(dir==='up'){ player.lane=1; player.targetY=LANE_Y[1]; }
  else { const d=(dir==='back'?-1:1); dodgeRoll={dir:d,t:0,dur:0.5}; player.targetY=LANE_Y[1]; }
  if(correct){ player.mood='happy'; player.moodT=0.4; Audio8.sfx('hop'); bossMsg = needRoll?'Rolled clear!':'Jumped clear!'; bossMsgT=0.7; }
  else { foeHit(); if(state!=='over'){ bossMsg='Wrong way!'; bossMsgT=0.8; } }   // mis-dodge → it connects
}
// the boss's attack connects with Pikachu (shield soaks it, else energy + comeback check)
function foeHit(){
  if(pikaCast && pikaCast.super){ bossMsg='Pikachu is charging — unhurt! ⚡'; bossMsgT=0.8; return; }   // invulnerable mid-Thunderbolt
  if(pikaShield>0){ pikaShield--; bossMsg='Blocked! 🛡️'; bossMsgT=1.0; Audio8.sfx('select'); return; }
  pikaHP=Math.max(0, pikaHP-boss.atkDmg); oopsPuff(PLAYER_X,player.y); Audio8.sfx('bad');
  flash={a:0.45,col:'#ffb3b8'}; bossMsg='Ouch!'; bossMsgT=0.9;
  if(pikaHP<=0){ bossFail(); return; }                   // fainted → spend a heart and retry (or game over)
  if(pikaHP<=18 && !boss.riled) rileUp();                // low-energy comeback surge
}
// the 3 directional dodge buttons — a permanent row hugging the bottom-LEFT
// (mirror of the bottom-right move bar). Always on screen during the battle;
// they light up while a foe attack is winding up, dim otherwise.
function dodgeBtnRects(){
  const items=[['back','◀'],['up','▲'],['fwd','▶']];
  const n=items.length, gap=14, D=rowDiameter(n, gap, 84, W*0.42);
  const cy=H-CTRL_PAD-D/2, x0=CTRL_PAD;                          // bottom-left thumb-zone
  return items.map((it,i)=>{ const x=x0+i*(D+gap);
    return { dir:it[0], glyph:it[1], cx:x+D/2, cy, rad:D/2, x, y:cy-D/2, w:D, h:D }; });
}
// Pikachu nearly out of energy → angry surge that replenishes some of his bar
function rileUp(){
  boss.riled=true; pikaHP=Math.min(100, pikaHP+24);
  voice(PIKA_ANGRY,1.0,'pika'); ashSay(ASH_COUNT); ashShow('point',1.6);
  flash={a:0.5,col:'#ffd23a'}; player.mood='happy'; player.moodT=0.6;
  bossMsg='Pikachu is fired up! ⚡'; bossMsgT=1.8;
}
function updateDuel(dt){
  if(castCD>0) castCD-=dt;
  if(ashWarnCD>0) ashWarnCD-=dt;
  // Ash pose: punch on victory, else revert to ready after a momentary pose
  if(boss.defeated) ashPose='punch';
  else if(ashPoseT>0){ ashPoseT-=dt; if(ashPoseT<=0) ashPose='ready'; }
  // sideways roll-hop: ease Pikachu out and back along x
  if(dodgeRoll){ dodgeRoll.t+=dt; const p=Math.min(1,dodgeRoll.t/dodgeRoll.dur);
    pikaDX=Math.sin(p*Math.PI)*dodgeRoll.dir*98; if(p>=1){ dodgeRoll=null; pikaDX=0; } }
  // melee lunge: Pikachu darts toward the boss, connects at the apex, returns
  if(pikaLunge){ pikaLunge.t+=dt; const p=Math.min(1,pikaLunge.t/pikaLunge.dur);
    pikaDX=Math.sin(p*Math.PI)*pikaLunge.reach;
    if(!pikaLunge.hit && p>=0.5){ pikaLunge.hit=true; bossImpact(); }
    if(p>=1){ pikaLunge=null; pikaDX=0; } }
  // let a dodge-hop fall back down once it has peaked
  if(player.air && player.reachedApex && player.targetY!==LANE_Y[0]){ player.targetY=LANE_Y[0]; player.lane=0; }
  // resolve a special move once its wind-up finishes
  if(pikaCast){ pikaCast.t+=dt; if(pikaCast.t>=pikaCast.windup){ const c=pikaCast; pikaCast=null; applyPikaHit(c.m, c.super?SUPER_DMG:null); Audio8.sfx(c.super?'win':'good'); castCD=c.super?0.7:0.5; } }
  if(boss.atkSeq){ boss.atkSeq.t+=dt; if(boss.atkSeq.t>=boss.atkSeq.dur) boss.atkSeq=null; }   // boss move animation
  // the boss's attack travelling to Pikachu → splashes on arrival
  foeShots=foeShots.filter(s=>{ s.t+=dt; if(s.t>=s.dur){ duelSplash(s.x1,s.y1,s.col); return false; } return true; });
  if(bossPhase!=='battle' || boss.defeated) return;

  // --- boss melee charge (Scizor X-Scissor): accelerate in during the wind-up, strike as the
  //     window closes, then retreat. dodgeWin/foeHit (below) still resolve the dodge. ---
  if(bossLunge){
    if(dodgeWin>0){ const p=1-dodgeWin/dodgeMax; boss.lungeX = -(p*p)*bossLunge.reach; }
    else { bossLunge.back += dt; const q=Math.min(1, bossLunge.back/0.32); boss.lungeX = -(1-q)*bossLunge.reach;
           if(q>=1){ bossLunge=null; boss.lungeX=0; } }
  }

  // --- quick dodge (evading a Pikachu hit): sidestep (lateral) or submerge (sink) ---
  if(boss.evade){ boss.evade.t+=dt; const k=Math.sin(Math.min(1,boss.evade.t/boss.evade.dur)*Math.PI);
    if(boss.cfg.evade==='sidestep') boss.sideX=k*120*(boss.evadeDir||1); else boss.subY=k*150;
    if(boss.evade.t>=boss.evade.dur){ boss.evade=null; boss.subY=0; boss.sideX=0; } return; }

  if(boss.cfg.lowhp==='enrage'){
    // --- Swords Dance: a one-time enrage at low energy (powers up, no heal) ---
    if(!boss.enraged && boss.hp>0 && boss.hp<=boss.maxHp*0.3){
      boss.enraged=true; boss.power=1.35;
      if(boss.cfg.roar2) voice(boss.cfg.roar2,0.95,'foe');
      flash={a:0.5,col:'#ffd23a'};
      const ps=boss.cfg.powerSeq&&BOSS_SEQ[boss.cfg.powerSeq]; if(ps) boss.atkSeq={seq:ps,t:0,dur:1.2};
      bossMsg=boss.cfg.name+' raises its aura — Swords Dance!'; bossMsgT=1.8;
      foeTimer=Math.max(foeTimer,1.3);
    }
  } else if(boss.cfg.lowhp==='heal'){
    // --- recover → replenish → re-emerge stronger (once, when low on energy). The lake
    //     foe submerges to do it; others (grove) recover in place (Synthesis). ---
    const submerge=boss.cfg.duel==='lake';
    if(boss.diveState==='up' && boss.dives<1 && boss.hp>0 && boss.hp<=boss.maxHp*0.3){
      boss.diveState='diving'; boss.diveT=0; dodgeWin=0;
      if(boss.cfg.cry) voice(boss.cfg.cry,0.7,'foe');
      bossMsg=boss.cfg.name+(submerge?' dives to recover!':' uses Synthesis!'); bossMsgT=1.6;
      if(!submerge){ flash={a:0.45,col:'#9af0c6'};                      // green Synthesis flash
        const ps=boss.cfg.powerSeq&&BOSS_SEQ[boss.cfg.powerSeq]; if(ps) boss.atkSeq={seq:ps,t:0,dur:1.2}; }
    }
    if(boss.diveState!=='up'){
      boss.diveT+=dt;
      if(boss.diveState==='diving'){
        if(submerge){ boss.subY=Math.min(170, boss.subY+dt*240); if(boss.subY>=170){ boss.diveState='down'; boss.diveT=0; } }
        else if(boss.diveT>=0.5){ boss.diveState='down'; boss.diveT=0; }   // grove: brief gather, no sink
      } else if(boss.diveState==='down'){
        if(boss.diveT>=1.8){
          boss.hp=Math.min(boss.maxHp, boss.hp+Math.round(boss.maxHp*0.45));   // replenish a bit
          boss.dives++; boss.power=1.35; boss.diveState='rising'; boss.diveT=0;
          if(boss.cfg.roar2) voice(boss.cfg.roar2,0.9,'foe');
          const ps=boss.cfg.powerSeq&&BOSS_SEQ[boss.cfg.powerSeq]; if(ps) boss.atkSeq={seq:ps,t:0,dur:1.2};   // power-up animation
          bossMsg=boss.cfg.name+(submerge?' surges back stronger!':' is invigorated!'); bossMsgT=1.8;
        }
      } else if(boss.diveState==='rising'){
        if(submerge){ boss.subY=Math.max(0, boss.subY-dt*210); if(boss.subY<=0){ boss.diveState='up'; foeTimer=1.6; } }
        else if(boss.diveT>=0.4){ boss.diveState='up'; foeTimer=1.6; }      // grove: snap back to attacking
      }
      return;   // no normal attacks while recovering
    }
  }

  // --- charging the signature heavy move (glow + shake telegraph; invulnerable) ---
  if(boss.charging){
    boss.charging.t+=dt;
    if(boss.charging.t>=boss.charging.dur){ boss.charging=null; foeAttack(true); }   // unleash the 30% heavy
    return;
  }
  // --- normal attack cadence + dodge window ---
  if(dodgeWin>0){
    dodgeWin-=dt;
    if(dodgeWin<=0){ foeHit(); if(state==='over') return; }   // window closed without a dodge → it connects
  } else if(!bossLunge){                                       // hold off the next attack until a lunge finishes retreating
    foeTimer-=dt;
    if(foeTimer<=0){
      if(boss.cfg.heavy && Math.random()<0.25) startHeavy();   // occasionally wind up the signature heavy
      else foeAttack();
    }
  }
}
// boss strikes back: play the next signature-move cut-in (Gyarados has 4)
function bossAttack(){
  const mv=boss.cfg.moves;
  if(!mv||!mv.length){ boss.atk=0.5; flash={a:0.45,col:'#ffb3b8'}; bossMsg='It struck back!'; bossMsgT=1.0; return; }
  const m=mv[moveIdx%mv.length]; moveIdx++;
  bossCut={ m, spr:bossSprite(m.file), t:0, dur:1.35 };
  boss.atk=0.6; flash={a:0.5,col:m.col};
  bossMsg=boss.cfg.name+' used '+m.name+'!'; bossMsgT=1.35;
  return bossCut.dur;
}
function spawnChallenge(){

  const {q,ans,choices,audio} = L.bossGen ? L.bossGen() : L.gen(rnd(Math.floor(L.count*0.6), L.count-1));
  const ch = choices || makeChoices(ans);

}
// the boss's real on-screen body point, so projectiles/bolts actually land on it
function bossAimPoint(){
  if(bossMode==='duel' && boss){
    return { x: BOSS_X + (boss.sideX||0) - 30, y: BOSS_Y + duelDrop() - 20 };
  }
  return { x: BOSS_X-60, y: BOSS_Y };
}
// the burst + flinch when an attack connects with the boss
function bossImpact(aim){
  aim = aim || bossAimPoint();

  if(boss && !boss.defeated) boss.hurt=Math.max(boss.hurt,0.4);

// Pikachu unleashes the equipped move on the boss — the FX now travels to the boss
function pikaFire(m){
  const seq=moveSeq(m);
  pikaAtk={ m, spr:bossSprite(m.file), t:0, dur: seq?0.66:0.62 };
  if(m.dmg>0){
    const aim=bossAimPoint(), proj=m.proj||'bolt';
    const img = m.projImg ? bossSprite(m.projImg) : null;      // real flying-projectile art (else procedural)
    if(proj==='dash' && bossMode==='duel'){
      pikaLunge={ t:0, dur:0.5, reach: Math.max(60, aim.x-(PLAYER_X+90)), hit:false,
                  spr: m.dashProj ? bossSprite(m.dashProj) : null };   // the dash sprite IS the lunging Pikachu
      if(pikaLunge.spr) pikaAtk=null;                          // don't also draw the perform-pose over the dash
    } else if(img){                                            // fly the real sprite to the boss
      const straight = (proj==='bolt');                        // beam shoots flat & fast; orbs lob a little
      shots.push({ sprite:img, t:0, dur: straight?0.2:0.34, x0:PLAYER_X+44, y0:player.y-12, x1:aim.x, y1:aim.y,
                   col:m.col, r:m.dmg>=3?22:16, arc: straight?6:26, hit:false });
    } else if(proj==='orb'){
      shots.push({ kind:'orb', t:0, dur:0.34, x0:PLAYER_X+44, y0:player.y-12, x1:aim.x, y1:aim.y, col:m.col, r:m.dmg>=3?20:15, arc:26, hit:false });
    } else {                                                   // bolt (or dash outside a duel): a quick lightning arc
      zaps.push({ life:0.32, max:0.32, x1:PLAYER_X+40, y1:player.y-6, x2:aim.x, y2:aim.y });
      bossImpact(aim);
    }
  } else {
    correctPop(PLAYER_X+30, player.y-10);     // setup moves sparkle on Pikachu
  }
}
function bossDefeated(){

}

/* ---------- input: tap = jump to mid lane, double-tap = double jump to high ----------
   Each tap raises one lane (ground→mid→high); she can't go past high until she lands.
   After the gate locks she falls back to the ground (apex pose held during the drop). */
// drop everything back to a clean grounded state (start of run / level / question)
function groundPlayer(){
  player.lane=0; player.y=LANE_Y[0]; player.targetY=LANE_Y[0];
  player.air=false; player.reachedApex=false; player.jumping=false; player.descending=false;
  player.vy=0; player.hangT=0; player.jumpT=0;
}
function landJump(){ groundPlayer(); }   // arc finished — back on the ground, ready to jump again

function closeDex(){ const r=dexReturn; newlyCaught=null; state=(r==='won'||r==='levelup')?r:'menu'; }
function openDex(){ dexReturn='menu'; newlyCaught=null; dexT=0; state='dex'; Audio8.sfx('select'); }

function hop(){
  if(state==='dex'){ closeDex(); return; }
  if(state==='menu'){ Audio8.startMusic(); startLevel(0); return; }
  if(state==='over'||state==='won'){ resetRun(); state='menu'; return; }
  if(state==='levelup'){ startLevel(levelIdx+1); return; }
  // timed jump — applies to normal gates AND classic boss challenges
  const active = state==='play' ? gate : (state==='boss' ? bossChal : null);
  if(!active || active.locked) return;
  if(PACK.audio && abcEasy){                        // EASY (younger): hop to the tapped lane and HOLD it until the balloon comes
    player.lane=(player.lane+1)%3;                  // tap cycles ground → mid → high → ground
    player.targetY=LANE_Y[player.lane];
    player.air=(player.lane!==0); player.jumping=false; player.descending=false;
    player.reachedApex=false; player.vy=0; player.hangT=0; player.jumpT=0;
    Audio8.sfx('hop'); return;
  }
  if(!player.jumping || player.descending){      // on the ground or already falling → fresh hop to mid
    player.lane=1;
  } else if(player.lane<2){                        // mid-rise / mid-hover → double-jump to high
    player.lane++;
  } else {                                         // hovering at high → ignore (no infinite hover)
    return;
  }
  player.targetY=LANE_Y[player.lane];
  player.air=true; player.jumping=true; player.descending=false;
  player.reachedApex=false; player.jumpT=0; player.hangT=0; player.vy=0;
  Audio8.sfx('hop');
}

/* mute button hit-test region (top-right) */
const MUTE={x:W-58,y:18,w:40,h:40};
const PAUSE={x:W-106,y:18,w:40,h:40};                          // pause toggle, left of mute
function dexBtnRect(){ return {x:18,y:18,w:104,h:40}; }        // start-screen gallery button (top-left)
const PROMPT={x:W/2-97, y:8, w:194, h:140};                   // top-centre prompt box (text sum, or Ash portrait in the audio pack — sized to the art's ~1.39 aspect, clears the high lane)
const RESUME={x:W/2-150,y:H/2+20,w:300,h:64};                  // big resume button on the pause overlay
// Size the top-corner pause/mute buttons to the physical-tap floor (capped so
// they stay tidy in the HUD) and re-anchor them from the top-right each frame.
function layoutTopButtons(){
  const D=Math.max(40, Math.min(60, MIN_TAP_CSS/RENDER_SCALE)), pad=18, gap=8;
  MUTE.w=MUTE.h=D;   MUTE.x=W-pad-D;        MUTE.y=pad;
  PAUSE.w=PAUSE.h=D; PAUSE.x=MUTE.x-gap-D;  PAUSE.y=pad;
}
function pointInMute(px,py){ return px>=MUTE.x&&px<=MUTE.x+MUTE.w&&py>=MUTE.y&&py<=MUTE.y+MUTE.h; }
function pointInRect(r,px,py){ return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h; }
function inGameplay(){ return state==='play'||state==='resolve'||state==='boss'; }
function setPaused(p){ if(p===paused) return; paused=p; Audio8.pauseAudio(p); Audio8.sfx('select'); }

function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY);
  // account for object-fit:contain letterboxing
  const scale=Math.min(r.width/W, r.height/H);
  const offX=(r.width - W*scale)/2, offY=(r.height - H*scale)/2;
  return { x:(cx-r.left-offX)/scale, y:(cy-r.top-offY)/scale };
}
function onPress(e){
  e.preventDefault();
  const p=canvasPoint(e);
  if(pointInMute(p.x,p.y)){ Audio8.cycleVol(); Audio8.sfx('select'); return; }   // full → low → mute → full
  if(state==='menu'){                                                              // start screen: gallery + pick a player
    if(pointInRect(dexBtnRect(),p.x,p.y)){ openDex(); return; }
    if(pointInRect(diffBtnRect(),p.x,p.y)){ abcEasy=!abcEasy; saveEasy(); Audio8.sfx('select'); return; }   // ABC difficulty
    const pr=playBtnRects();
    if(pointInRect(pr.maths,p.x,p.y)){ selectPack('maths'); startRun(); return; }
    if(pointInRect(pr.abc,p.x,p.y)){ selectPack('abc'); startRun(); return; }
    return;                                                                        // ignore other taps on the menu
  }
  if(inGameplay() && pointInRect(PAUSE,p.x,p.y)){ setPaused(!paused); return; }   // pause / unpause
  if(paused){ if(pointInRect(RESUME,p.x,p.y)) setPaused(false); return; }          // while paused, only Resume responds
  if(PACK.audio && inGameplay() && pointInRect(PROMPT,p.x,p.y)){                   // younger game: tap Ash to hear it again
    const it=(state==='boss')?bossChal:gate; if(it){ sayGlyph(it.audio!=null?it.audio:it.ans); return; }
  }
  if(state==='boss' && bossMode==='duel'){             // lair duel input
    if(bossPhase==='intro'){ if(introReady) duelBegin(); else skipIntro(); return; }   // tap: skip cutscene, then start
    for(const r of dodgeBtnRects()){ if(pointInRect(r,p.x,p.y)){ doDodge(r.dir); return; } }   // bottom-left: dodge (only bites during a wind-up)
    for(const r of moveBarRects()){ if(pointInRect(r,p.x,p.y)){ castMove(r.m); return; } }      // bottom-right: cast a move at the boss
    return;
  }
  if(state==='boss'){                                  // classic boss: tap a move button to equip it (not a jump)
    for(const r of moveBarRects()){
      if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){
        if(!canCast(r.m)){ Audio8.sfx('bad'); return; }       // not enough charge
        if(equipped!==r.m.key){ equipped=r.m.key; Audio8.sfx('select'); }
        return;
      }
    }
  }
  hop();
}
cv.addEventListener('mousedown',onPress);
cv.addEventListener('touchstart',onPress,{passive:false});
// laptop keys: ←/→ dodge roll, ↑/Space jump; Z X C V B = move 1..5 (cast in duel, equip in classic)
const MOVE_KEYS={KeyZ:0,KeyX:1,KeyC:2,KeyV:3,KeyB:4};
window.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){ if(inGameplay()){ e.preventDefault(); setPaused(!paused); } return; }
  if(paused) return;
  const duel = state==='boss' && bossMode==='duel';
  if(state==='boss' && (e.code in MOVE_KEYS)){                  // pick a move by key
    const m=availMoves()[MOVE_KEYS[e.code]];
    if(m){ e.preventDefault();
      if(duel){ if(bossPhase==='battle') castMove(m); }
      else if(canCast(m)){ equipped=m.key; Audio8.sfx('select'); }
    }
    return;
  }
  // directional dodge (any direction works) during the wind-up window
  if(duel && dodgeWin>0 && (e.code==='ArrowLeft'||e.code==='ArrowRight')){ e.preventDefault(); doDodge(e.code==='ArrowLeft'?'back':'fwd'); return; }
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault();
    if(duel){ if(bossPhase==='intro'){ if(introReady) duelBegin(); else skipIntro(); } else if(dodgeWin>0) doDodge('up'); return; }
    hop(); }
});

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  if(paused) return;                  // freeze all game logic while the pause overlay is up
  // master world scroll — drives every parallax layer. Faster in play, faster still in a speed run.
  const runState=(state==='play'||state==='resolve'||state==='boss');
  const duelStill = state==='boss' && bossMode==='duel';        // duels are a static stand-off → freeze the scroll
  const worldSpd = duelStill ? 0 : (runState ? (speedMode?188:96) : 34);
  world += dt*worldSpd;
  player.bob+=dt*4;
  // advance the run-cycle frame (faster while actually running)
  const running = (state==='play'||state==='resolve'||state==='levelup'||state==='menu'||state==='boss');
  player.frameT += dt*(running?12:7);
  player.frame = Math.floor(player.frameT)%pika.frames;
  if(player.moodT>0){ player.moodT-=dt; if(player.moodT<=0) player.mood='run'; }
  // vertical motion. A timed jump (player.jumping) is a real arc; other vertical
  // moves (duel dodge-hop, settling) use a quick symmetric ease.
  if(player.jumping){
    // ----- timed jump arc: eased rise → brief apex hover → gravity fall (steeper than the rise) -----
    if(!player.descending){
      player.y += (player.targetY - player.y)*Math.min(1,dt*RISE_EASE);
      player.jumpT += dt*14;
      player.jumpFrame = Math.min(jump.frames-2, Math.floor(player.jumpT));   // launch / rise frames
      if(player.y - player.targetY < 4){                   // reached the top
        player.reachedApex=true; player.jumpFrame=jump.frames-1;
        player.hangT += dt;
        if(player.hangT >= JUMP_HANG) player.descending=true;   // hover's over → start falling
      }
    } else {
      player.jumpFrame=jump.frames-1;                      // hold the apex pose through the fall
      player.vy += JUMP_GRAV*dt; player.y += player.vy*dt;
      if(player.y >= LANE_Y[0]) landJump();                // back on the ground
    }
  } else {
    // not jumping (duel dodge-hop return, idle settle): quick symmetric ease toward the target
    player.y += (player.targetY - player.y)*Math.min(1,dt*RISE_EASE);
    if(player.air){
      if(player.targetY < LANE_Y[0]-1 && (player.y-player.targetY) < 10) player.reachedApex=true;       // dodge-hop peaked
      if(player.targetY >= LANE_Y[0]-1 && (LANE_Y[0]-player.y) < 16){ player.air=false; player.reachedApex=false; }  // landed
    }
  }

  // trail sparkles
  if(state==='play'||state==='levelup'||state==='boss'){
    if(Math.random()<0.6) trail.push({x:PLAYER_X-18,y:player.y+10,vx:-30-Math.random()*40,vy:(Math.random()-0.5)*30,life:0.5,r:2+Math.random()*3,c:Math.random()<0.5?C.glow:C.spark});
  }
  zaps=zaps.filter(z=>{ z.life-=dt; return z.life>0; });
  // flying energy orbs: advance, and burst on the boss when they land
  shots=shots.filter(s=>{ s.t+=dt; if(s.t>=s.dur){ if(!s.hit){ s.hit=true; correctPop(s.x1,s.y1); if(boss&&!boss.defeated) boss.hurt=Math.max(boss.hurt,0.4); } return false; } return true; });
  trail=trail.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; return p.life>0; });
  confetti=confetti.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=400*dt; p.rot+=p.vr*dt; return p.life>0 && p.y<H+40; });
  if(state==='dex') dexT+=dt;                       // gallery idle/loop animation clock
  if(ashYayT>0) ashYayT-=dt;                         // younger game: Ash's celebration frame timer
  rings=rings.filter(p=>{ p.life-=dt; p.r+=(p.maxR-p.r)*Math.min(1,dt*7); return p.life>0; });
  stars=stars.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.rot+=p.vr*dt; return p.life>0; });
  if(flash.a>0) flash.a=Math.max(0,flash.a-dt*1.6);
  if(speedAnnounce>0) speedAnnounce-=dt;
  if(speedMode) speedLines=(speedLines+dt*1600)%W; else speedLines=0;
  const speedMul=speedMode?1.5:1;        // hot streak = a third less think-time (same question difficulty)

  if(state==='play' && gate){
    gate.x -= speed*speedMul*dt;
    // The moment Pikachu's catch band actually overlaps the CORRECT balloon while it's passing
    // over him, it's a hit — locked instantly (responsive). If the balloon fully passes without
    // ever touching him, it's a miss. cardCx = balloon centre; sprites overlap within ±passHalf.
    const cardCx=gate.x+CARD_W/2, passHalf=CARD_W/2+PIKA_HALF_W;
    // must have CHOSEN the correct lane (not just be passing through it) AND be at its height
    const touched = Math.abs(cardCx-PLAYER_X)<=passHalf && player.lane===gate.correctLane && overlapsBalloon(player.y, gate.correctLane);
    if(!gate.locked && (touched || cardCx < PLAYER_X-passHalf)){
      gate.locked=true;
      gate.result=touched;
      gate.pickLane=touched?gate.correctLane:liveLane();   // which card to flag on the reveal
      gate.resolveT=touched?0.9:0.6;                       // a miss clears a little quicker
      if(player.jumping) player.descending=true;        // card's passed — drop back to the ground
      if(gate.result){
        score+=(10+streak*2)*(speedMode?2:1); streak++; player.mood='happy'; player.moodT=0.7;
        Audio8.sfx('good'); flash={a:0.42,col:'#c9ffe0'}; if(PACK.audio) ashYayT=1.0;   // Ash cheers in the prompt box
        // satisfying pass-through pop, right where she caught the answer (any lane)
        correctPop(PLAYER_X, player.y);
        cardCheer(gate.x+CARD_W/2, LANE_Y[gate.correctLane]);   // green + gold sparkles on the right card
        for(let i=0;i<18;i++) confetti.push({x:PLAYER_X+10,y:player.y,vx:(Math.random()-0.3)*260,vy:-Math.random()*320-60,life:1.1,r:4+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-0.5)*12,c:pick([C.glow,C.coral,C.mint,C.spark])});
        if(streak>=SPEED_STREAK) setSpeedMode(true);    // hot streak → SPEED RUN!
      } else {
        streak=0; hearts--;
        Audio8.sfx('bad'); flash={a:0.4,col:'#ffb3b8'};
        oopsPuff(PLAYER_X, player.y);                   // dazed stumble animation
        cardPop(gate.x+CARD_W/2, LANE_Y[gate.pickLane], themeColor(LEVELS[levelIdx].theme));   // the wrong card pops
        setSpeedMode(false);                            // a miss ends the speed run
      }
      state='resolve';
    }
  }

  if(state==='resolve' && gate){
    gate.x -= speed*0.4*speedMul*dt;
    gate.resolveT-=dt;
    if(gate.resolveT<=0){
      if(hearts<=0){ Audio8.sfx('bad'); setSpeedMode(false); state='over'; return; }
      stepInLvl++;
      const L=LEVELS[levelIdx];
      if(stepInLvl>=L.count){
        enterBoss();                    // cap the level with the Gyarados battle
      } else {
        spawnGate(); state='play';
      }
    }
  }

  if(state==='boss' && boss){
    boss.bob+=dt*2.2;
    if(boss.hurt>0) boss.hurt-=dt;
    if(boss.atk>0)  boss.atk-=dt;
    if(bossMsgT>0)  bossMsgT-=dt;
    if(bossHold>0)  bossHold-=dt;                              // pre-battle announcer hold
    if(bossMode==='duel' && bossPhase==='intro' && !boss.defeated) tickIntro(dt);   // scripted intro audio
    // classic boss: play any queued announcer lines in turn, then start the questions
    if(bossMode==='classic' && !boss.defeated && boss.enter<=0 && !bossChal && bossHold<=0){
      if(bossIntroQueue.length){ const f=bossIntroQueue.shift(); voice(f,1,'ash'); bossHold=(PRE_DUR[f]||3.0)+0.2; }
      else spawnChallenge();
    }
    if(boss.defeated){
      boss.deadT+=dt;
      if(boss.deadT>=1.8) bossDefeated();
    } else if(boss.enter>0){
      boss.enter-=dt;
      if(bossMode==='duel' && boss.cfg.duel==='lake') boss.subY=Math.max(0,(boss.enter/1.2))*190;   // lake: rises up out of the water
    } else if(bossMode==='duel'){
      updateDuel(dt);                          // lair duel: dialogue then move-vs-dodge
    } else if(bossChal){
      bossChal.x -= bossSpeed*dt;
      const cardCx=bossChal.x+CARD_W/2, passHalf=CARD_W/2+PIKA_HALF_W;   // same instant-on-contact scoring as the runner
      const touched = Math.abs(cardCx-PLAYER_X)<=passHalf && player.lane===bossChal.correctLane && overlapsBalloon(player.y, bossChal.correctLane);
      if(!bossChal.locked && (touched || cardCx < PLAYER_X-passHalf)){
        bossChal.locked=true; bossChal.resolveT=0.7; if(player.jumping) player.descending=true;
        bossChal.result=touched;
        bossChal.pickLane=touched?bossChal.correctLane:liveLane();
        if(bossChal.result){
          let m=curMove(); if(!canCast(m)) m=PIKA_MOVES[0];        // safety fallback to Quick Attack
          charge=Math.max(0,Math.min(MAX_CHARGE, charge - m.cost + (m.gain||0)));
          boss.hp-=m.dmg; if(m.dmg>0) boss.hurt=0.6; streak++; score+=20;
          Audio8.sfx('good'); flash={a:0.4,col:m.col}; pikaFire(m); if(PACK.audio) ashYayT=1.0;
          cardCheer(bossChal.x+CARD_W/2, LANE_Y[bossChal.correctLane]);   // green + gold sparkles on the right card
          player.mood='happy'; player.moodT=0.7;
          if(m.shield) pikaShield=Math.min(3, pikaShield+m.shield);
          if(boss.hp<=0){ boss.defeated=true; boss.deadT=0; bossMsg=boss.cfg.name+' fainted!'; bossMsgT=2.2; ashSay('ash_youdidit.mp3',1.0); }
          else bossMsg='Pikachu used '+m.name+'!', bossMsgT=1.2;
          if(!canCast(curMove())) equipped='qa';                  // keep the equipped move castable
        } else if(pikaShield>0){
          pikaShield--; streak=0; player.mood='run';
          Audio8.sfx('select'); flash={a:0.35,col:'#9fd8ff'};
          bossMsg='Blocked '+boss.cfg.name+"'s attack! 🛡️"; bossMsgT=1.3;   // shield soaks it, no heart lost
        } else {
          streak=0; hearts--; oopsPuff(PLAYER_X, player.y);   // dazed stumble animation
          cardPop(bossChal.x+CARD_W/2, LANE_Y[bossChal.pickLane], themeColor(LEVELS[levelIdx].theme));   // the wrong card pops
          Audio8.sfx('bad'); const d=bossAttack(); if(d) bossChal.resolveT=d;   // play boss move cut-in
        }
        if(hearts<=0){ Audio8.sfx('bad'); state='over'; return; }
      }
      if(bossChal.locked){
        bossChal.resolveT-=dt;
        if(bossChal.resolveT<=0 && !boss.defeated){ bossCut=null; spawnChallenge(); }
      }
    }
    if(bossCut){ bossCut.t+=dt; if(bossCut.t>=bossCut.dur) bossCut=null; }
    if(pikaAtk){ pikaAtk.t+=dt; if(pikaAtk.t>=pikaAtk.dur) pikaAtk=null; }
  }
}

function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
