<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Spark Run — Maths Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2b1a4a; --sky-mid:#5b3a8c; --sky-low:#c8688f;
    --sun:#ffcf6b; --coral:#ff7a85; --mint:#7fe3b8; --leaf:#3aa873;
    --ink:#231635; --cream:#fff4e6; --glow:#ffe08a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#15102a;font-family:'Fredoka',system-ui,sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#15102a;}
  /* canvas keeps a fixed 16:9 internal resolution, scaled to fit */
  #game{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto;touch-action:none;}
  /* rotate-to-landscape prompt */
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:linear-gradient(160deg,var(--sky-top),var(--sky-low));color:var(--cream);text-align:center;z-index:50;padding:24px;}
  #rotate .ph{font-size:54px;animation:wig 1.4s ease-in-out infinite;}
  #rotate p{margin-top:14px;font-size:20px;font-weight:600;letter-spacing:.3px;}
  @keyframes wig{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(78deg)}}
  @media (orientation:portrait){#rotate{display:flex;} #stage{filter:blur(2px);}}
  /* tiny credit / mute hint lives on canvas; no DOM HUD needed */
</style>
</head>
<body>
  <div id="stage"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="rotate"><div class="ph">📱</div><p>Turn your device sideways to play!</p></div>

<script>
"use strict";
/* ============================================================
   SPARK RUN — a maths-choice runner for ~Year 2/3 (ages 6–8)
   Single file. Original art + original chiptune. No deps.
   Mechanic: creature auto-runs; tap hops it UP one lane
   (ground→mid→high→ground). Three answers float at those
   lane heights. The lane it's in when the gate arrives = answer.
   ============================================================ */

const cv = document.getElementById('game');
const g  = cv.getContext('2d');
const W = 960, H = 540;                 // fixed virtual resolution

/* ---------- lane geometry ---------- */
const FLOOR_Y = 472;
const LANE_Y  = [430, 318, 206];        // [ground, mid, high] = creature CENTER y
const PLAYER_X = 232;                    // creature x (also the "choice line")
const CARD_W = 122, CARD_H = 100;        // answer container size

/* ---------- palette ---------- */
const C = {
  skyTop:'#2b1a4a', skyMid:'#5b3a8c', skyLow:'#c8688f',
  sun:'#ffd27a', coral:'#ff7a85', mint:'#9af0c6', leaf:'#3aa873', leafDk:'#2c8a5d',
  ink:'#231635', cream:'#fff4e6', glow:'#ffe08a', spark:'#aee9ff'
};

/* ============================================================
   AUDIO — original 80s-ish synth, generated live (Web Audio)
   ============================================================ */
const Audio8 = (()=> {
  let ctx=null, master=null, started=false, muted=false, timer=null, step=0;const bgm = new Audio('music.mp3');   // file sitting next to the .html
bgm.loop = true; bgm.volume = 0.5;
  // bouncy A-minor-ish loop (original): bass, arp, soft hat
  const bass = [57,57,55,52, 53,53,50,48];                 // MIDI
  const arp  = [72,76,79,76, 71,74,77,74, 69,72,76,72, 65,69,72,69];
  const m2f = m => 440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value=0.16; master.connect(ctx.destination);
  }
  function blip(freq,t,dur,type,gain,glideTo){
    const o=ctx.createOscillator(), a=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
    a.gain.setValueAtTime(0.0001,t);
    a.gain.exponentialRampToValueAtTime(gain,t+0.012);
    a.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(a); a.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function hat(t){ // noise burst
    const b=ctx.createBuffer(1, ctx.sampleRate*0.05, ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
    const ga=ctx.createGain(); ga.gain.value=0.10; s.connect(hp); hp.connect(ga); ga.connect(master); s.start(t);
  }
  function loop(){
    if(!ctx) return;
    const spb=0.16; const t=ctx.currentTime+0.03;
    const a=arp[step%arp.length]; const b=bass[Math.floor(step/2)%bass.length];
    blip(m2f(a), t, spb*0.9, 'square', 0.10);
    if(step%2===0) blip(m2f(b-12), t, spb*1.6, 'triangle', 0.18);
    if(step%2===1) hat(t);
    step++;
  }
  return {
    toggle(){ muted=!muted; if(muted) bgm.pause(); else if(started) bgm.play().catch(()=>{}); return muted; },
    isMuted(){return muted;},
    startMusic(){ ensure(); if(started) return; started=true; if(!muted) bgm.play().catch(()=>{}); },
    sfx(kind){
      ensure(); if(!ctx||muted) return; if(ctx.state==='suspended')ctx.resume();
      const t=ctx.currentTime+0.01;
      if(kind==='hop'){ blip(660,t,0.12,'square',0.16,1180); }
      else if(kind==='good'){ [660,880,1320].forEach((f,i)=>blip(f,t+i*0.07,0.14,'square',0.16)); }
      else if(kind==='bad'){ blip(200,t,0.28,'sawtooth',0.16,120); }
      else if(kind==='win'){ [523,659,784,1046,1318].forEach((f,i)=>blip(f,t+i*0.09,0.2,'triangle',0.18)); }
      else if(kind==='select'){ blip(880,t,0.08,'square',0.12); }
    }
  };
})();

/* ============================================================
   MATHS — Year 2/3 progression with plausible distractors
   ============================================================ */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];

// each level: a generator(step 0..n-1) -> {q, ans}
const LEVELS = [
  { name:'Bloom Meadow',  theme:'balloon', count:8,
    gen:s=>{ const cap=10+s; let a=rnd(2,Math.min(9,4+s)), b=rnd(2,Math.max(3,cap-a)); return {q:`${a} + ${b}`, ans:a+b}; } },
  { name:'Orchard Hop',   theme:'apple', count:8,
    gen:s=>{ let a=rnd(8,14+s), b=rnd(2,Math.min(a-1,5+s)); return {q:`${a} − ${b}`, ans:a-b}; } },
  { name:'Bubble Bay',    theme:'bubble', count:9,
    gen:s=>{ if(s%2===0){let a=rnd(6,13+s),b=rnd(3,9);return{q:`${a} + ${b}`,ans:a+b};}
             let a=rnd(11,20+s),b=rnd(3,9);return{q:`${a} − ${b}`,ans:a-b}; } },
  { name:'Crystal Caves', theme:'crystal', count:9,
    gen:s=>{ const t=pick([2,5,10,2,5]); const n=rnd(2,2+Math.min(8,3+s)); return {q:`${t} × ${n}`, ans:t*n}; } },
  { name:'Star Summit',   theme:'crystal', count:10,
    gen:s=>{ if(s%3===2){const t=pick([2,5,10]);const n=rnd(2,9);return{q:`${t*n} ÷ ${t}`,ans:n};}
             const t=pick([3,4,3,4,2,5]);const n=rnd(2,9);return{q:`${t} × ${n}`,ans:t*n}; } },
];

function makeChoices(ans){
  const set=new Set([ans]); const out=[];
  // plausible near-misses (off by 1/2/10, common errors)
  const cand=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3];
  while(set.size<3){ const d=pick(cand)+rnd(-1,1); if(d>=0 && d!==ans && !set.has(d)){ set.add(d); } }
  set.forEach(v=>out.push(v));
  // shuffle
  for(let i=out.length-1;i>0;i--){const j=rnd(0,i);[out[i],out[j]]=[out[j],out[i]];}
  return out;
}

/* ============================================================
   GAME STATE
   ============================================================ */
let state='menu';           // menu | play | resolve | levelup | over | won
let levelIdx=0, stepInLvl=0, score=0, streak=0, hearts=3;
let prizes=[];              // collected sparks per level

const player = { lane:0, y:LANE_Y[0], targetY:LANE_Y[0], bob:0, hopT:0, mood:'run', moodT:0 };
let gate=null;              // {x, choices:[..], correct, locked, result}
let speed=120;             // px/sec the gate approaches (ramps)
let trail=[];              // sparkle particles
let confetti=[];
let bgScroll=0, hills=0;
let flash={a:0,col:'#fff'};
let lastT=performance.now();

function resetRun(){ levelIdx=0; stepInLvl=0; score=0; streak=0; hearts=3; prizes=[]; player.lane=0; player.y=LANE_Y[0]; player.targetY=LANE_Y[0]; }

function startLevel(i){
  levelIdx=i; stepInLvl=0; state='play';
  player.lane=0; player.y=LANE_Y[0]; player.targetY=LANE_Y[0];
  spawnGate();
}

function spawnGate(){
  const L=LEVELS[levelIdx];
  const {q,ans}=L.gen(stepInLvl);
  const choices=makeChoices(ans);
  // slow at first; ramps with step and level
  const base=92 + levelIdx*16;
  speed = base + stepInLvl*9;
  gate={ x:W+CARD_W, q, ans, choices, correctLane:choices.indexOf(ans), locked:false, result:null, resolveT:0 };
  player.lane=0; player.targetY=LANE_Y[0];
}

/* ---------- input: tap hops up one lane, wraps at top ---------- */
function hop(){
  if(state==='menu'){ Audio8.startMusic(); startLevel(0); return; }
  if(state==='over'||state==='won'){ resetRun(); state='menu'; return; }
  if(state==='levelup'){ startLevel(levelIdx+1); return; }
  if(state!=='play' || !gate || gate.locked) return;
  player.lane=(player.lane+1)%3;
  player.targetY=LANE_Y[player.lane];
  player.hopT=0.18;
  Audio8.sfx('hop');
}

/* mute button hit-test region (top-right) */
const MUTE={x:W-58,y:18,w:40,h:40};
function pointInMute(px,py){ return px>=MUTE.x&&px<=MUTE.x+MUTE.w&&py>=MUTE.y&&py<=MUTE.y+MUTE.h; }

function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY);
  // account for object-fit:contain letterboxing
  const scale=Math.min(r.width/W, r.height/H);
  const offX=(r.width - W*scale)/2, offY=(r.height - H*scale)/2;
  return { x:(cx-r.left-offX)/scale, y:(cy-r.top-offY)/scale };
}
function onPress(e){
  e.preventDefault();
  const p=canvasPoint(e);
  if(pointInMute(p.x,p.y)){ Audio8.toggle(); Audio8.sfx('select'); return; }
  hop();
}
cv.addEventListener('mousedown',onPress);
cv.addEventListener('touchstart',onPress,{passive:false});
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); hop(); } });

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  bgScroll=(bgScroll+ dt*(state==='play'?70:24))%160;
  hills=(hills+dt*14)%W;
  player.bob+=dt*4;
  if(player.hopT>0) player.hopT-=dt;
  if(player.moodT>0){ player.moodT-=dt; if(player.moodT<=0) player.mood='run'; }
  // ease creature toward its lane
  player.y += (player.targetY - player.y)*Math.min(1,dt*12);

  // trail sparkles
  if(state==='play'||state==='levelup'){
    if(Math.random()<0.6) trail.push({x:PLAYER_X-18,y:player.y+10,vx:-30-Math.random()*40,vy:(Math.random()-0.5)*30,life:0.5,r:2+Math.random()*3,c:Math.random()<0.5?C.glow:C.spark});
  }
  trail=trail.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; return p.life>0; });
  confetti=confetti.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=400*dt; p.rot+=p.vr*dt; return p.life>0 && p.y<H+40; });
  if(flash.a>0) flash.a=Math.max(0,flash.a-dt*1.6);

  if(state==='play' && gate){
    gate.x -= speed*dt;
    if(!gate.locked && gate.x <= PLAYER_X){
      // lock in the answer at the creature's lane
      gate.locked=true;
      const chosen=gate.choices[player.lane];
      gate.result=(chosen===gate.ans);
      gate.resolveT=0.9;
      if(gate.result){
        score+=10+streak*2; streak++; player.mood='happy'; player.moodT=0.7;
        Audio8.sfx('good'); flash={a:0.35,col:'#bff7d8'};
        for(let i=0;i<18;i++) confetti.push({x:PLAYER_X+10,y:player.y,vx:(Math.random()-0.3)*260,vy:-Math.random()*320-60,life:1.1,r:4+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-0.5)*12,c:pick([C.glow,C.coral,C.mint,C.spark])});
      } else {
        streak=0; hearts--; player.mood='oops'; player.moodT=0.7;
        Audio8.sfx('bad'); flash={a:0.4,col:'#ffb3b8'};
      }
      state='resolve';
    }
  }

  if(state==='resolve' && gate){
    gate.x -= speed*0.4*dt;
    gate.resolveT-=dt;
    if(gate.resolveT<=0){
      if(hearts<=0){ Audio8.sfx('bad'); state='over'; return; }
      stepInLvl++;
      const L=LEVELS[levelIdx];
      if(stepInLvl>=L.count){
        prizes.push(levelIdx);
        Audio8.sfx('win');
        for(let i=0;i<60;i++) confetti.push({x:W/2,y:H/2,vx:(Math.random()-0.5)*520,vy:-Math.random()*420-80,life:1.6,r:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-0.5)*14,c:pick([C.glow,C.coral,C.mint,C.spark,'#fff'])});
        state = (levelIdx>=LEVELS.length-1)?'won':'levelup';
      } else {
        spawnGate(); state='play';
      }
    }
  }
}

/* ============================================================
   DRAW HELPERS
   ============================================================ */
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function drawBackground(){
  // sky gradient
  const sky=g.createLinearGradient(0,0,0,FLOOR_Y);
  sky.addColorStop(0,C.skyTop); sky.addColorStop(.55,C.skyMid); sky.addColorStop(1,C.skyLow);
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // sun
  g.save(); g.globalAlpha=.9;
  const sun=g.createRadialGradient(770,120,8,770,120,90);
  sun.addColorStop(0,'#fff6d8'); sun.addColorStop(.5,C.sun); sun.addColorStop(1,'rgba(255,180,120,0)');
  g.fillStyle=sun; g.beginPath(); g.arc(770,120,90,0,7); g.fill(); g.restore();
  // stars
  g.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<26;i++){ const x=(i*97+13)%W, y=(i*53)%200; g.globalAlpha=.3+0.5*Math.abs(Math.sin(i+bgScroll*0.04)); g.fillRect(x,y,2,2);} g.globalAlpha=1;
  // rolling hills (parallax)
  const drawHill=(off,base,col,amp)=>{ g.fillStyle=col; g.beginPath(); g.moveTo(0,FLOOR_Y);
    for(let x=0;x<=W;x+=20){ const y=base + Math.sin((x+off)/120)*amp; g.lineTo(x,y);} g.lineTo(W,FLOOR_Y); g.closePath(); g.fill(); };
  drawHill(hills*0.4, 360, '#6f4a9c', 26);
  drawHill(hills*0.8+90, 400, '#8a5aa6', 22);
  // ground
  g.fillStyle=C.leaf; g.fillRect(0,FLOOR_Y,W,H-FLOOR_Y);
  g.fillStyle=C.leafDk;
  for(let x=-((bgScroll)%80); x<W; x+=80){ g.beginPath(); g.moveTo(x,FLOOR_Y); g.lineTo(x+18,FLOOR_Y); g.lineTo(x+9,FLOOR_Y-12); g.closePath(); g.fill(); }
  g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(0,FLOOR_Y,W,4);
}

/* the mascot: an original glowing fox-spark */
function drawCreature(x,y,mood){
  const bob=Math.sin(player.bob)*3 + (player.hopT>0?-10:0);
  y+=bob;
  g.save();
  // soft glow
  const gl=g.createRadialGradient(x,y,4,x,y,46); gl.addColorStop(0,'rgba(255,224,138,.55)'); gl.addColorStop(1,'rgba(255,224,138,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(x,y,46,0,7); g.fill();
  // tail
  g.fillStyle=C.coral; g.beginPath(); g.moveTo(x-14,y+6); g.quadraticCurveTo(x-44,y-6,x-30,y-26); g.quadraticCurveTo(x-22,y-8,x-12,y-2); g.closePath(); g.fill();
  g.fillStyle=C.glow; g.beginPath(); g.moveTo(x-26,y-20); g.quadraticCurveTo(x-34,y-12,x-22,y-6); g.quadraticCurveTo(x-22,y-14,x-18,y-12); g.closePath(); g.fill();
  // body
  g.fillStyle='#ffb14e';
  g.beginPath(); g.ellipse(x,y,24,22,0,0,7); g.fill();
  g.fillStyle='#fff4e6'; g.beginPath(); g.ellipse(x+2,y+8,13,11,0,0,7); g.fill(); // belly
  // ears
  g.fillStyle='#ffb14e';
  g.beginPath(); g.moveTo(x-12,y-16); g.lineTo(x-20,y-36); g.lineTo(x-2,y-22); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(x+12,y-16); g.lineTo(x+20,y-36); g.lineTo(x+2,y-22); g.closePath(); g.fill();
  g.fillStyle=C.coral;
  g.beginPath(); g.moveTo(x-13,y-20); g.lineTo(x-17,y-31); g.lineTo(x-7,y-23); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(x+13,y-20); g.lineTo(x+17,y-31); g.lineTo(x+7,y-23); g.closePath(); g.fill();
  // cheeks
  g.fillStyle='rgba(255,122,133,.7)'; g.beginPath(); g.arc(x-13,y+4,4,0,7); g.fill(); g.beginPath(); g.arc(x+13,y+4,4,0,7); g.fill();
  // eyes
  g.fillStyle=C.ink;
  if(mood==='oops'){ g.fillRect(x-11,y-4,7,2); g.fillRect(x+5,y-4,7,2); }
  else { g.beginPath(); g.arc(x-8,y-3,3.4,0,7); g.fill(); g.beginPath(); g.arc(x+8,y-3,3.4,0,7); g.fill();
    g.fillStyle='#fff'; g.beginPath(); g.arc(x-7,y-4,1.2,0,7); g.fill(); g.beginPath(); g.arc(x+9,y-4,1.2,0,7); g.fill(); }
  // mouth
  g.strokeStyle=C.ink; g.lineWidth=2; g.beginPath();
  if(mood==='happy'){ g.arc(x,y+4,5,0.1,Math.PI-0.1); } else if(mood==='oops'){ g.arc(x,y+10,4,Math.PI+0.2,-0.2); } else { g.moveTo(x-3,y+5); g.lineTo(x+3,y+5); }
  g.stroke();
  g.restore();
}

/* themed answer container with a number */
function drawCard(x,y,val,theme,selected,reveal){
  // reveal: 'right' green, 'wrong' red-dim, null normal
  g.save();
  let body=C.cream, ring='#ffffff';
  if(theme==='balloon'){ body='#ff7a85'; ring='#ffd0d4'; }
  else if(theme==='apple'){ body='#e8504e'; ring='#ffd2c0'; }
  else if(theme==='bubble'){ body='rgba(150,225,255,.85)'; ring='#eafaff'; }
  else if(theme==='crystal'){ body='#9b7bff'; ring='#e7dcff'; }

  if(reveal==='right'){ body=C.leaf; ring=C.mint; }
  if(reveal==='wrong'){ g.globalAlpha=.45; }

  const cx=x+CARD_W/2, cy=y+CARD_H/2;
  // selected pulse ring
  if(selected){
    g.save(); g.globalAlpha=.9;
    const p=4+Math.sin(performance.now()/120)*3;
    g.strokeStyle=C.glow; g.lineWidth=6; rr(x-7-p/2,y-7-p/2,CARD_W+14+p,CARD_H+14+p,26); g.stroke();
    g.restore();
  }

  // container shape
  if(theme==='balloon'||theme==='apple'){
    g.fillStyle=body; g.beginPath(); g.ellipse(cx,cy,CARD_W/2,CARD_H/2,0,0,7); g.fill();
    if(theme==='apple'){ g.fillStyle='#7a4a2a'; g.fillRect(cx-2,y-6,4,12); g.fillStyle=C.leaf; g.beginPath(); g.ellipse(cx+10,y-2,9,5,-0.5,0,7); g.fill(); }
    if(theme==='balloon'){ g.fillStyle=body; g.beginPath(); g.moveTo(cx-5,y+CARD_H-6); g.lineTo(cx+5,y+CARD_H-6); g.lineTo(cx,y+CARD_H+6); g.closePath(); g.fill(); }
  } else if(theme==='bubble'){
    g.fillStyle=body; g.beginPath(); g.arc(cx,cy,CARD_W/2,0,7); g.fill();
    g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2; g.beginPath(); g.arc(cx,cy,CARD_W/2-3,0,7); g.stroke();
  } else if(theme==='crystal'){
    g.fillStyle=body; g.beginPath();
    g.moveTo(cx,y-4); g.lineTo(x+CARD_W,cy-14); g.lineTo(x+CARD_W-10,y+CARD_H); g.lineTo(x+10,y+CARD_H); g.lineTo(x,cy-14); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(cx,y-4); g.lineTo(cx,y+CARD_H); g.lineTo(x+10,y+CARD_H); g.lineTo(x,cy-14); g.closePath(); g.fill();
  }
  // gloss
  g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(cx-14,cy-18,12,7,-0.5,0,7); g.fill();
  // number
  g.fillStyle=(theme==='bubble')?C.ink:'#fff';
  g.font='700 40px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=4; g.strokeStyle='rgba(0,0,0,.22)';
  g.strokeText(val,cx,cy+1); g.fillText(val,cx,cy+1);
  g.restore();
}

function drawParticles(){
  trail.forEach(p=>{ g.globalAlpha=Math.max(0,p.life*2); g.fillStyle=p.c; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); });
  g.globalAlpha=1;
  confetti.forEach(p=>{ g.save(); g.globalAlpha=Math.min(1,p.life); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c; g.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); g.restore(); });
  g.globalAlpha=1;
}

function drawHUD(){
  // problem banner (top center) — only while a gate is live
  if((state==='play'||state==='resolve') && gate){
    g.save();
    const bw=300, bx=W/2-bw/2, by=24, bh=70;
    g.fillStyle='rgba(35,22,53,.78)'; rr(bx,by,bw,bh,20); g.fill();
    g.strokeStyle=C.glow; g.lineWidth=3; rr(bx,by,bw,bh,20); g.stroke();
    g.fillStyle=C.cream; g.font='700 44px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(gate.q+' = ?', W/2, by+bh/2+2);
    g.restore();
  }
  // score (top-left)
  g.fillStyle=C.cream; g.font='600 24px Fredoka, sans-serif'; g.textAlign='left'; g.textBaseline='top';
  g.fillText('⭐ '+score, 22, 22);
  g.font='600 18px Fredoka, sans-serif';
  if(state==='play'||state==='resolve'){
    g.fillStyle='rgba(255,244,230,.85)'; g.fillText(LEVELS[levelIdx].name+'  ·  '+(stepInLvl+1)+'/'+LEVELS[levelIdx].count, 22, 52);
    if(streak>1){ g.fillStyle=C.glow; g.fillText('🔥 '+streak+' in a row!', 22, 76); }
  }
  // hearts (center-top under banner? keep left under level)
  g.font='22px Fredoka, sans-serif'; g.textAlign='left';
  let hx=22, hy=H-40; for(let i=0;i<3;i++){ g.globalAlpha=i<hearts?1:.25; g.fillText('❤️', hx+i*30, hy); } g.globalAlpha=1;

  // lane hint arrow on creature's active lane
  if(state==='play'){
    g.fillStyle=C.glow; const ly=LANE_Y[player.lane];
    g.beginPath(); g.moveTo(PLAYER_X-70,ly); g.lineTo(PLAYER_X-54,ly-9); g.lineTo(PLAYER_X-54,ly+9); g.closePath(); g.fill();
  }

  // mute button
  g.save(); g.fillStyle='rgba(35,22,53,.7)'; rr(MUTE.x,MUTE.y,MUTE.w,MUTE.h,12); g.fill();
  g.fillStyle=C.cream; g.font='20px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(Audio8.isMuted()?'🔇':'🔊', MUTE.x+MUTE.w/2, MUTE.y+MUTE.h/2+1); g.restore();
}

/* ----- overlay screens ----- */
function panel(title,sub,btn,extra){
  g.fillStyle='rgba(20,12,38,.72)'; g.fillRect(0,0,W,H);
  g.fillStyle=C.cream; g.textAlign='center';
  g.font='700 64px Fredoka, sans-serif'; g.fillText(title,W/2,H/2-70);
  if(sub){ g.font='600 26px Fredoka, sans-serif'; g.fillStyle=C.glow; g.fillText(sub,W/2,H/2-12); }
  if(extra) extra();
  // button
  const bw=300,bx=W/2-bw/2,by=H/2+58,bh=64;
  g.fillStyle=C.coral; rr(bx,by,bw,bh,22); g.fill();
  g.fillStyle='#fff'; g.font='700 30px Fredoka, sans-serif'; g.textBaseline='middle';
  g.fillText(btn,W/2,by+bh/2+1); g.textBaseline='alphabetic';
}

function drawMenu(){
  g.textAlign='center';
  // title
  g.save(); g.font='700 84px Fredoka, sans-serif';
  g.fillStyle=C.glow; g.fillText('Spark Run',W/2+3,150+3);
  g.fillStyle=C.coral; g.fillText('Spark Run',W/2,150);
  g.restore();
  g.fillStyle=C.cream; g.font='600 26px Fredoka, sans-serif'; g.fillText('A Maths Adventure',W/2,196);
  // mascot demo
  drawCreature(W/2,300,'happy');
  // how-to
  g.font='600 22px Fredoka, sans-serif'; g.fillStyle=C.cream;
  g.fillText('Tap to HOP up • land on the right answer', W/2, 388);
  g.fillStyle='rgba(255,244,230,.8)'; g.font='600 18px Fredoka, sans-serif';
  g.fillText('ground → middle → high → back to ground', W/2, 416);
  // start button
  const bw=280,bx=W/2-bw/2,by=448,bh=60;
  g.fillStyle=C.leaf; rr(bx,by,bw,bh,22); g.fill();
  g.fillStyle='#fff'; g.font='700 30px Fredoka, sans-serif'; g.textBaseline='middle'; g.fillText('▶  Play',W/2,by+bh/2+1); g.textBaseline='alphabetic';
}

function drawLevelUp(){
  panel('Level Done!','You earned a Spark Friend ✨','Tap for next level →', ()=>{
    // show collected prizes as little creatures
    const n=prizes.length; const startX=W/2-(n-1)*36;
    for(let i=0;i<n;i++){ g.save(); g.translate(startX+i*72, H/2+18); g.scale(.55,.55); drawCreature(0,0,'happy'); g.restore(); }
    g.fillStyle=C.cream; g.font='600 22px Fredoka, sans-serif'; g.textAlign='center';
    g.fillText('Score: '+score, W/2, H/2+44);
  });
}
function drawWon(){
  panel('You Did It! 🏆', 'Final score: '+score, 'Tap to play again', ()=>{
    const n=prizes.length; const startX=W/2-(n-1)*40;
    for(let i=0;i<n;i++){ g.save(); g.translate(startX+i*80, H/2+18); g.scale(.6,.6); drawCreature(0,0,'happy'); g.restore(); }
  });
}
function drawOver(){
  panel('Try Again!', 'Score: '+score, 'Tap to restart', ()=>{
    drawCreature(W/2,H/2+24,'oops');
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  drawBackground();
  drawParticles();

  if(state==='menu'){ drawMenu(); drawMuteOnly(); return; }
  if(state==='levelup'){ drawCreature(PLAYER_X,player.y,'happy'); drawLevelUp(); return; }
  if(state==='won'){ drawWon(); return; }
  if(state==='over'){ drawOver(); return; }

  // gate cards
  if(gate){
    const L=LEVELS[levelIdx];
    for(let lane=0;lane<3;lane++){
      const y=LANE_Y[lane]-CARD_H/2;
      let reveal=null;
      if(state==='resolve'){
        if(lane===gate.correctLane) reveal='right';
        else if(lane===player.lane && !gate.result) reveal='wrong';
      }
      const selected=(state==='play'&&lane===player.lane);
      drawCard(gate.x, y, gate.choices[lane], L.theme, selected, reveal);
    }
  }
  drawCreature(PLAYER_X, player.y, player.mood);
  drawHUD();

  // hit/miss flash
  if(flash.a>0){ g.fillStyle=flash.col; g.globalAlpha=flash.a; g.fillRect(0,0,W,H); g.globalAlpha=1; }
}
function drawMuteOnly(){
  g.save(); g.fillStyle='rgba(35,22,53,.7)'; rr(MUTE.x,MUTE.y,MUTE.w,MUTE.h,12); g.fill();
  g.fillStyle=C.cream; g.font='20px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(Audio8.isMuted()?'🔇':'🔊', MUTE.x+MUTE.w/2, MUTE.y+MUTE.h/2+1); g.restore();
}

/* ============================================================
   LOOP
   ============================================================ */
function frame(now){
  let dt=(now-lastT)/1000; lastT=now; if(dt>0.05) dt=0.05;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
